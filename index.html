      // -----------------------------------------------------------------------
      // מסך 1: דופק ומשימות (Bento + Temporal Triage + Progressive Disclosure)
      // -----------------------------------------------------------------------
      buildHomeView() {
        const allTasks = this.tasksList;
        const urgentRadar = AlertEngine.getUrgentDeadlineTasks(allTasks);
        const fin = FinanceEngine.computeSummary(this.expensesList);

        // סינון משימות
        const q = this.taskFilters.q.trim().toLowerCase();
        const filtered = allTasks.filter(t => {
          if (this.taskFilters.radarOnly && !urgentRadar.some(u => u.id === t.id)) return false;
          if (this.taskFilters.who === 'ronen' && !(t.assignee === 'ronen' || t.assignee === 'both')) return false;
          if (this.taskFilters.who === 'adi' && !(t.assignee === 'adi' || t.assignee === 'both')) return false;
          if (this.taskFilters.who === 'both' && t.assignee !== 'both') return false;
          if (this.taskFilters.category !== 'all' && t.category !== this.taskFilters.category) return false;
          if (q) {
            const hay = `${t.title} ${t.notes} ${(t.subtasks || []).map(s => s.title).join(' ')}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const sortGroup = arr => arr.sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          if (a.dueDate && b.dueDate && a.dueDate !== b.dueDate) return a.dueDate.localeCompare(b.dueDate);
          if (a.dueDate && !b.dueDate) return -1;
          if (!a.dueDate && b.dueDate) return 1;
          return (PRIORITIES[b.priority]?.weight || 2) - (PRIORITIES[a.priority]?.weight || 2);
        });

        const gUrgent = sortGroup(filtered.filter(t => { const c = AlertEngine.classifyTask(t); return c === 'overdue' || c === 'today'; }));
        const gWeek   = sortGroup(filtered.filter(t => AlertEngine.classifyTask(t) === 'week'));
        const gLater  = sortGroup(filtered.filter(t => AlertEngine.classifyTask(t) === 'later'));
        const gDone   = filtered.filter(t => t.done).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));

        const radarCardTone = urgentRadar.some(t => AlertEngine.classifyTask(t) === 'overdue')
          ? 'border-rose-500/40 bg-rose-500/8'
          : urgentRadar.length > 0
          ? 'border-amber-500/40 bg-amber-500/8'
          : 'border-emerald-500/30 bg-emerald-500/6';

        const nextUrgent = urgentRadar[0];

        return `
          <!-- 2 אריחי Bento קומפקטיים בלבד -->
          <section class="grid grid-cols-2 gap-2.5">
            <button type="button" data-act="toggle-radar-filter" class="card-surface ${radarCardTone} ${this.taskFilters.radarOnly ? 'ring-2 ring-indigo-500' : ''} rounded-2xl p-3.5 text-right transition-all cursor-pointer">
              <div class="flex items-center justify-between text-[11px] font-bold text-sub mb-1">
                <span>🔔 רדאר דדליינים</span>
                <span class="font-mono-num px-1.5 py-0.5 rounded-md bg-black/5 dark:bg-white/10">${urgentRadar.length}</span>
              </div>
              <div class="font-extrabold text-sm sm:text-base text-main truncate">
                ${urgentRadar.length === 0 ? 'הכל רגוע ✨' : `${urgentRadar.length} מתקרבים`}
              </div>
              <div class="text-[11px] text-sub truncate mt-0.5">
                ${nextUrgent ? `${formatShortHebDate(nextUrgent.dueDate)} • ${esc(nextUrgent.title)}` : 'אין דדליינים ב-3 ימים הקרובים'}
              </div>
            </button>

            <button type="button" data-act="tab" data-tab="wallet" class="card-surface rounded-2xl p-3.5 text-right transition-all hover:border-indigo-400 cursor-pointer">
              <div class="flex items-center justify-between text-[11px] font-bold text-sub mb-1">
                <span>💸 מאזן החזרים</span>
                <span class="text-indigo-500">לארנק ←</span>
              </div>
              <div class="font-extrabold text-sm sm:text-base font-mono-num ${fin.balanceAgorot === 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-main'} truncate">
                ${esc(fin.direction.shortText)}
              </div>
              <div class="text-[11px] text-sub truncate mt-0.5">
                החודש: ${formatILS(fin.thisMonthTotalAgorot)} (כולל משותף)
              </div>
            </button>
          </section>

          <!-- בר הוספה בנגיעה אחת (Quick Launch Bar) -->
          <section class="flex gap-2">
            <button type="button" data-act="open-quick" data-mode="task" class="flex-1 card-surface rounded-2xl px-4 py-3 text-right flex items-center justify-between gap-2 text-sub hover:border-indigo-400 transition-all cursor-pointer">
              <span class="text-xs sm:text-sm font-medium truncate">✨ הוסף משימה... (נסה: "להזמין פילטרים מחר @רונן")</span>
              <span class="px-2.5 py-1 rounded-xl bg-indigo-600 text-white text-xs font-extrabold shrink-0">+ משימה</span>
            </button>
            <button type="button" data-act="open-quick" data-mode="expense" class="card-surface rounded-2xl px-3.5 py-3 text-xs font-extrabold text-emerald-600 dark:text-emerald-400 hover:border-emerald-400 shrink-0 cursor-pointer">
              💸 + הוצאה
            </button>
          </section>

          <!-- סרגל סינון קליל ונושם -->
          <section class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
              ${[
                { id: 'all', label: 'הכל' },
                { id: 'ronen', label: '👨🏻‍💻 רונן' },
                { id: 'adi', label: '👩🏻 עדי' },
                { id: 'both', label: '💑 משותף' }
              ].map(p => `
                <button type="button" data-act="filter-who" data-val="${p.id}" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer transition-all ${
                  this.taskFilters.who === p.id ? 'bg-slate-900 text-white dark:bg-indigo-600' : 'card-surface text-sub'
                }">${p.label}</button>
              `).join('')}

              <span class="text-dim px-0.5">|</span>

              <button type="button" data-act="filter-cat" data-val="all" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${this.taskFilters.category === 'all' ? 'bg-indigo-600/15 text-indigo-600 dark:text-indigo-300' : 'text-sub'}">כל הנושאים</button>
              ${Object.values(CATEGORIES).map(c => `
                <button type="button" data-act="filter-cat" data-val="${c.id}" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${this.taskFilters.category === c.id ? 'bg-indigo-600/15 text-indigo-600 dark:text-indigo-300' : 'text-sub'}">${c.icon} ${c.label}</button>
              `).join('')}
            </div>

            <input
              type="search"
              id="home-search-input"
              value="${esc(this.taskFilters.q)}"
              placeholder="🔍 חיפוש מהיר..."
              class="input-surface rounded-xl px-3 py-1.5 text-xs sm:w-44 shrink-0"
            />
          </section>

          <!-- רשימת משימות לפי אופק זמן -->
          <div class="space-y-4">
            ${this.buildTaskGroup('🔥 באיחור והיום', gUrgent, 'text-rose-600 dark:text-rose-400')}
            ${this.buildTaskGroup('📅 7 ימים קרובים', gWeek, 'text-amber-600 dark:text-amber-400')}
            ${this.buildTaskGroup('📌 בהמשך / ללא דדליין', gLater, 'text-sub')}

            ${gUrgent.length === 0 && gWeek.length === 0 && gLater.length === 0 ? `
              <div class="card-surface rounded-3xl p-8 text-center space-y-2">
                <div class="text-3xl">🎉</div>
                <div class="font-extrabold text-main">הלוח נקי!</div>
                <p class="text-xs text-sub">אין משימות פתוחות תחת הסינון הנוכחי.</p>
              </div>
            ` : ''}

            <!-- הושלמו לאחרונה (מתקפל כדי לשמור על שקט ויזואלי) -->
            ${gDone.length > 0 ? `
              <section class="pt-1">
                <button type="button" data-act="toggle-done-section" class="flex items-center gap-2 text-xs font-extrabold text-dim hover:text-main cursor-pointer mb-2">
                  <span>${this.showDoneSection ? '▾' : '◂'}</span>
                  <span>✅ הושלמו (${gDone.length})</span>
                </button>
                ${this.showDoneSection ? `<div class="space-y-2">${gDone.map(t => this.buildTaskRow(t)).join('')}</div>` : ''}
              </section>
            ` : ''}
          </div>
        `;
      }

      buildTaskGroup(heading, tasks, colorClass) {
        if (!tasks.length) return '';
        return `
          <section class="space-y-2">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-extrabold tracking-wide ${colorClass}">${heading}</h2>
              <span class="text-[11px] font-mono-num text-dim">${tasks.length}</span>
            </div>
            <div class="space-y-2">
              ${tasks.map(t => this.buildTaskRow(t)).join('')}
            </div>
          </section>
        `;
      }

      buildTaskRow(t) {
        const isOpen = this.expandedTaskId === t.id;
        const cat = CATEGORIES[t.category] || CATEGORIES.other;
        const own = USERS[t.assignee] || USERS.both;
        const bucket = AlertEngine.classifyTask(t);
        const subs = t.subtasks || [];
        const subsDone = subs.filter(s => s.done).length;

        const dateBadgeClass = bucket === 'overdue'
          ? 'bg-rose-500/15 text-rose-600 dark:text-rose-400 font-extrabold'
          : bucket === 'today'
          ? 'bg-amber-500/15 text-amber-700 dark:text-amber-300 font-extrabold'
          : 'elevated-surface text-sub';

        const linkHref = safeUrl(t.link);

        return `
          <article class="card-surface swipe-card anim-row rounded-2xl overflow-hidden ${t.done ? 'opacity-65' : ''} ${t.pinned && !t.done ? 'ring-1 ring-indigo-500/50' : ''}" data-swipe-id="${t.id}">
            <!-- שורה סגורה קומפקטית ונקייה -->
            <div class="px-3.5 py-3 flex items-center gap-3">
              <button type="button" data-act="toggle-task" data-id="${t.id}" class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 cursor-pointer transition-all ${
                t.done
                  ? 'bg-emerald-500 border-emerald-500 text-white anim-pop'
                  : t.priority === 'urgent'
                  ? 'border-rose-500 hover:bg-rose-500/10'
                  : 'border-slate-300 dark:border-slate-600 hover:border-indigo-500'
              }" aria-label="סמן בוצע">
                ${t.done ? '<span class="text-xs font-black">✓</span>' : ''}
              </button>

              <div data-act="expand-task" data-id="${t.id}" class="flex-1 min-w-0 cursor-pointer">
                <div class="flex items-center gap-1.5">
                  ${t.pinned ? '<span class="text-xs" title="נעוץ">📌</span>' : ''}
                  ${t.priority === 'urgent' && !t.done ? '<span class="text-xs" title="דחוף">🔥</span>' : ''}
                  <span class="font-bold text-sm text-main truncate ${t.done ? 'line-through text-dim' : ''}">${esc(t.title)}</span>
                </div>

                <div class="flex items-center flex-wrap gap-1.5 mt-1 text-[11px]">
                  <span class="text-sub">${cat.icon} ${cat.label}</span>
                  ${t.dueDate ? `<span class="px-1.5 py-0.5 rounded-md ${dateBadgeClass}">📅 ${esc(formatShortHebDate(t.dueDate))}${t.dueTime ? ' ' + esc(t.dueTime) : ''}</span>` : ''}
                  ${subs.length ? `<span class="font-mono-num px-1.5 py-0.5 rounded-md elevated-surface text-sub">✓ ${subsDone}/${subs.length}</span>` : ''}
                  ${t.estimatedBudget > 0 ? `<span class="font-mono-num text-emerald-600 dark:text-emerald-400 font-bold">₪${t.estimatedBudget.toLocaleString()}</span>` : ''}
                  ${t.reaction ? `<span>${esc(t.reaction)}</span>` : ''}
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <span class="w-7 h-7 rounded-full elevated-surface flex items-center justify-center text-sm" title="${own.name}">${own.avatar}</span>
                <button type="button" data-act="expand-task" data-id="${t.id}" class="w-7 h-7 rounded-lg text-dim hover:text-main flex items-center justify-center text-xs cursor-pointer">
                  ${isOpen ? '▴' : '▾'}
                </button>
              </div>
            </div>

            <!-- אזור פתוח (Progressive Disclosure) -->
            ${isOpen ? `
              <div class="px-3.5 pb-3.5 pt-2 border-t border-soft space-y-3 bg-black/[0.015] dark:bg-white/[0.02]">
                ${t.notes ? `<p class="text-xs text-sub leading-relaxed whitespace-pre-wrap">📝 ${esc(t.notes)}</p>` : ''}
                ${linkHref ? `<a href="${esc(linkHref)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline">🔗 פתח קישור מצורף ↗</a>` : ''}

                <!-- תתי-משימות עם תמיכה מלאה ב-Enter -->
                <div class="space-y-1.5">
                  ${subs.map(s => `
                    <div class="flex items-center justify-between gap-2 py-1 px-2 rounded-xl elevated-surface">
                      <label class="flex items-center gap-2 text-xs cursor-pointer flex-1">
                        <input type="checkbox" data-act="toggle-sub" data-id="${t.id}" data-sub="${s.id}" ${s.done ? 'checked' : ''} class="w-4 h-4 accent-indigo-600 cursor-pointer" />
                        <span class="${s.done ? 'line-through text-dim' : 'text-main font-medium'}">${esc(s.title)}</span>
                      </label>
                      <button type="button" data-act="del-sub" data-id="${t.id}" data-sub="${s.id}" class="text-dim hover:text-rose-500 text-xs px-1 cursor-pointer">✕</button>
                    </div>
                  `).join('')}

                  <form data-sub-form="${t.id}" class="flex gap-1.5 pt-0.5">
                    <input type="text" id="sub-input-${t.id}" placeholder="הוסף שלב ולחץ Enter..." class="input-surface flex-1 rounded-xl px-3 py-1.5 text-xs" />
                    <button type="submit" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">+ שלב</button>
                  </form>
                </div>

                <!-- סרגל פעולות חכמות למשימה -->
                <div class="flex flex-wrap items-center justify-between gap-1.5 pt-2 border-t border-soft">
                  <div class="flex flex-wrap items-center gap-1">
                    ${t.dueDate ? `<button type="button" data-act="ics-single" data-id="${t.id}" class="px-2.5 py-1 rounded-lg elevated-surface text-[11px] font-bold text-indigo-600 dark:text-indigo-300 cursor-pointer">🔔 ליומן (.ics)</button>` : ''}
                    ${!t.done ? `<button type="button" data-act="snooze-task" data-id="${t.id}" class="px-2.5 py-1 rounded-lg elevated-surface text-[11px] font-bold text-sub cursor-pointer">⏰ למחר</button>` : ''}
                    <button type="button" data-act="task-to-expense" data-id="${t.id}" class="px-2.5 py-1 rounded-lg elevated-surface text-[11px] font-bold text-emerald-600 dark:text-emerald-400 cursor-pointer">💸 רשום הוצאה</button>
                    <button type="button" data-act="react-task" data-id="${t.id}" class="px-2 py-1 rounded-lg elevated-surface text-[11px] cursor-pointer" title="שלח פרגון">${t.reaction || '❤️'}</button>
                  </div>

                  <div class="flex items-center gap-1">
                    <button type="button" data-act="pin-task" data-id="${t.id}" class="p-1.5 rounded-lg elevated-surface text-xs cursor-pointer" title="נעיצה">${t.pinned ? '📌' : '📍'}</button>
                    <button type="button" data-act="open-edit-task" data-id="${t.id}" class="px-2.5 py-1 rounded-lg bg-indigo-600/12 text-indigo-600 dark:text-indigo-300 text-[11px] font-extrabold cursor-pointer">✏️ ערוך</button>
                    <button type="button" data-act="wa-single" data-id="${t.id}" class="p-1.5 rounded-lg elevated-surface text-xs cursor-pointer" title="שלח בוואטסאפ">📲</button>
                    <button type="button" data-act="del-task" data-id="${t.id}" class="p-1.5 rounded-lg text-dim hover:text-rose-500 text-xs cursor-pointer" title="מחק">🗑️</button>
                  </div>
                </div>
              </div>
            ` : ''}
          </article>
        `;
      }

      // -----------------------------------------------------------------------
      // מסך 2: ארנק והתחשבנות (אשראי אישי vs אשראי משותף)
      // -----------------------------------------------------------------------
      buildWalletView() {
        const all = this.expensesList;
        const fin = FinanceEngine.computeSummary(all);
        const thisMonth = todayISO(0).slice(0, 7);

        const visible = all.filter(e => {
          if (this.walletFilter.period === 'month' && !(e.date || '').startsWith(thisMonth)) return false;
          if (this.walletFilter.method === 'personal') return e.paymentMethod === 'personal' || e.splitType === 'settlement';
          if (this.walletFilter.method === 'joint_card') return e.paymentMethod === 'joint_card' && e.splitType !== 'settlement';
          return true;
        });

        const totalCatSum = Object.values(fin.byCategory).reduce((a, b) => a + b, 0) || 1;
        const catEntries = Object.entries(fin.byCategory).sort((a, b) => b[1] - a[1]);

        return `
          <!-- כרטיס מאזן ראשי (Hero Settlement Card) -->
          <section class="rounded-3xl p-5 text-white shadow-lg bg-gradient-to-br ${
            fin.balanceAgorot === 0
              ? 'from-emerald-600 to-teal-700'
              : fin.balanceAgorot > 0
              ? 'from-indigo-600 via-indigo-700 to-violet-700'
              : 'from-pink-600 via-rose-600 to-indigo-700'
          } space-y-4">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-xs font-bold text-white/80">מאזן התחשבנות אישי (ללא אשראי משותף)</div>
                <div class="text-2xl sm:text-3xl font-black mt-1 font-mono-num">
                  ${fin.balanceAgorot === 0 ? '₪0 — מאוזנים!' : formatILS(Math.abs(fin.balanceAgorot))}
                </div>
                <div class="text-xs sm:text-sm font-bold text-white/95 mt-0.5">${esc(fin.direction.fullText)}</div>
              </div>
              <button type="button" data-act="open-quick" data-mode="expense" class="px-3.5 py-2 rounded-2xl bg-white text-slate-900 text-xs font-black shadow-md cursor-pointer shrink-0 active:scale-95 transition-transform">
                + הוצאה
              </button>
            </div>

            <!-- 3 מדדי עזר -->
            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/20 text-[11px]">
              <div class="bg-white/10 rounded-xl p-2">
                <span class="block text-white/75">👨🏻‍💻 אישי רונן</span>
                <strong class="font-mono-num text-xs sm:text-sm">${formatILS(fin.personalRonenAgorot)}</strong>
              </div>
              <div class="bg-white/10 rounded-xl p-2">
                <span class="block text-white/75">👩🏻 אישי עדי</span>
                <strong class="font-mono-num text-xs sm:text-sm">${formatILS(fin.personalAdiAgorot)}</strong>
              </div>
              <div class="bg-white/10 rounded-xl p-2">
                <span class="block text-white/75">🏦 אשראי משותף</span>
                <strong class="font-mono-num text-xs sm:text-sm">${formatILS(fin.jointCardAgorot)}</strong>
              </div>
            </div>

            ${fin.balanceAgorot !== 0 ? `
              <div class="flex flex-wrap gap-2">
                <button type="button" data-act="open-sheet" data-sheet="settle" class="flex-1 py-2.5 rounded-xl bg-white/20 hover:bg-white/30 font-extrabold text-xs cursor-pointer">
                  🤝 סגור חשבון / רשום העברה
                </button>
                <button type="button" data-act="wa-send-balance" class="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold text-xs cursor-pointer">
                  📲 שלח פירוט לביט בוואטסאפ
                </button>
              </div>
            ` : ''}
          </section>

          <!-- פילוח הוצאות לפי קטגוריה -->
          ${catEntries.length > 0 ? `
            <section class="card-surface rounded-2xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between text-xs">
                <span class="font-extrabold text-main">📊 פילוח הוצאות כולל</span>
                <span class="font-mono-num font-bold text-sub">החודש: ${formatILS(fin.thisMonthTotalAgorot)}</span>
              </div>
              <div class="w-full h-2.5 rounded-full overflow-hidden flex bg-slate-200 dark:bg-slate-800">
                ${catEntries.map(([catId, val]) => {
                  const c = CATEGORIES[catId] || CATEGORIES.other;
                  return `<div style="width:${(val / totalCatSum) * 100}%; background-color:${c.color}" title="${c.label}: ${formatILS(val)}"></div>`;
                }).join('')}
              </div>
              <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px]">
                ${catEntries.map(([catId, val]) => {
                  const c = CATEGORIES[catId] || CATEGORIES.other;
                  return `<span class="inline-flex items-center gap-1 text-sub"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${c.icon} ${c.label}: <strong class="font-mono-num text-main">${formatILS(val)}</strong></span>`;
                }).join('')}
              </div>
            </section>
          ` : ''}

          <!-- מתגי סינון לתנועות -->
          <section class="flex flex-wrap items-center justify-between gap-2">
            <div class="inline-flex elevated-surface p-1 rounded-xl gap-1">
              <button type="button" data-act="wallet-method" data-val="personal" class="px-3 py-1.5 rounded-lg text-xs font-extrabold cursor-pointer ${this.walletFilter.method === 'personal' ? 'bg-indigo-600 text-white' : 'text-sub'}">💳 להתחשבנות</button>
              <button type="button" data-act="wallet-method" data-val="joint_card" class="px-3 py-1.5 rounded-lg text-xs font-extrabold cursor-pointer ${this.walletFilter.method === 'joint_card' ? 'bg-indigo-600 text-white' : 'text-sub'}">🏦 אשראי משותף</button>
              <button type="button" data-act="wallet-method" data-val="all" class="px-3 py-1.5 rounded-lg text-xs font-extrabold cursor-pointer ${this.walletFilter.method === 'all' ? 'bg-indigo-600 text-white' : 'text-sub'}">הכל</button>
            </div>

            <div class="inline-flex elevated-surface p-1 rounded-xl gap-1">
              <button type="button" data-act="wallet-period" data-val="all" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.walletFilter.period === 'all' ? 'bg-slate-900 text-white dark:bg-slate-700' : 'text-sub'}">הכל</button>
              <button type="button" data-act="wallet-period" data-val="month" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.walletFilter.period === 'month' ? 'bg-slate-900 text-white dark:bg-slate-700' : 'text-sub'}">החודש</button>
            </div>
          </section>

          <!-- רשימת תנועות -->
          <section class="space-y-2">
            ${visible.length === 0 ? `
              <div class="card-surface rounded-3xl p-8 text-center space-y-2">
                <div class="text-3xl">💳</div>
                <div class="font-extrabold text-main">אין תנועות בתצוגה זו</div>
                <p class="text-xs text-sub">שילמת משהו בכרטיס אישי במקום במשותף? לחץ על "+ הוצאה" והמאזן יתעדכן אוטומטית.</p>
              </div>
            ` : visible.map(e => {
              const cat = CATEGORIES[e.category] || CATEGORIES.other;
              const delta = FinanceEngine.expenseDelta(e);
              const isSettle = e.splitType === 'settlement';
              const payer = USERS[e.paidBy] || USERS.ronen;

              let impactBadge = '';
              if (isSettle) {
                impactBadge = `<span class="px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-bold">🤝 העברת התחשבנות</span>`;
              } else if (e.paymentMethod === 'joint_card') {
                impactBadge = `<span class="px-2 py-0.5 rounded-lg elevated-surface text-dim">🏦 משותף • ללא החזר</span>`;
              } else if (delta > 0) {
                impactBadge = `<span class="px-2 py-0.5 rounded-lg bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 font-bold">עדי ← רונן ${formatILS(delta)}</span>`;
              } else if (delta < 0) {
                impactBadge = `<span class="px-2 py-0.5 rounded-lg bg-pink-500/15 text-pink-600 dark:text-pink-300 font-bold">רונן ← עדי ${formatILS(Math.abs(delta))}</span>`;
              } else {
                impactBadge = `<span class="px-2 py-0.5 rounded-lg elevated-surface text-dim">ללא החזר</span>`;

              const splitLabel = isSettle ? '' : e.paymentMethod === 'joint_card' ? 'אשראי משותף'

                : e.splitType === 'for_other' ? `100% עבור ${e.paidBy === 'ronen' ? 'עדי' : 'רונן'}`
                : 'חלוקה מותאמת';

              return `
                <article class="card-surface rounded-2xl p-3.5 flex items-center justify-between gap-3 anim-row">
                  <div class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" data-act="open-edit-expense" data-id="${e.id}">

                        <span>•</span>
                        <span>שילם/ה: ${payer.avatar} ${payer.name}</span>

                    </div>
                  </div>

                  <div class="text-left shrink-0 flex flex-col items-end gap-1">
                    <div class="font-mono-num font-black text-base text-main">${formatILS(e.amountAgorot)}</div>
                    ${e.currency !== 'ILS' ? `<div class="text-[10px] font-mono-num text-dim">${e.originalAmount} ${e.currency}</div>` : ''}
                    <button type="button" data-act="del-expense" data-id="${e.id}" class="text-xs text-dim hover:text-rose-500 cursor-pointer">🗑️</button>
                  </div>
                </article>
              `;
            }).join('')}
          </section>
        `;
      }

      // -----------------------------------------------------------------------

              <div class="font-extrabold text-xs sm:text-sm text-main">גשר Gemini</div>

            <button type="button" data-act="open-sheet" data-sheet="cloud" class="card-surface rounded-2xl p-3.5 text-right hover:border-sky-500 cursor-pointer space-y-1">
              <div class="text-xl">☁️</div>
              <div class="font-extrabold text-xs sm:text-sm text-main">ענן Firebase</div>
              <div class="text-[11px] text-sub">${this.cloudUrl ? 'מחובר חי (SSE)' : 'לא מחובר'}</div>
            </button>
          </section>

          <!-- מרכז התראות 4 שכבות -->
          <section class="card-surface rounded-2xl p-4 space-y-3.5">
            <div class="flex items-center justify-between">
              <h2 class="font-extrabold text-sm text-main">🔔 מרכז התראות דדליין (4 שכבות)</h2>
              <span class="text-[11px] font-bold text-sub">${permLabel}</span>
            </div>

            <div class="flex flex-wrap gap-2">
              <button type="button" data-act="req-notif-perm" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold cursor-pointer">
                🔔 הפעל התראות דפדפן
              </button>
              <button type="button" data-act="ics-all" class="px-3.5 py-2 rounded-xl elevated-surface text-main text-xs font-extrabold cursor-pointer">
                📅 ייצא את כל הדדליינים ליומן (.ics)
              </button>
            </div>

            <div class="pt-3 border-t border-soft space-y-2">
              <div class="text-xs font-extrabold text-main">📱 התראות Push חיות בין טלפונים (אופציונלי — ntfy.sh)</div>
              <p class="text-[11px] text-sub leading-relaxed">
                רוצים התראת Push אמיתית לטלפון גם כשהדפדפן סגור? התקינו את האפליקציה החינמית <strong>ntfy</strong>, בחרו שם ערוץ סודי וארוך והזינו אותו כאן:
              </p>
              <div class="flex gap-2">
                <input type="text" id="hub-ntfy-topic" value="${esc(this.settings.ntfyTopic)}" placeholder="למשל: ronen-adi-pulse-9482" class="input-surface flex-1 rounded-xl px-3 py-2 text-xs font-mono-num" />
                <button type="button" data-act="save-ntfy" class="px-3.5 py-2 rounded-xl bg-slate-900 dark:bg-indigo-600 text-white text-xs font-extrabold cursor-pointer">שמור</button>
                <button type="button" data-act="test-ntfy" class="px-3 py-2 rounded-xl elevated-surface text-xs font-bold cursor-pointer">בדוק</button>
              </div>
            </div>
          </section>

          <!-- שערי מטבע וגיבוי -->
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="card-surface rounded-2xl p-4 space-y-2.5">
              <h2 class="font-extrabold text-sm text-main">💱 שערי מטבע (להוצאות חו״ל)</h2>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <label class="space-y-1">
                  <span class="text-sub font-bold">1 € יורו = ₪</span>
                  <input type="number" step="0.01" id="rate-eur" value="${this.settings.rates.EUR}" class="input-surface w-full rounded-xl px-2.5 py-1.5 font-mono-num" />
                </label>
                <label class="space-y-1">
                  <span class="text-sub font-bold">1 $ דולר = ₪</span>
                  <input type="number" step="0.01" id="rate-usd" value="${this.settings.rates.USD}" class="input-surface w-full rounded-xl px-2.5 py-1.5 font-mono-num" />
                </label>
              </div>
              <button type="button" data-act="save-rates" class="w-full py-2 rounded-xl elevated-surface text-xs font-extrabold text-main cursor-pointer">💾 עדכן שערים</button>
            </div>

            <div class="card-surface rounded-2xl p-4 space-y-2.5 flex flex-col justify-between">
              <div class="space-y-1">
                <h2 class="font-extrabold text-sm text-main">💾 גיבוי ושחזור מלא</h2>
                <p class="text-[11px] text-sub">שומר את כל המשימות, ההתחשבנות וההגדרות כקובץ JSON אחד.</p>
              </div>
              <div class="flex gap-2">
                <button type="button" data-act="export-json" class="flex-1 py-2 rounded-xl bg-slate-900 dark:bg-indigo-600 text-white text-xs font-extrabold cursor-pointer">⬇️ הורד גיבוי</button>
                <label class="flex-1 py-2 rounded-xl elevated-surface text-main text-xs font-extrabold text-center cursor-pointer">
                  ⬆️ שחזר קובץ
                  <input type="file" id="import-json-file" accept=".json" class="hidden" />
                </label>
              </div>
            </div>
          </section>

          <!-- יומן פעילות אחרונה -->
          <section class="card-surface rounded-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-soft flex items-center justify-between">
              <h2 class="font-extrabold text-sm text-main">🕒 יומן פעילות (${this.auditList.length})</h2>
              <button type="button" data-act="force-sync" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 cursor-pointer">🔄 סנכרן עכשיו</button>
            </div>
            <div class="divide-y divide-[var(--border-subtle)] max-h-64 overflow-y-auto">
              ${this.auditList.map(a => `
                <div class="px-4 py-2.5 flex items-center justify-between gap-2 text-xs">
                  <div class="truncate">
                    <span>${a.actorAvatar || '⚡'}</span>
                    <strong class="text-main">${esc(a.actorName || '')}</strong>
                    <span class="text-sub">${esc(a.action || '')}</span>
                    ${a.detail || a.taskTitle ? `<span class="font-bold text-indigo-600 dark:text-indigo-400">"${esc(a.detail || a.taskTitle)}"</span>` : ''}
                  </div>
                  <span class="font-mono-num text-[11px] text-dim shrink-0">${esc(a.time || '')}</span>
                </div>
              `).join('') || '<div class="p-6 text-center text-xs text-dim">אין פעילות עדיין</div>'}
            </div>
          </section>
        `;
      }

      // =======================================================================
      // שכבת Bottom Sheets & Modals (מבודדת — לא מתאפסת בעדכוני ענן)
      // =======================================================================
      renderSheet() {
        const root = document.getElementById('sheet-root');
        if (!this.sheet) { root.innerHTML = ''; return; }

        let content = '';
        if (this.sheet === 'quick-add') content = this.buildQuickAddSheet();
        else if (this.sheet === 'edit-task' && this.editingTask) content = this.buildEditTaskSheet();
        else if (this.sheet === 'edit-expense' && this.editingExpense) content = this.buildEditExpenseSheet();
        else if (this.sheet === 'settle') content = this.buildSettleSheet();
        else if (this.sheet === 'wa-import') content = this.buildWaImportSheet();
        else if (this.sheet === 'wa-share') content = this.buildWaShareSheet();
        else if (this.sheet === 'gemini') content = this.buildGeminiSheet();
        else if (this.sheet === 'cloud') content = this.buildCloudSheet();

        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4" data-act="backdrop-close">
            <div class="card-surface anim-sheet w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto shadow-2xl" onclick="event.stopPropagation()">
              ${content}
            </div>
          </div>
        `;

        // פוקוס חכם לשדה הראשי
        if (this.sheet === 'quick-add') {
          const focusId = this.quickMode === 'task' ? 'qa-task-input' : 'qa-exp-amount';
          setTimeout(() => document.getElementById(focusId)?.focus(), 60);
        }
      }

      buildQuickAddSheet() {
        const speechSupported = Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
        const isTask = this.quickMode === 'task';
        const td = this.quickTaskDraft;
        const ed = this.quickExpenseDraft;

        // חישוב תצוגה מקדימה להוצאה
        const numAmt = parseFloat(ed.amountStr) || 0;
        const rate = ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1);
        const amountAgorot = Math.round(numAmt * rate * 100);
        const previewExp = normExpense({
          ...ed,
          amountAgorot,
          ronenShareAgorot: ed.splitType === 'custom' ? Math.round((parseFloat(ed.customRonenStr) || 0) * 100) : 0
        });
        const previewDelta = FinanceEngine.expenseDelta(previewExp);

        let expImpactHint = 'הזן סכום כדי לראות את ההשפעה על ההתחשבנות';
        if (amountAgorot > 0) {
          if (ed.paymentMethod === 'joint_card') expImpactHint = `🏦 יירשם תחת אשראי משותף (${formatILS(amountAgorot)}) — ללא החזר ביניכם`;
          else if (previewDelta > 0) expImpactHint = `💡 עדי תצטרך להחזיר לרונן ${formatILS(previewDelta)} על הוצאה זו`;
          else if (previewDelta < 0) expImpactHint = `💡 רונן יצטרך להחזיר לעדי ${formatILS(Math.abs(previewDelta))} על הוצאה זו`;
          else expImpactHint = `✨ ללא שינוי במאזן ההחזרים`;
        }

        return `
          <div class="p-4 sm:p-5 space-y-4">
            <!-- כותרת ומתג משימה / הוצאה -->
            <div class="flex items-center justify-between gap-2">
              <div class="inline-flex elevated-surface p-1 rounded-2xl gap-1">
                <button type="button" data-act="quick-mode" data-mode="task" class="px-4 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer transition-all ${isTask ? 'bg-indigo-600 text-white shadow-xs' : 'text-sub'}">✅ משימה</button>
                <button type="button" data-act="quick-mode" data-mode="expense" class="px-4 py-1.5 rounded-xl text-xs font-extrabold cursor-pointer transition-all ${!isTask ? 'bg-emerald-600 text-white shadow-xs' : 'text-sub'}">💸 הוצאה</button>
              </div>
              <button type="button" data-act="close-sheet" class="w-8 h-8 rounded-full elevated-surface text-sub font-bold cursor-pointer">✕</button>
            </div>

            ${isTask ? `
              <form id="quick-task-form" class="space-y-3.5">
                <div class="relative flex items-center gap-1.5">
                  <input
                    type="text"
                    id="qa-task-input"
                    value="${esc(td.rawInput)}"
                    placeholder='מה צריך לעשות? (למשל: "לסגור צלם מחר 18:00 @עדי !דחוף")'
                    class="input-surface w-full rounded-2xl px-4 py-3.5 text-sm font-bold"
                    autocomplete="off"
                    required
                  />
                  ${speechSupported ? `<button type="button" data-act="voice-input" class="w-11 h-11 rounded-2xl elevated-surface text-lg shrink-0 cursor-pointer" title="הכתבה קולית בעברית">🎤</button>` : ''}
                </div>

                <!-- תגיות פיענוח חכם (מתעדכנות בזמן הקלדה) -->
                <div id="qa-nlp-preview" class="space-y-2"></div>

                <!-- בחירת תאריך בנגיעה אחת -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                  <button type="button" data-act="qa-date-chip" data-days="0" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${td.dueDate === todayISO(0) ? 'bg-indigo-600 text-white' : 'elevated-surface text-sub'}">היום</button>
                  <button type="button" data-act="qa-date-chip" data-days="1" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${td.dueDate === todayISO(1) ? 'bg-indigo-600 text-white' : 'elevated-surface text-sub'}">מחר</button>
                  <button type="button" data-act="qa-date-chip" data-days="3" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${td.dueDate === todayISO(3) ? 'bg-indigo-600 text-white' : 'elevated-surface text-sub'}">עוד 3 ימים</button>
                  <input type="date" id="qa-date-manual" value="${esc(td.dueDate)}" class="input-surface rounded-xl px-2 py-1 text-xs shrink-0" />
                  <input type="time" id="qa-time-manual" value="${esc(td.dueTime)}" class="input-surface rounded-xl px-2 py-1 text-xs shrink-0" />
                </div>

                <!-- בחירת אחראי + דחיפות -->
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div class="inline-flex elevated-surface p-1 rounded-xl gap-1">
                    ${['both', 'ronen', 'adi'].map(u => `
                      <button type="button" data-act="qa-assignee" data-val="${u}" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${td.assignee === u ? 'bg-indigo-600 text-white' : 'text-sub'}">${USERS[u].avatar} ${USERS[u].name}</button>
                    `).join('')}
                  </div>

                  <div class="inline-flex elevated-surface p-1 rounded-xl gap-1">
                    ${['medium', 'high', 'urgent'].map(p => `
                      <button type="button" data-act="qa-priority" data-val="${p}" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${td.priority === p ? 'bg-rose-600 text-white' : 'text-sub'}">${PRIORITIES[p].icon}</button>
                    `).join('')}
                  </div>
                </div>

                <!-- קטגוריה באייקונים -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                  ${Object.values(CATEGORIES).map(c => `
                    <button type="button" data-act="qa-cat" data-val="${c.id}" class="px-2.5 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ${td.category === c.id ? 'bg-slate-900 text-white dark:bg-indigo-600' : 'elevated-surface text-sub'}">${c.icon} ${c.label}</button>
                  `).join('')}
                </div>

                <button type="submit" class="w-full py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm shadow-lg shadow-indigo-600/25 cursor-pointer">
                  ⚡ הוסף ללוח המשותף
                </button>
              </form>
            ` : `
              <!-- מצב הוספת הוצאה (3 הקשות) -->
              <form id="quick-expense-form" class="space-y-3.5">
                <div class="flex items-center gap-2">
                  <div class="relative flex-1">
                    <input
                      type="number"
                      step="0.01"
                      inputmode="decimal"
                      id="qa-exp-amount"
                      value="${esc(ed.amountStr)}"
                      placeholder="0"
                      required
                      class="input-surface w-full rounded-2xl px-4 py-3 text-2xl font-black font-mono-num text-center"
                    />
                  </div>
                  <div class="inline-flex flex-col gap-1">
                    <button type="button" data-act="qa-exp-curr" class="px-3 py-3 rounded-2xl elevated-surface font-mono-num font-black text-base text-main cursor-pointer" title="לחץ להחלפת מטבע">
                      ${ed.currency === 'ILS' ? '₪' : ed.currency === 'EUR' ? '€' : '$'}
                    </button>
                  </div>
                </div>
                ${ed.currency !== 'ILS' && numAmt > 0 ? `<div class="text-center text-xs font-mono-num text-sub">≈ ${formatILS(amountAgorot)} (לפי שער ${rate})</div>` : ''}

                <input
                  type="text"
                  id="qa-exp-title"
                  value="${esc(ed.title)}"
                  placeholder="על מה שילמת? (למשל: סופר, דלק, מתנה, קצביה...)"
                  required
                  class="input-surface w-full rounded-2xl px-4 py-3 text-sm font-bold"
                />

                <!-- אמצעי תשלום: אישי או אשראי משותף -->
                <div class="space-y-1.5">
                  <div class="text-[11px] font-bold text-sub">באיזה כרטיס שולם?</div>
                  <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" data-act="qa-exp-pay" data-method="personal" data-payer="ronen" class="py-2.5 px-2 rounded-xl text-xs font-extrabold cursor-pointer ${ed.paymentMethod === 'personal' && ed.paidBy === 'ronen' ? 'bg-blue-600 text-white shadow-sm' : 'elevated-surface text-sub'}">💳 אישי רונן</button>
                    <button type="button" data-act="qa-exp-pay" data-method="personal" data-payer="adi" class="py-2.5 px-2 rounded-xl text-xs font-extrabold cursor-pointer ${ed.paymentMethod === 'personal' && ed.paidBy === 'adi' ? 'bg-pink-600 text-white shadow-sm' : 'elevated-surface text-sub'}">💳 אישי עדי</button>
                    <button type="button" data-act="qa-exp-pay" data-method="joint_card" data-payer="${this.user === 'adi' ? 'adi' : 'ronen'}" class="py-2.5 px-2 rounded-xl text-xs font-extrabold cursor-pointer ${ed.paymentMethod === 'joint_card' ? 'bg-slate-900 text-white dark:bg-indigo-600 shadow-sm' : 'elevated-surface text-sub'}">🏦 משותף</button>
                  </div>
                </div>

                <!-- אופן חלוקה (רק כששולם בכרטיס אישי) -->
                ${ed.paymentMethod === 'personal' ? `
                  <div class="space-y-1.5">
                    <div class="text-[11px] font-bold text-sub">איך מחלקים?</div>
                    <div class="grid grid-cols-3 gap-1.5">
                      <button type="button" data-act="qa-exp-split" data-val="equal" class="py-2 rounded-xl text-xs font-bold cursor-pointer ${ed.splitType === 'equal' ? 'bg-emerald-600 text-white' : 'elevated-surface text-sub'}">50 / 50</button>
                      <button type="button" data-act="qa-exp-split" data-val="for_other" class="py-2 rounded-xl text-xs font-bold cursor-pointer ${ed.splitType === 'for_other' ? 'bg-emerald-600 text-white' : 'elevated-surface text-sub'}">100% עבור ${ed.paidBy === 'ronen' ? 'עדי' : 'רונן'}</button>
                      <button type="button" data-act="qa-exp-split" data-val="custom" class="py-2 rounded-xl text-xs font-bold cursor-pointer ${ed.splitType === 'custom' ? 'bg-emerald-600 text-white' : 'elevated-surface text-sub'}">מותאם ₪</button>
                    </div>

                    ${ed.splitType === 'custom' ? `
                      <div class="grid grid-cols-2 gap-2 pt-1">
                        <label class="text-[11px] font-bold text-sub">חלק רונן (₪):
                          <input type="number" step="0.01" id="qa-exp-custom-ronen" value="${esc(ed.customRonenStr)}" class="input-surface w-full rounded-xl px-2.5 py-1.5 mt-1 font-mono-num" />
                        </label>
                        <div class="text-[11px] font-bold text-sub">חלק עדי (אוטומטי):
                          <div class="elevated-surface rounded-xl px-2.5 py-1.5 mt-1 font-mono-num text-main">${formatILS(previewExp.adiShareAgorot)}</div>
                        </div>
                      </div>
