<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>המרחב המשותף של רונן ועדי ⚡ v3.0 Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
    }
    body.dark-mode {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --border-color: #334155;
      background-color: #0f172a;
      color: #f8fafc;
    }
    body.dark-mode .bg-white { background-color: #1e293b !important; color: #f8fafc !important; }
    body.dark-mode .bg-slate-50 { background-color: #0f172a !important; }
    body.dark-mode .bg-slate-100 { background-color: #334155 !important; color: #e2e8f0 !important; }
    body.dark-mode .text-slate-900, body.dark-mode .text-slate-800, body.dark-mode .text-slate-700 { color: #f1f5f9 !important; }
    body.dark-mode .text-slate-600, body.dark-mode .text-slate-500 { color: #94a3b8 !important; }
    body.dark-mode .border-slate-200, body.dark-mode .border-slate-300, body.dark-mode .border-slate-100 { border-color: #334155 !important; }
    body.dark-mode input, body.dark-mode select, body.dark-mode textarea {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass-header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- התראות צפות (Toasts) -->
  <div id="toast-box" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-2"></div>

  <!-- אזורי תצוגה ראשיים -->
  <div id="header-slot"></div>

  <main class="max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 flex-1 space-y-4">
    <div id="quickadd-slot"></div>
    <div id="toolbar-slot"></div>
    <div id="view-slot"></div>
  </main>

  <div id="modal-slot"></div>

  <footer class="bg-white border-t border-slate-200 py-4 mt-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
      <div>⚡ <strong>המרחב המשותף של רונן ועדי (v3.0 Pro)</strong> • זיהוי תתי-משימות חכם, חילוץ מ-WhatsApp וסנכרון ענן חי</div>
      <div class="flex items-center gap-3">
        <button type="button" data-action="export-backup" class="hover:text-indigo-600 font-bold cursor-pointer">💾 הורד גיבוי JSON</button>
        <span>•</span>
        <button type="button" data-action="force-cloud-pull" class="hover:text-emerald-600 font-bold cursor-pointer">🔄 רענן נתונים מהענן</button>
      </div>
    </div>
  </footer>

  <script type="module">
    // ========================================================================
    // 1. קבועים, מפתחות אחסון (תואם ב-100% לגרסה הקודמת) והגדרות מערכת
    // ========================================================================
    const KEYS = {
      TASKS: 'ra_tasks_v2',
      AUDIT: 'ra_audit_v2',
      USER: 'ra_user_v2',
      CLOUD: 'ra_cloud_url_v2',
      THEME: 'ra_theme_v2'
    };

    const USERS = {
      ronen: { id: 'ronen', name: 'רונן', avatar: '👨🏻‍💻', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      adi: { id: 'adi', name: 'עדי', avatar: '👩🏻', badge: 'bg-pink-100 text-pink-800 border-pink-300' },
      both: { id: 'both', name: 'משותף', avatar: '💑', badge: 'bg-violet-100 text-violet-800 border-violet-300' }
    };

    const CATEGORIES = {
      wedding: { id: 'wedding', label: 'חתונה ורבנות', icon: '💍', badge: 'bg-pink-50 text-pink-700 border-pink-200' },
      trip: { id: 'trip', label: 'טיולים וצימר', icon: '🏕️', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      shopping: { id: 'shopping', label: 'קניות ועל האש', icon: '🥩', badge: 'bg-amber-50 text-amber-700 border-amber-200' },
      home: { id: 'home', label: 'בית ופרויקטים', icon: '🏠', badge: 'bg-blue-50 text-blue-700 border-blue-200' }
    };

    const PRIORITIES = {
      urgent: { id: 'urgent', label: 'דחוף / קריטי', weight: 4, icon: '🔥', badge: 'bg-red-100 text-red-800 border-red-300 font-bold' },
      high: { id: 'high', label: 'גבוהה', weight: 3, icon: '⚡', badge: 'bg-orange-100 text-orange-800 border-orange-300' },
      medium: { id: 'medium', label: 'רגילה', weight: 2, icon: '📌', badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      low: { id: 'low', label: 'נמוכה', weight: 1, icon: '🌱', badge: 'bg-slate-100 text-slate-700 border-slate-300' }
    };

    const STATUSES = {
      todo: { id: 'todo', label: 'לביצוע', icon: '⭕' },
      in_progress: { id: 'in_progress', label: 'בתהליך', icon: '⏳' },
      done: { id: 'done', label: 'בוצע', icon: '✅' }
    };

    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    const esc = (s = '') => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function normTask(raw = {}, actor = 'ronen') {
      const done = Boolean(raw.done || raw.status === 'done');
      return {
        id: raw.id || uid('t'),
        title: String(raw.title || 'משימה חדשה').trim(),
        category: CATEGORIES[raw.category] ? raw.category : 'wedding',
        assignee: USERS[raw.assignee] ? raw.assignee : 'both',
        priority: PRIORITIES[raw.priority] ? raw.priority : 'medium',
        status: done ? 'done' : (STATUSES[raw.status] ? raw.status : 'todo'),
        done,
        pinned: Boolean(raw.pinned),
        dueDate: raw.dueDate || '',
        estimatedBudget: Number(raw.estimatedBudget) || 0,
        actualCost: Number(raw.actualCost) || 0,
        notes: String(raw.notes || '').trim(),
        link: String(raw.link || '').trim(),
        subtasks: Array.isArray(raw.subtasks)
          ? raw.subtasks.map(s => ({
              id: s.id || uid('s'),
              title: String(s.title || '').trim(),
              done: Boolean(s.done),
              completedBy: s.completedBy || null
            })).filter(s => s.title)
          : [],
        updatedAt: raw.updatedAt || new Date().toISOString(),
        completedBy: done ? (raw.completedBy || actor) : null
      };
    }

    function calcSubProgress(task) {
      const subs = task?.subtasks || [];
      if (!subs.length) return { has: false, done: 0, total: 0, pct: task?.done ? 100 : 0 };
      const done = subs.filter(s => s.done).length;
      return { has: true, done, total: subs.length, pct: Math.round((done / subs.length) * 100) };
    }

    // ========================================================================
    // 2. מנוע NLP לזיהוי תתי-משימות אוטומטי וחילוץ מ-WhatsApp
    // ========================================================================
    const SEMANTIC_CLUSTERS = [
      {
        name: 'רבנות וחתונה',
        keywords: ['רב', 'רבנות', 'צהר', 'חופה', 'קידושין', 'תיק נישואין', 'כתובה', 'הדרכת כלה', 'תעודת רווקות', 'מקווה', 'טבעות']
      },
      {
        name: 'שואב MOVA ובית',
        keywords: ['mova', 'מובה', 'p70', 'שואב', 'פילטר', 'פילטרים', 'שקיות אבק', 'שקיות', 'מטליות', 'מברשת', 'מברשות', 'נוזל ניקוי', 'אליאקספרס', 'aliexpress']
      },
      {
        name: 'צימר וטיול לכינרת',
        keywords: ['צימר', 'כינרת', 'כנרת', 'רמות', 'חד נס', 'גולן', 'ווייז', 'waze', 'אגרה', 'ביחד בשבילך', 'מועדון טוב', 'גקוזי', 'בריכה']
      },
      {
        name: 'קניות ועל האש',
        keywords: ['על האש', 'מנגל', 'בשר', 'בשרים', 'אנטריקוט', 'פרגיות', 'קבב', 'מרגז', 'סלט', 'סלטים', 'חומוס', 'טחינה', 'מטבוחה', 'כרוב לבן', 'בטטה', 'טאבולה', 'פלפלים קלויים', 'פיתות', 'קצביה']
      },
      {
        name: 'צילומים ו-Save The Date',
        keywords: ['צילום', 'צילומים', 'צלם', 'שקיעה', 'save the date', 'canon', 'קנון', 'v10', 'מצלמה', 'כרטיס זיכרון', 'sdxc']
      },
      {
        name: 'מסעדות ויום השנה',
        keywords: ['מסעדה', 'מסעדת', 'מיטבר', 'meatbar', 'יום השנה', 'שולחן', 'הזמנת מקום']
      }
    ];

    class SmartSubtaskAndWhatsAppEngine {
      /**
       * מנרמל מילים בעברית (מסיר תחיליות נפוצות וסימני פיסוק) להשוואה מדויקת
       */
      static tokenizeHebrew(text = '') {
        const clean = String(text || '')
          .toLowerCase()
          .replace(/[^\u0590-\u05FFa-z0-9\s]/g, ' ')
          .trim();

        const stopWords = new Set(['את', 'של', 'על', 'עם', 'או', 'גם', 'כי', 'אם', 'לא', 'כן', 'זה', 'זו', 'לי', 'לך', 'לנו', 'צריך', 'לקנות', 'לעשות', 'לבדוק', 'להזמין', 'רונן', 'עדי', 'משותף']);

        return clean
          .split(/\s+/)
          .map(w => w.replace(/^[הובלמכש]/, '')) // הסרת תחילית דקדוקית בסיסית
          .filter(w => w.length >= 2 && !stopWords.has(w));
      }

      /**
       * בודק האם טקסט שהוקלד שייך כתת-משימה לאחת המשימות הקיימות בלוח!
       * מחזיר את משימת האב המתאימה ביותר וציון ההתאמה.
       */
      static findParentTaskMatch(inputText = '', existingTasks = []) {
        const raw = String(inputText || '').trim();
        if (raw.length < 3 || !existingTasks.length) return null;

        const openTasks = existingTasks.filter(t => !t.done);
        const candidates = openTasks.length > 0 ? openTasks : existingTasks;

        // 1. אם המשתמש התחיל ב-">" או "תת:" נשייך למשימה הראשונה או לפי מילת מפתח
        const explicitSub = raw.startsWith('>') || raw.startsWith('תת:') || raw.startsWith('+');
        const cleanInput = raw.replace(/^(>|תת:|\+)\s*/, '').trim();
        const inputLower = cleanInput.toLowerCase();
        const inputTokens = this.tokenizeHebrew(cleanInput);

        let bestTask = null;
        let bestScore = 0;
        let matchReason = '';

        candidates.forEach(task => {
          let score = 0;
          let reason = '';
          const taskText = `${task.title} ${task.notes || ''}`.toLowerCase();
          const taskTokens = this.tokenizeHebrew(taskText);

          // א. חפיפת מילים ישירה בין הקלט לכותרת משימת האב
          inputTokens.forEach(tok => {
            if (taskTokens.some(tTok => tTok === tok || (tTok.length >= 3 && tok.length >= 3 && (tTok.includes(tok) || tok.includes(tTok))))) {
              score += 35;
              reason = `מילת מפתח משותפת ("${tok}")`;
            }
          });

          // ב. בדיקת שייכות לאותו אשכול סמנטי (למשל "פילטרים" -> שואב MOVA, "רב צהר" -> רב לחתונה)
          SEMANTIC_CLUSTERS.forEach(cluster => {
            const inputHasCluster = cluster.keywords.some(kw => inputLower.includes(kw));
            const taskHasCluster = cluster.keywords.some(kw => taskText.includes(kw));
            if (inputHasCluster && taskHasCluster) {
              score += 50;
              reason = `שייך לנושא "${cluster.name}"`;
            }
          });

          // ג. אם הקלט זהה בדיוק לכותרת המשפט כולה, אל תציע כתת-משימה של עצמה
          if (task.title.trim().toLowerCase() === inputLower) {
            score = 0;
          }

          if (score > bestScore) {
            bestScore = score;
            bestTask = task;
            matchReason = reason;
          }
        });

        if (explicitSub && !bestTask && candidates.length > 0) {
          bestTask = candidates[0];
          bestScore = 100;
          matchReason = 'סימון תת-משימה מפורש';
        }

        if (bestTask && bestScore >= 35) {
          return {
            parentTask: bestTask,
            cleanSubtaskTitle: cleanInput,
            score: bestScore,
            reason: matchReason
          };
        }
        return null;
      }

      /**
       * מפענח הודעות וואטסאפ מועתקות (כולל תאריכים, שעות ושם השולח)
       * ומסווג כל שורה למשימה חדשה או לתת-משימה של משימה קיימת!
       */
      static parseWhatsAppChat(rawText = '', existingTasks = []) {
        const lines = String(rawText || '')
          .split(/\r?\n/)
          .map(l => l.trim())
          .filter(Boolean);

        const extractedItems = [];

        // תבניות חותמת זמן של וואטסאפ באייפון ובאנדרואיד:
        // [06/11/2026, 10:15:22] עדי: צריך להזמין...
        // 06.11.2026, 10:15 - רונן טבקמן: ...
        const waHeaderRegex = /^(?:\[?\d{1,2}[./-]\d{1,2}[./-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*[-–]?\s*)([^:]+):\s*(.+)$/;

        lines.forEach(line => {
          let sender = '';
          let content = line;

          const waMatch = line.match(waHeaderRegex);
          if (waMatch) {
            sender = waMatch[1].trim();
            content = waMatch[2].trim();
          }

          // ניקוי תווי רשימה מובילים
          content = content.replace(/^[-*•✅⭕📌\d.)\]]+\s*/, '').trim();
          if (content.length < 2) return;

          // זיהוי אחראי (לפי התוכן או לפי השולח בוואטסאפ)
          let assignee = 'both';
          if (/\b(עדי|לעדי|של עדי)\b/.test(content)) assignee = 'adi';
          else if (/\b(רונן|לרונן|של רונן)\b/.test(content)) assignee = 'ronen';
          else if (sender.includes('עדי')) assignee = 'adi';
          else if (sender.includes('רונן')) assignee = 'ronen';

          // זיהוי קטגוריה
          let category = 'wedding';
          if (/(צימר|כינרת|כנרת|טיול|מלון|חופשה|מסלול|יקב|ווייז|waze|אגרה|גולן)/i.test(content)) category = 'trip';
          else if (/(קניות|סופר|בשר|על האש|מנגל|סלט|חומוס|טחינה|מטבוחה|כרוב|בטטה|קצב|מסעדה|מיטבר)/i.test(content)) category = 'shopping';
          else if (/(שואב|mova|מובה|פילטר|שקיות|בית|ניקיון|אליאקספרס|מצלמה|canon|מעגל|פרויקט)/i.test(content)) category = 'home';

          // זיהוי דחיפות
          let priority = 'medium';
          if (/(דחוף|קריטי|מיידי|היום|חובה|🔥|!!)/.test(content)) priority = 'urgent';
          else if (/(חשוב|גבוה|בהקדם|לפני הסופ"ש)/.test(content)) priority = 'high';

          // חילוץ תקציב
          let estimatedBudget = 0;
          const bMatch = content.match(/(?:₪|ש"ח|שח|תקציב|עלות)\s*(\d[\d,]*)|(\d[\d,]*)\s*(?:₪|ש"ח|שח)/);
          if (bMatch) {
            estimatedBudget = Number((bMatch[1] || bMatch[2] || '').replace(/,/g, '')) || 0;
          }

          // בדיקה אוטומטית האם זו תת-משימה של משימה קיימת בלוח
          const parentMatch = this.findParentTaskMatch(content, existingTasks);

          // אם יש בשורה נקודתיים ורשימת פסיקים (למשל "לקנות לעל האש: פרגיות, אנטריקוט, חומוס")
          const subtasks = [];
          let finalTitle = content;
          const colonParts = content.split(':');
          if (colonParts.length === 2 && colonParts[1].includes(',')) {
            finalTitle = colonParts[0].trim();
            colonParts[1].split(',').map(s => s.trim()).filter(Boolean).forEach(sub => {
              subtasks.push({ id: uid('s'), title: sub, done: false });
            });
          }

          extractedItems.push({
            tempId: uid('wa'),
            title: finalTitle,
            assignee,
            category,
            priority,
            estimatedBudget,
            subtasks,
            targetType: parentMatch ? 'subtask' : 'new_task', // 'new_task' | 'subtask'
            parentTaskId: parentMatch ? parentMatch.parentTask.id : (existingTasks[0]?.id || ''),
            matchReason: parentMatch ? parentMatch.reason : ''
          });
        });

        return extractedItems;
      }
    }

    // ========================================================================
    // 3. מנהל האפליקציה הראשי (Master App v3.0 Pro)
    // ========================================================================
    class App {
      constructor() {
        this.user = localStorage.getItem(KEYS.USER) || 'ronen';
        this.cloudUrl = (localStorage.getItem(KEYS.CLOUD) || '').replace(/\/$/, '');
        this.darkMode = localStorage.getItem(KEYS.THEME) === 'dark';
        this.cloudStatus = this.cloudUrl ? 'connecting' : 'offline';

        this.view = 'cards'; // 'cards' | 'table' | 'kanban' | 'audit'
        this.modal = null;   // null | 'edit' | 'whatsapp-import' | 'cloud' | 'gemini' | 'wa-share'
        this.editingTask = null;
        this.waExtractedDrafts = [];
        this.waShareMode = 'adi_focus';

        this.filters = { q: '', assignee: 'all', category: 'all', status: 'all' };
        this.liveSubtaskSuggestion = null;
        this.autoSubtaskMode = false;

        this.lastCloudHash = '';
        this.isPushing = false;

        this.tasks = JSON.parse(localStorage.getItem(KEYS.TASKS) || 'null') || this.seed();
        this.audit = JSON.parse(localStorage.getItem(KEYS.AUDIT) || '[]');

        if (this.darkMode) document.body.classList.add('dark-mode');

        this.checkUrlParams();
        this.bindEvents();
        this.render();
        if (this.cloudUrl) this.startCloudSync();
      }

      seed() {
        return [
          normTask({
            id: 'rabbi_1',
            title: 'חיפוש ומציאת רב לחתונה (בדיקת צהר / רבנות / רב מוסמך)',
            category: 'wedding',
            assignee: 'both',
            priority: 'urgent',
            pinned: true,
            notes: 'לבדוק המלצות, סגנון חופה שמתאים לשניכם, ותיאום מול המועצה הדתית',
            subtasks: [
              { id: 's1', title: 'בדיקת רשימת רבנים מומלצים', done: false },
              { id: 's2', title: 'פגישת הכרות וסגירת תאריך עם הרב', done: false },
              { id: 's3', title: 'פתיחת תיק נישואין ברבנות', done: false }
            ]
          }),
          normTask({
            id: 'mova_1',
            title: 'הזמנת ציוד וחלקים לשואב MOVA P70 Pro Ultra',
            category: 'home',
            assignee: 'ronen',
            priority: 'medium',
            estimatedBudget: 120,
            notes: 'לבדוק מלאי פילטרים, שקיות אבק, מטליות ומברשות ולהזמין מאליאקספרס',
            subtasks: [
              { id: 's4', title: 'בדיקת כמות שקיות אבק ופילטרים בארון', done: false }
            ]
          })
        ];
      }

      checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const cUrl = params.get('cloud');
        if (cUrl) {
          this.cloudUrl = decodeURIComponent(cUrl).replace(/\/$/, '');
          localStorage.setItem(KEYS.CLOUD, this.cloudUrl);
          this.toast('חיבור הענן נשמר אוטומטית במכשיר! ☁️', 'emerald');

        }

      saveLocal() {
        localStorage.setItem(KEYS.TASKS, JSON.stringify(this.tasks));
        localStorage.setItem(KEYS.AUDIT, JSON.stringify(this.audit.slice(0, 80)));
      }

      async syncMutation(actionLabel, taskTitle = '') {
        this.audit = [{
          id: uid('log'),
          actorName: USERS[this.user].name,
          actorAvatar: USERS[this.user].avatar,
          action: actionLabel,
          taskTitle,
          time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
        }, ...this.audit].slice(0, 80);

        this.saveLocal();
        this.render();
        if (this.cloudUrl) await this.pushToCloud();
      }

      // ----------------------------------------------------------------------
      // סנכרון ענן בזמן אמת (Firebase Realtime DB)
      // ----------------------------------------------------------------------
      getEndpoint() {
        return `${this.cloudUrl}/ronen_adi_board.json`;
      }

      async pushToCloud() {
        if (!this.cloudUrl) return;
        this.isPushing = true;
        try {
          const payload = {
            updatedAt: Date.now(),
            updatedBy: this.user,
            tasks: this.tasks,
            audit: this.audit
          };
          this.lastCloudHash = JSON.stringify(this.tasks) + JSON.stringify(this.audit);
          const res = await fetch(this.getEndpoint(), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          this.cloudStatus = 'online';
          this.renderHeader();
        } catch {
          this.cloudStatus = 'error';
          this.renderHeader();
        } finally {
          this.isPushing = false;
        }
      }

      async pullFromCloud(isInitial = false) {
        if (!this.cloudUrl || this.isPushing || this.modal === 'edit') return;
        try {
          const res = await fetch(this.getEndpoint());
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this.cloudStatus = 'online';

          if (!data || !Array.isArray(data.tasks)) {
            if (isInitial) await this.pushToCloud();
            this.renderHeader();
            return;
          }

          const incomingHash = JSON.stringify(data.tasks) + JSON.stringify(data.audit || []);
          if (incomingHash !== this.lastCloudHash) {
            this.lastCloudHash = incomingHash;
            this.tasks = data.tasks.map(t => normTask(t, this.user));
            this.audit = Array.isArray(data.audit) ? data.audit : this.audit;
            this.saveLocal();
            this.render();
          } else if (isInitial) {
            this.renderHeader();
          }
        } catch {
          this.cloudStatus = 'error';
          this.renderHeader();
        }
      }

      startCloudSync() {
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pullFromCloud(true);
        this.pollTimer = setInterval(() => this.pullFromCloud(false), 3000);
      }

      toast(msg, color = 'slate') {
        const box = document.getElementById('toast-box');
        if (!box) return;
        const el = document.createElement('div');
        const bg = color === 'emerald' ? 'bg-emerald-600' : color === 'red' ? 'bg-red-600' : color === 'indigo' ? 'bg-indigo-600' : 'bg-slate-900';
        el.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all duration-300 pointer-events-auto`;
        el.innerHTML = `<span>⚡</span><span>${esc(msg)}</span>`;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 250);
        }, 3200);
      }

      getFiltered() {
        const q = this.filters.q.trim().toLowerCase();
        return [...this.tasks].filter(t => {
          if (this.filters.status === 'open' && t.done) return false;
          if (this.filters.status === 'done' && !t.done) return false;
          if (this.filters.assignee === 'ronen' && !(t.assignee === 'ronen' || t.assignee === 'both')) return false;
          if (this.filters.assignee === 'adi' && !(t.assignee === 'adi' || t.assignee === 'both')) return false;
          if (this.filters.category !== 'all' && t.category !== this.filters.category) return false;
          if (q) {
            const inTitle = t.title.toLowerCase().includes(q);
            const inNotes = (t.notes || '').toLowerCase().includes(q);
            const inSub = (t.subtasks || []).some(s => s.title.toLowerCase().includes(q));
            if (!inTitle && !inNotes && !inSub) return false;
          }
          return true;
        }).sort((a, b) => {
          if (a.done !== b.done) return a.done ? 1 : -1;
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          return (PRIORITIES[b.priority]?.weight || 2) - (PRIORITIES[a.priority]?.weight || 2);
        });
      }

        const slot = document.getElementById('modal-slot');

        // א. מודאל עריכת משימה מלאה (Edit Task & Subtasks Modal)
        if (this.modal === 'edit' && this.editingTask) {
          const t = this.editingTask;
          const catOpts = Object.values(CATEGORIES).map(c => `<option value="${c.id}" ${t.category === c.id ? 'selected' : ''}>${c.icon} ${c.label}</option>`).join('');
          const prioOpts = Object.values(PRIORITIES).map(p => `<option value="${p.id}" ${t.priority === p.id ? 'selected' : ''}>${p.icon} ${p.label}</option>`).join('');

          const subsEditorHtml = (t.subtasks || []).map((s, idx) => `
            <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
              <input type="checkbox" class="edit-sub-done w-4 h-4 rounded" data-idx="${idx}" ${s.done ? 'checked' : ''} />
              <input type="text" class="edit-sub-title flex-1 border rounded-lg px-2.5 py-1 text-xs font-medium" data-idx="${idx}" value="${esc(s.title)}" />
              <button type="button" data-action="edit-modal-del-sub" data-idx="${idx}" class="text-red-500 hover:bg-red-50 px-2 py-1 rounded text-xs font-bold cursor-pointer">מחק</button>
            </div>
          `).join('');

          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto">

                  <button type="button" data-action="close-modal" class="text-white font-bold text-lg cursor-pointer">✕</button>

                <div class="p-5 space-y-4 max-h-[82vh] overflow-y-auto">

                  ></textarea>

                  <div class="flex justify-end">
                    <button type="button" data-action="analyze-wa-text" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-teal-600 text-white text-xs font-extrabold cursor-pointer">

            ? openTasks.filter(t => t.assignee === 'adi' || t.assignee === 'both')

            const subProg = calcSubProgress(t);

            const subLines = (t.subtasks || []).filter(s => !s.done).map(s => `   ▫️ ${s.title}`).join('\n');
            return `${i + 1}. *${t.title}* (${USERS[t.assignee].name})${subStr}${subLines ? '\n' + subLines : ''}`;
          }).join('\n');

          const waMsg = `היי עדי ❤️, הנה עדכון מהלוח המשותף שלנו:\n\n${lines || '🎉 כל המשימות הושלמו!'}\n\n🔗 *לפתיחה וסימון בזמן אמת:*\n${link}`;

          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3.5 shadow-2xl">
                <div class="flex justify-between items-center">
                  <h2 class="font-extrabold text-base">📲 שליחת עדכון לעדי ב-WhatsApp</h2>
                  <button type="button" data-action="close-modal" class="font-bold cursor-pointer">✕</button>
                </div>
                <div class="flex gap-2">
                  <button type="button" data-action="wa-share-mode" data-mode="adi_focus" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.waShareMode === 'adi_focus' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">👩🏻 משימות עדי + משותפות</button>
                  <button type="button" data-action="wa-share-mode" data-mode="all" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.waShareMode === 'all' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">📋 כל המשימות הפתוחות</button>
                </div>
                <textarea id="wa-out-box" rows="7" class="w-full border rounded-xl p-3 text-xs bg-slate-50">${esc(waMsg)}</textarea>
                <div class="flex justify-end gap-2">
                  <button type="button" data-action="copy-wa-out" class="px-4 py-2 border rounded-xl text-xs font-bold cursor-pointer">📋 העתק</button>
                  <button type="button" data-action="send-wa-out" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-extrabold cursor-pointer">🚀 שלח ב-WhatsApp</button>
                </div>
              </div>
            </div>`;
          return;
        }

        // ד. מודאל חיבור ענן Firebase
        if (this.modal === 'cloud') {
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 shadow-2xl">
                <div class="flex justify-between items-center">
                  <h2 class="font-extrabold text-base">☁️ חיבור ענן בזמן אמת (Firebase)</h2>
                  <button type="button" data-action="close-modal" class="font-bold cursor-pointer">✕</button>
                </div>
                <p class="text-xs text-slate-600">כתובת ה-Realtime Database שלך שמורה ומסנכרנת כל שינוי בינך לבין עדי תוך שניות:</p>
                <input type="url" id="cloud-url-input" value="${esc(this.cloudUrl)}" placeholder="https://your-project-default-rtdb.firebaseio.com" class="w-full border rounded-xl p-2.5 text-xs font-mono" />
                <div class="flex justify-end gap-2">
                  <button type="button" data-action="save-cloud" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">💾 שמור והתחבר</button>
                </div>
              </div>
            </div>`;
          return;
        }

        // ה. מודאל גשר סנכרון מול Gemini
        if (this.modal === 'gemini') {
          const jsonExport = JSON.stringify({ tasks: this.tasks }, null, 2);
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl">
                <div class="flex justify-between items-center">
                  <h2 class="font-extrabold text-base">✨ סנכרון דו-כיווני מול הצ'אט של Gemini</h2>
                  <button type="button" data-action="close-modal" class="font-bold cursor-pointer">✕</button>
                </div>
                <p class="text-xs text-slate-600">העתק להדבקה בצ'אט עם Gemini, או הדבק כאן JSON ש-Gemini בנה עבורך:</p>
                <textarea id="gem-box" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-mono">${esc(jsonExport)}</textarea>
                <div class="flex justify-between">
                  <button type="button" data-action="copy-gem" class="px-3.5 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold cursor-pointer">📋 העתק מצב נוכחי</button>
                  <button type="button" data-action="import-gem" class="px-3.5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">📥 מזג JSON מ-Gemini</button>
                </div>
              </div>
            </div>`;
        }
      }

      // ----------------------------------------------------------------------
      // 5. ניהול אירועים (Event Delegation)
      // ----------------------------------------------------------------------
      bindEvents() {
        // זיהוי תתי-משימות בזמן הקלדה בשדה הראשי
        document.addEventListener('input', e => {
          if (e.target.id === 't-title') {
            this.updateLiveSubtaskBanner(e.target.value);
          } else if (e.target.id === 'q-input') {
            this.filters.q = e.target.value;
            this.renderView();
          }
        });

        document.addEventListener('change', e => {
          if (e.target.id === 'f-status') {
            this.filters.status = e.target.value;
            this.renderView();
          } else if (e.target.dataset.waIdx !== undefined) {
            const idx = Number(e.target.dataset.waIdx);
            const field = e.target.dataset.waField;
            if (!this.waExtractedDrafts[idx]) return;
            if (field === 'title') {
              this.waExtractedDrafts[idx].title = e.target.value;
            } else if (field === 'mode') {
              if (e.target.value === 'NEW') {
                this.waExtractedDrafts[idx].targetType = 'new_task';
              } else {
                this.waExtractedDrafts[idx].targetType = 'subtask';
                this.waExtractedDrafts[idx].parentTaskId = e.target.value;
              }
            }
          }
        });

        // שליחת טפסים (הוספת משימה/תת-משימה + שמירת חלון עריכה)
        document.addEventListener('submit', e => {
          if (e.target.id === 'add-form') {
            e.preventDefault();
            const titleIn = document.getElementById('t-title');
            const rawTitle = titleIn?.value.trim();
            if (!rawTitle) return;

            const targetParentId = document.getElementById('t-target-parent')?.value || 'NEW_TASK';

            if (targetParentId !== 'NEW_TASK') {
              const cleanSub = rawTitle.replace(/^(>|תת:|\+)\s*/, '').trim();
              let parentName = '';
              this.tasks = this.tasks.map(t => {
                if (t.id !== targetParentId) return t;
                parentName = t.title;
                return {
                  ...t,
                  subtasks: [...(t.subtasks || []), { id: uid('s'), title: cleanSub, done: false }]
                };
              });
              this.toast(`נוסף כתת-משימה תחת "${parentName}"! 🔗`, 'indigo');
              this.syncMutation(`הוסיף/ה תת-משימה ("${cleanSub}") תחת:`, parentName);
              return;
            }

            const t = normTask({
              title: rawTitle,
              assignee: document.getElementById('t-assignee').value,
              category: document.getElementById('t-category').value,
              priority: document.getElementById('t-priority').value,
              estimatedBudget: document.getElementById('t-budget').value
            }, this.user);

            this.tasks.unshift(t);
            this.toast(`המשימה "${t.title}" נוספה ללוח!`, 'emerald');
            this.syncMutation('הוסיף/ה משימה:', t.title);
          } else if (e.target.id === 'edit-task-form' && this.editingTask) {
            e.preventDefault();
            this.syncSubtaskInputsFromEditDom();

            const updated = normTask({
              ...this.editingTask,
              title: document.getElementById('ed-title').value.trim(),
              assignee: document.getElementById('ed-assignee').value,
              category: document.getElementById('ed-category').value,
              priority: document.getElementById('ed-priority').value,
              dueDate: document.getElementById('ed-duedate').value,
              estimatedBudget: document.getElementById('ed-est-budget').value,
              actualCost: document.getElementById('ed-act-cost').value,
              link: document.getElementById('ed-link').value.trim(),
              notes: document.getElementById('ed-notes').value.trim(),
              subtasks: this.editingTask.subtasks,
              updatedAt: new Date().toISOString()
            }, this.user);

            this.tasks = this.tasks.map(item => item.id === updated.id ? updated : item);
            this.modal = null;
            this.editingTask = null;
            this.toast('המשימה עודכנה בהצלחה! ✏️', 'emerald');
            this.syncMutation('ערך/ה משימה:', updated.title);
          }
        });

        // לחיצות על כפתורי פעולה
        document.addEventListener('click', e => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const act = btn.dataset.action;

          if (act === 'user') {
            this.user = btn.dataset.user;
            localStorage.setItem(KEYS.USER, this.user);
            this.toast(`משתמש פעיל: ${USERS[this.user].name} ${USERS[this.user].avatar}`);
            this.renderHeader();
          } else if (act === 'toggle-theme') {
            this.darkMode = !this.darkMode;
            document.body.classList.toggle('dark-mode', this.darkMode);
            localStorage.setItem(KEYS.THEME, this.darkMode ? 'dark' : 'light');
            this.renderHeader();
          } else if (act === 'quick-attach-subtask') {
            const parentId = btn.dataset.parentId;
            const titleIn = document.getElementById('t-title');
            const cleanSub = (titleIn?.value || '').replace(/^(>|תת:|\+)\s*/, '').trim();
            if (!cleanSub) return;

            let parentTitle = '';
            this.tasks = this.tasks.map(t => {
              if (t.id !== parentId) return t;
              parentTitle = t.title;
              return {
                ...t,
                subtasks: [...(t.subtasks || []), { id: uid('s'), title: cleanSub, done: false }]
              };
            });
            this.toast(`שויך חכם כתת-משימה תחת "${parentTitle}"! 🧠`, 'indigo');
            this.syncMutation(`הוסיף/ה תת-משימה חכמה ("${cleanSub}") תחת:`, parentTitle);
          } else if (act === 'view') {
            this.view = btn.dataset.view;
            this.renderToolbar();
            this.renderView();
          } else if (act === 'f-assign') {
            this.filters.assignee = btn.dataset.val;
            this.renderToolbar();
            this.renderView();
          } else if (act === 'f-cat') {
            this.filters.category = btn.dataset.val;
            this.renderToolbar();
            this.renderView();
          } else if (act === 'toggle') {
            let title = '';
            this.tasks = this.tasks.map(t => {
              if (t.id !== btn.dataset.id) return t;
              title = t.title;
              const next = !t.done;
              return { ...t, done: next, status: next ? 'done' : 'todo', completedBy: next ? this.user : null };
            });
            this.syncMutation('סימן/ה משימה:', title);
          } else if (act === 'pin') {
            this.tasks = this.tasks.map(t => t.id === btn.dataset.id ? { ...t, pinned: !t.pinned } : t);
            this.syncMutation('נעץ/שחרר משימה');
          } else if (act === 'set-status') {
            const { id, status } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === id ? { ...t, status, done: status === 'done', completedBy: status === 'done' ? this.user : null } : t);
            this.syncMutation('שינה/תה סטטוס בקנבן');
          } else if (act === 'add-sub') {
            const id = btn.dataset.id;
            const val = document.getElementById(`sub-in-${id}`)?.value.trim();
            if (!val) return;
            this.tasks = this.tasks.map(t => t.id === id ? { ...t, subtasks: [...(t.subtasks || []), { id: uid('s'), title: val, done: false }] } : t);
            this.syncMutation('הוסיף/ה שלב:', val);
          } else if (act === 'toggle-sub') {
            const { id, sub } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === id ? {
              ...t, subtasks: (t.subtasks || []).map(s => s.id === sub ? { ...s, done: !s.done } : s)
            } : t);
            this.syncMutation('סימן/ה שלב בתת-משימה');
          } else if (act === 'del-sub') {
            const { id, sub } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === id ? {
              ...t, subtasks: (t.subtasks || []).filter(s => s.id !== sub)
            } : t);
            this.syncMutation('מחק/ה תת-משימה');
          } else if (act === 'del') {
            this.tasks = this.tasks.filter(t => t.id !== btn.dataset.id);
            this.syncMutation('מחק/ה משימה');
          } else if (act === 'open-edit') {
            const found = this.tasks.find(t => t.id === btn.dataset.id);
            if (found) {
              this.editingTask = JSON.parse(JSON.stringify(found));
              this.modal = 'edit';
              this.renderModal();
            }
          } else if (act === 'edit-modal-add-sub') {
            if (!this.editingTask) return;
            this.syncSubtaskInputsFromEditDom();
            this.editingTask.subtasks.push({ id: uid('s'), title: 'שלב חדש', done: false });
            this.renderModal();
          } else if (act === 'edit-modal-del-sub') {
            if (!this.editingTask) return;
            this.syncSubtaskInputsFromEditDom();
            const idx = Number(btn.dataset.idx);
            this.editingTask.subtasks.splice(idx, 1);
            this.renderModal();
          } else if (act === 'modal') {
            this.modal = btn.dataset.modal;
            if (this.modal === 'whatsapp-import') this.waExtractedDrafts = [];
            this.renderModal();
          } else if (act === 'close-modal') {
            this.modal = null;
            this.editingTask = null;
            this.renderModal();
          } else if (act === 'analyze-wa-text') {
            const raw = document.getElementById('wa-raw-input')?.value || '';
            this.waExtractedDrafts = SmartSubtaskAndWhatsAppEngine.parseWhatsAppChat(raw, this.tasks);
            if (!this.waExtractedDrafts.length) {
              this.toast('לא זוהו שורות טקסט תקינות', 'red');
            }
            this.renderModal();
          } else if (act === 'commit-wa-import') {
            let newCount = 0;
            let subCount = 0;
            this.waExtractedDrafts.forEach(d => {
              if (!d.title.trim()) return;
              if (d.targetType === 'subtask' && d.parentTaskId) {
                this.tasks = this.tasks.map(t => {
                  if (t.id !== d.parentTaskId) return t;
                  subCount += 1;
                  return {
                    ...t,
                    subtasks: [...(t.subtasks || []), { id: uid('s'), title: d.title.trim(), done: false }]
                  };
                });
              } else {
                newCount += 1;
                this.tasks.unshift(normTask({
                  title: d.title.trim(),
                  assignee: d.assignee,
                  category: d.category,
                  priority: d.priority,
                  estimatedBudget: d.estimatedBudget,
                  subtasks: d.subtasks || []
                }, this.user));
              }
            });
            this.waExtractedDrafts = [];
            this.modal = null;
            this.toast(`יובאו מוואטסאפ: ${newCount} משימות ו-${subCount} תתי-משימות! 📥`, 'emerald');
            this.syncMutation(`ייבא/ה מ-WhatsApp (${newCount} משימות, ${subCount} תתי-משימות)`);
          } else if (act === 'wa-share-mode') {
            this.waShareMode = btn.dataset.mode;
            this.renderModal();
          } else if (act === 'copy-wa-out') {
            navigator.clipboard.writeText(document.getElementById('wa-out-box')?.value || '');
            this.toast('ההודעה הועתקה ללוח!', 'emerald');
          } else if (act === 'send-wa-out') {
            const txt = document.getElementById('wa-out-box')?.value || '';
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
          } else if (act === 'wa-single') {
            const t = this.tasks.find(x => x.id === btn.dataset.id);
            if (!t) return;
            const subs = (t.subtasks || []).map(s => `${s.done ? '✅' : '▫️'} ${s.title}`).join('\n');
            const msg = `*משימה מהלוח שלנו:* ${t.title}\nאחראי: ${USERS[t.assignee].name}${t.notes ? '\n📝 ' + t.notes : ''}${subs ? '\n\n*שלבים:*\n' + subs : ''}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
          } else if (act === 'save-cloud') {
            const val = document.getElementById('cloud-url-input')?.value.trim().replace(/\/$/, '');
            this.cloudUrl = val;
            localStorage.setItem(KEYS.CLOUD, val);
            this.modal = null;
            this.renderModal();
            if (val) {
              this.startCloudSync();
              this.toast('מחובר לענן בזמן אמת! ☁️', 'emerald');
            }
          } else if (act === 'copy-gem') {
            navigator.clipboard.writeText(document.getElementById('gem-box').value);
            this.toast('הועתק ללוח!', 'emerald');
          } else if (act === 'import-gem') {
            try {
              const raw = document.getElementById('gem-box').value;
              const match = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
              const parsed = JSON.parse(match ? match[1] : raw);
              const arr = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
              this.tasks = arr.map(t => normTask(t, this.user));
              this.modal = null;
              this.syncMutation('מזג/ה משימות מ-Gemini');
              this.toast('המשימות עודכנו מ-Gemini!', 'emerald');
            } catch {
              this.toast('שגיאה בפענוח ה-JSON', 'red');
            }
          } else if (act === 'export-backup') {
            const blob = new Blob([JSON.stringify(this.tasks, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ronen-adi-backup-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
          } else if (act === 'force-cloud-pull') {
            this.pullFromCloud(true);
            this.toast('מסנכרן מול הענן...', 'indigo');
          }
        });
      }

      syncSubtaskInputsFromEditDom() {
        if (!this.editingTask) return;
        const titleEls = document.querySelectorAll('.edit-sub-title');
        const doneEls = document.querySelectorAll('.edit-sub-done');
        titleEls.forEach(el => {
          const i = Number(el.dataset.idx);
          if (this.editingTask.subtasks[i]) {
            this.editingTask.subtasks[i].title = el.value.trim();
          }
        });
        doneEls.forEach(el => {
          const i = Number(el.dataset.idx);
          if (this.editingTask.subtasks[i]) {
            this.editingTask.subtasks[i].done = el.checked;
          }
        });
        this.editingTask.subtasks = this.editingTask.subtasks.filter(s => s.title.length > 0);
      }
    }

    window.addEventListener('DOMContentLoaded', () => new App());
  </script>
</body>
