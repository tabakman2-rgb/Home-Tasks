<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>המרחב המשותף של רונן ועדי ⚡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; background: #f8fafc; color: #0f172a; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <div id="toast-box" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2 pointer-events-none"></div>
  <div id="header-slot"></div>
  <main class="max-w-6xl w-full mx-auto px-3 sm:px-6 py-5 flex-1">
    <div id="quickadd-slot"></div>
    <div id="toolbar-slot"></div>
    <div id="view-slot"></div>
  </main>
  <div id="modal-slot"></div>

  <script type="module">
    const KEYS = {
      TASKS: 'ra_tasks_v2',
      AUDIT: 'ra_audit_v2',
      USER: 'ra_user_v2',
      CLOUD: 'ra_cloud_url_v2'
    };

    const USERS = {
      ronen: { id: 'ronen', name: 'רונן', avatar: '👨🏻‍💻', badge: 'bg-blue-100 text-blue-800 border-blue-300' },
      adi: { id: 'adi', name: 'עדי', avatar: '👩🏻', badge: 'bg-pink-100 text-pink-800 border-pink-300' },
      both: { id: 'both', name: 'משותף', avatar: '💑', badge: 'bg-violet-100 text-violet-800 border-violet-300' }
    };

    const CATEGORIES = {
      wedding: { id: 'wedding', label: 'חתונה ורבנות', icon: '💍', badge: 'bg-pink-50 text-pink-700 border-pink-200' },
      trip: { id: 'trip', label: 'טיולים וצימר', icon: '🏕️', badge: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      shopping: { id: 'shopping', label: 'קניות ועל האש', icon: '🥩', badge: 'bg-amber-50 text-amber-700 border-amber-200' },
      home: { id: 'home', label: 'בית ופרויקטים', icon: '🏠', badge: 'bg-blue-50 text-blue-700 border-blue-200' }
    };

    const PRIORITIES = {
      urgent: { id: 'urgent', label: 'דחוף', weight: 4, icon: '🔥', badge: 'bg-red-100 text-red-800 border-red-300 font-bold' },
      high: { id: 'high', label: 'גבוהה', weight: 3, icon: '⚡', badge: 'bg-orange-100 text-orange-800 border-orange-300' },
      medium: { id: 'medium', label: 'רגילה', weight: 2, icon: '📌', badge: 'bg-sky-100 text-sky-800 border-sky-300' },
      low: { id: 'low', label: 'נמוכה', weight: 1, icon: '🌱', badge: 'bg-slate-100 text-slate-700 border-slate-300' }
    };

    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    const esc = (s = '') => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function normTask(raw = {}, actor = 'ronen') {
      const done = Boolean(raw.done);
      return {
        id: raw.id || uid('t'),
        title: String(raw.title || 'משימה חדשה').trim(),
        category: CATEGORIES[raw.category] ? raw.category : 'wedding',
        assignee: USERS[raw.assignee] ? raw.assignee : 'both',
        priority: PRIORITIES[raw.priority] ? raw.priority : 'medium',
        done,
        dueDate: raw.dueDate || '',
        estimatedBudget: Number(raw.estimatedBudget) || 0,
        actualCost: Number(raw.actualCost) || 0,
        notes: String(raw.notes || '').trim(),
        subtasks: Array.isArray(raw.subtasks) ? raw.subtasks.map(s => ({
          id: s.id || uid('s'), title: String(s.title || '').trim(), done: Boolean(s.done)
        })).filter(s => s.title) : [],
        updatedAt: raw.updatedAt || new Date().toISOString(),
        completedBy: done ? (raw.completedBy || actor) : null
      };
    }

    class App {
      constructor() {
        this.user = localStorage.getItem(KEYS.USER) || 'ronen';
        this.cloudUrl = (localStorage.getItem(KEYS.CLOUD) || '').replace(/\/$/, '');
        this.cloudStatus = this.cloudUrl ? 'connecting' : 'offline';
        this.view = 'cards';
        this.modal = null;
        this.filters = { q: '', assignee: 'all', category: 'all', status: 'all' };
        this.lastCloudHash = '';
        this.isPushing = false;

        this.tasks = JSON.parse(localStorage.getItem(KEYS.TASKS) || 'null') || this.seed();
        this.audit = JSON.parse(localStorage.getItem(KEYS.AUDIT) || '[]');

        this.checkUrlParams();
        this.bindEvents();
        this.render();
        if (this.cloudUrl) this.startCloudSync();
      }

      seed() {
        return [
          normTask({
            id: 'rabbi_1',
            title: 'חיפוש ומציאת רב לחתונה (בדיקת צהר / רבנות / רב מוסמך)',
            category: 'wedding',
            assignee: 'both',
            priority: 'urgent',
            notes: 'לבדוק המלצות, סגנון חופה ותיאום מול המועצה הדתית',
            subtasks: [
              { id: 's1', title: 'בדיקת רשימת רבנים מומלצים', done: false },
              { id: 's2', title: 'פגישת הכרות וסגירת תאריך', done: false },
              { id: 's3', title: 'פתיחת תיק נישואין ברבנות', done: false }
            ]
          }),
          normTask({
            id: 'mova_1',
            title: 'הזמנת ציוד וחלקים לשואב MOVA P70 Pro Ultra',
            category: 'home',
            assignee: 'ronen',
            priority: 'medium',
            estimatedBudget: 120,
            notes: 'לבדוק מלאי פילטרים, שקיות אבק, מטליות ומברשות ולהזמין מאליאקספרס'
          })
        ];
      }

      checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const cUrl = params.get('cloud');
        if (cUrl) {
          this.cloudUrl = decodeURIComponent(cUrl).replace(/\/$/, '');
          localStorage.setItem(KEYS.CLOUD, this.cloudUrl);
          this.toast('חיבור הענן נשמר אוטומטית במכשיר! ☁️', 'emerald');
          window.history.replaceState({}, '', window.location.pathname);
        }
      }

      saveLocal() {
        localStorage.setItem(KEYS.TASKS, JSON.stringify(this.tasks));
        localStorage.setItem(KEYS.AUDIT, JSON.stringify(this.audit.slice(0, 60)));
      }

      async syncMutation(actionLabel, taskTitle = '') {
        this.audit = [{
          id: uid('log'),
          actorName: USERS[this.user].name,
          actorAvatar: USERS[this.user].avatar,
          action: actionLabel,
          taskTitle,
          time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
        }, ...this.audit].slice(0, 60);

        this.saveLocal();
        this.render();
        if (this.cloudUrl) await this.pushToCloud();
      }

      // --- מנוע סנכרון ענן בזמן אמת (Firebase Realtime DB REST) ---
      getEndpoint() {
        return `${this.cloudUrl}/ronen_adi_board.json`;
      }

      async pushToCloud() {
        if (!this.cloudUrl) return;
        this.isPushing = true;
        try {
          const payload = {
            updatedAt: Date.now(),
            updatedBy: this.user,
            tasks: this.tasks,
            audit: this.audit
          };
          const bodyStr = JSON.stringify(payload);
          this.lastCloudHash = JSON.stringify(this.tasks) + JSON.stringify(this.audit);
          const res = await fetch(this.getEndpoint(), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          this.cloudStatus = 'online';
          this.renderHeader();
        } catch (e) {
          this.cloudStatus = 'error';
          this.renderHeader();
        } finally {
          this.isPushing = false;
        }
      }

      async pullFromCloud(isInitial = false) {
        if (!this.cloudUrl || this.isPushing) return;
        try {
          const res = await fetch(this.getEndpoint());
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this.cloudStatus = 'online';

          if (!data || !Array.isArray(data.tasks)) {
            if (isInitial) await this.pushToCloud();
            this.renderHeader();
            return;
          }

          const incomingHash = JSON.stringify(data.tasks) + JSON.stringify(data.audit || []);
          if (incomingHash !== this.lastCloudHash) {
            this.lastCloudHash = incomingHash;
            this.tasks = data.tasks.map(t => normTask(t, this.user));
            this.audit = Array.isArray(data.audit) ? data.audit : this.audit;
            this.saveLocal();
            this.render();
          } else if (isInitial) {
            this.renderHeader();
          }
        } catch {
          this.cloudStatus = 'error';
          this.renderHeader();
        }
      }

      startCloudSync() {
        if (this.pollTimer) clearInterval(this.pollTimer);
        this.pullFromCloud(true);
        this.pollTimer = setInterval(() => this.pullFromCloud(false), 3000);
      }

      toast(msg, color = 'slate') {
        const box = document.getElementById('toast-box');
        const el = document.createElement('div');
        const bg = color === 'emerald' ? 'bg-emerald-600' : color === 'red' ? 'bg-red-600' : 'bg-slate-900';
        el.className = `${bg} text-white px-4 py-2 rounded-xl shadow-lg text-xs sm:text-sm font-bold`;
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      getFiltered() {
        const q = this.filters.q.trim().toLowerCase();
        return [...this.tasks].filter(t => {
          if (this.filters.status === 'open' && t.done) return false;
          if (this.filters.status === 'done' && !t.done) return false;
          if (this.filters.assignee === 'ronen' && !(t.assignee === 'ronen' || t.assignee === 'both')) return false;
          if (this.filters.assignee === 'adi' && !(t.assignee === 'adi' || t.assignee === 'both')) return false;
          if (this.filters.category !== 'all' && t.category !== this.filters.category) return false;
          if (q && !t.title.toLowerCase().includes(q) && !(t.notes || '').toLowerCase().includes(q)) return false;
          return true;
        }).sort((a, b) => (a.done === b.done ? (PRIORITIES[b.priority]?.weight || 2) - (PRIORITIES[a.priority]?.weight || 2) : a.done ? 1 : -1));
      }

      render() {
        this.renderHeader();
        this.renderQuickAdd();
        this.renderToolbar();
        this.renderView();
        this.renderModal();
      }

      renderHeader() {
        const doneCount = this.tasks.filter(t => t.done).length;
        const total = this.tasks.length;
        const pct = total ? Math.round((doneCount / total) * 100) : 0;
        const budget = this.tasks.reduce((s, t) => s + (Number(t.estimatedBudget) || 0), 0);

        const badge = this.cloudStatus === 'online'
          ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">☁️ מסונכרן חי בענן</span>`
          : this.cloudStatus === 'error'
          ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-800 border border-red-300">⚠️ שגיאת ענן (בדוק קישור)</span>`
          : `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300">💾 שמירה מקומית (לחץ לחיבור ענן)</span>`;

        document.getElementById('header-slot').innerHTML = `
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
            <div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h1 class="text-lg sm:text-xl font-extrabold">⚡ המרחב של רונן ועדי</h1>
                  ${badge}
                </div>
                <p class="text-xs text-slate-500 mt-0.5">הושלמו ${doneCount}/${total} (${pct}%) • תקציב משוער: ₪${budget.toLocaleString()}</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="inline-flex bg-slate-100 p-1 rounded-xl border">
                  <button type="button" data-action="user" data-user="ronen" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.user === 'ronen' ? 'bg-blue-600 text-white' : 'text-slate-600'}">👨🏻‍💻 רונן</button>
                  <button type="button" data-action="user" data-user="adi" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.user === 'adi' ? 'bg-pink-600 text-white' : 'text-slate-600'}">👩🏻 עדי</button>
                </div>
                <button type="button" data-action="modal" data-modal="cloud" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-white cursor-pointer">☁️ חיבור ענן</button>
                <button type="button" data-action="modal" data-modal="gemini" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white cursor-pointer">✨ גשר Gemini</button>
                <button type="button" data-action="share-wa" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white cursor-pointer">📲 שלח לעדי ב-WhatsApp</button>
              </div>
            </div>
          </header>
        `;
      }

      renderQuickAdd() {
        const cats = Object.values(CATEGORIES).map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join('');
        document.getElementById('quickadd-slot').innerHTML = `
          <form id="add-form" class="bg-white rounded-2xl border border-slate-200 p-3 mb-4 flex flex-col sm:flex-row gap-2 shadow-2xs">
            <input type="text" id="t-title" required placeholder="הוסף משימה חדשה..." class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-indigo-500" />
            <div class="flex flex-wrap gap-1.5">
              <select id="t-assignee" class="rounded-xl border border-slate-300 px-2.5 py-2 text-xs font-bold">
                <option value="both">💑 משותף</option>
                <option value="ronen">👨🏻‍💻 רונן</option>
                <option value="adi">👩🏻 עדי</option>
              </select>
              <select id="t-category" class="rounded-xl border border-slate-300 px-2.5 py-2 text-xs font-bold">${cats}</select>
              <select id="t-priority" class="rounded-xl border border-slate-300 px-2.5 py-2 text-xs font-bold">
                <option value="medium">📌 רגילה</option>
                <option value="high">⚡ גבוהה</option>
                <option value="urgent">🔥 דחוף</option>
                <option value="low">🌱 נמוכה</option>
              </select>
              <input type="number" id="t-budget" placeholder="תקציב ₪" class="w-24 rounded-xl border border-slate-300 px-2.5 py-2 text-xs" />
              <button type="submit" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white text-xs font-bold cursor-pointer">+ הוסף</button>
            </div>
          </form>
        `;
      }

      renderToolbar() {
        document.getElementById('toolbar-slot').innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-3 mb-4 flex flex-wrap items-center justify-between gap-2">
            <div class="flex gap-1.5">
              <button type="button" data-action="view" data-view="cards" class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${this.view === 'cards' ? 'bg-slate-900 text-white' : 'bg-slate-100'}">🗂️ כרטיסיות</button>
              <button type="button" data-action="view" data-view="table" class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${this.view === 'table' ? 'bg-slate-900 text-white' : 'bg-slate-100'}">📊 טבלה ותקציב</button>
              <button type="button" data-action="view" data-view="audit" class="px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer ${this.view === 'audit' ? 'bg-slate-900 text-white' : 'bg-slate-100'}">🕒 יומן (${this.audit.length})</button>
            </div>
            <div class="flex flex-wrap gap-1.5 items-center">
              <button type="button" data-action="f-assign" data-val="all" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.filters.assignee === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-100'}">הכל</button>
              <button type="button" data-action="f-assign" data-val="ronen" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.filters.assignee === 'ronen' ? 'bg-indigo-600 text-white' : 'bg-slate-100'}">👨🏻‍💻 רונן</button>
              <button type="button" data-action="f-assign" data-val="adi" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.filters.assignee === 'adi' ? 'bg-indigo-600 text-white' : 'bg-slate-100'}">👩🏻 עדי</button>
              <input type="search" id="q-input" value="${esc(this.filters.q)}" placeholder="חיפוש..." class="rounded-lg border px-2.5 py-1 text-xs" />
            </div>
          </div>
        `;
      }

      renderView() {
        const slot = document.getElementById('view-slot');
        const list = this.getFiltered();

        if (this.view === 'audit') {
          slot.innerHTML = `<div class="bg-white rounded-2xl border divide-y">${this.audit.map(a => `
            <div class="p-3 flex justify-between text-xs">
              <span>${a.actorAvatar} <strong>${esc(a.actorName)}</strong> ${esc(a.action)} ${a.taskTitle ? `"${esc(a.taskTitle)}"` : ''}</span>
              <span class="font-mono text-slate-400">${esc(a.time)}</span>
            </div>`).join('') || '<div class="p-6 text-center text-xs text-slate-400">אין פעולות עדיין</div>'}</div>`;
          return;
        }

        if (this.view === 'table') {
          const totalEst = list.reduce((s, t) => s + (Number(t.estimatedBudget) || 0), 0);
          slot.innerHTML = `
            <div class="bg-white rounded-2xl border overflow-x-auto">
              <table class="w-full text-right text-xs">
                <thead class="bg-slate-100 font-bold border-b">
                  <tr><th class="p-2.5 text-center">בוצע</th><th class="p-2.5">משימה</th><th class="p-2.5">אחראי</th><th class="p-2.5">קטגוריה</th><th class="p-2.5">תקציב (₪)</th><th class="p-2.5 text-center">מחק</th></tr>
                </thead>
                <tbody class="divide-y">${list.map(t => `
                  <tr class="${t.done ? 'bg-emerald-50/40 text-slate-400 line-through' : ''}">
                    <td class="p-2.5 text-center"><input type="checkbox" data-action="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''} class="w-4 h-4 cursor-pointer" /></td>
                    <td class="p-2.5 font-bold">${esc(t.title)}</td>
                    <td class="p-2.5">${USERS[t.assignee]?.avatar} ${USERS[t.assignee]?.name}</td>
                    <td class="p-2.5">${CATEGORIES[t.category]?.icon} ${CATEGORIES[t.category]?.label}</td>
                    <td class="p-2.5 font-mono">₪${Number(t.estimatedBudget || 0).toLocaleString()}</td>
                    <td class="p-2.5 text-center"><button type="button" data-action="del" data-id="${t.id}" class="cursor-pointer">🗑️</button></td>
                  </tr>`).join('')}</tbody>
                <tfoot class="bg-slate-900 text-white font-bold">
                  <tr><td colspan="4" class="p-2.5">סה"כ:</td><td colspan="2" class="p-2.5 font-mono">₪${totalEst.toLocaleString()}</td></tr>
                </tfoot>
              </table>
            </div>`;
          return;
        }

        slot.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">${list.map(t => {
          const cat = CATEGORIES[t.category] || CATEGORIES.wedding;
          const own = USERS[t.assignee] || USERS.both;
          const prio = PRIORITIES[t.priority] || PRIORITIES.medium;
          const subs = t.subtasks || [];
          return `
            <article class="bg-white rounded-2xl border ${t.done ? 'border-emerald-200 bg-emerald-50/20 opacity-80' : 'border-slate-200'} p-4 flex flex-col justify-between shadow-2xs">
              <div>
                <div class="flex justify-between items-center gap-1 flex-wrap mb-2">
                  <div class="flex gap-1 flex-wrap">
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border ${cat.badge}">${cat.icon} ${cat.label}</span>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold border ${own.badge}">${own.avatar} ${own.name}</span>
                    <span class="px-2 py-0.5 rounded-full text-[11px] border ${prio.badge}">${prio.icon} ${prio.label}</span>
                  </div>
                  <button type="button" data-action="del" data-id="${t.id}" class="text-slate-300 hover:text-red-600 text-xs cursor-pointer">🗑️</button>
                </div>
                <div class="flex items-start gap-2.5 my-1.5">
                  <button type="button" data-action="toggle" data-id="${t.id}" class="mt-0.5 w-6 h-6 rounded-lg border-2 flex items-center justify-center cursor-pointer shrink-0 ${t.done ? 'bg-emerald-500 border-emerald-500 text-white font-bold' : 'border-slate-300 bg-white text-transparent'}">✓</button>
                  <div>
                    <h3 class="font-bold text-sm sm:text-base ${t.done ? 'line-through text-slate-400' : ''}">${esc(t.title)}</h3>
                    ${t.notes ? `<p class="text-xs text-slate-500 mt-1">📝 ${esc(t.notes)}</p>` : ''}
                  </div>
                </div>
                <div class="mt-2.5 pt-2 border-t border-slate-100 space-y-1.5">
                  ${subs.map(s => `
                    <label class="flex items-center gap-2 text-xs cursor-pointer">
                      <input type="checkbox" data-action="toggle-sub" data-id="${t.id}" data-sub="${s.id}" ${s.done ? 'checked' : ''} class="rounded text-indigo-600" />
                      <span class="${s.done ? 'line-through text-slate-400' : 'font-medium'}">${esc(s.title)}</span>
                    </label>`).join('')}
                  <div class="flex gap-1 pt-1">
                    <input type="text" id="sub-in-${t.id}" placeholder="הוסף תת-משימה..." class="flex-1 border rounded-lg px-2 py-1 text-xs" />
                    <button type="button" data-action="add-sub" data-id="${t.id}" class="px-2.5 py-1 bg-slate-800 text-white rounded-lg text-xs font-bold cursor-pointer">+</button>
                  </div>
                </div>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between text-[11px] text-slate-400">
                <span>${t.estimatedBudget > 0 ? `💰 ₪${Number(t.estimatedBudget).toLocaleString()}` : ''}</span>
                <span>${t.done ? `✅ בוצע ע"י ${USERS[t.completedBy]?.name || 'משותף'}` : ''}</span>
              </div>
            </article>`;
        }).join('')}</div>`;
      }

      renderModal() {
        const slot = document.getElementById('modal-slot');
        if (!this.modal) { slot.innerHTML = ''; return; }

        if (this.modal === 'cloud') {
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 shadow-2xl">
                <div class="flex justify-between items-center">
                  <h2 class="font-extrabold text-base">☁️ הגדרת סנכרון ענן חי (Firebase)</h2>
                  <button type="button" data-action="close-modal" class="font-bold cursor-pointer">✕</button>
                </div>
                <p class="text-xs text-slate-600">הדבק כאן את כתובת ה-Realtime Database מ-Firebase. כשתשלח לעדי קישור בוואטסאפ, הענן יתחבר אצלה אוטומטית!</p>
                <input type="url" id="cloud-url-input" value="${esc(this.cloudUrl)}" placeholder="https://your-project-default-rtdb.firebaseio.com" class="w-full border rounded-xl p-2.5 text-xs font-mono" />
                <div class="flex justify-end gap-2">
                  <button type="button" data-action="save-cloud" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">💾 שמור והתחבר לענן</button>
                </div>
              </div>
            </div>`;
        } else if (this.modal === 'gemini') {
          const jsonExport = JSON.stringify({ tasks: this.tasks }, null, 2);
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-5 space-y-3 shadow-2xl">
                <div class="flex justify-between items-center">
                  <h2 class="font-extrabold text-base">✨ סנכרון מול הצ'אט של Gemini</h2>
                  <button type="button" data-action="close-modal" class="font-bold cursor-pointer">✕</button>
                </div>
                <p class="text-xs text-slate-600">העתק להדבקה אצל Gemini, או הדבק כאן JSON ש-Gemini יצר עבורך:</p>
                <textarea id="gem-box" rows="6" class="w-full border rounded-xl p-2.5 text-xs font-mono">${esc(jsonExport)}</textarea>
                <div class="flex justify-between">
                  <button type="button" data-action="copy-gem" class="px-3 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold cursor-pointer">📋 העתק מצב נוכחי</button>
                  <button type="button" data-action="import-gem" class="px-3 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">📥 טען JSON מ-Gemini</button>
                </div>
              </div>
            </div>`;
        }
      }

      bindEvents() {
        document.addEventListener('submit', e => {
          if (e.target.id === 'add-form') {
            e.preventDefault();
            const title = document.getElementById('t-title').value.trim();
            if (!title) return;
            const t = normTask({
              title,
              assignee: document.getElementById('t-assignee').value,
              category: document.getElementById('t-category').value,
              priority: document.getElementById('t-priority').value,
              estimatedBudget: document.getElementById('t-budget').value
            }, this.user);
            this.tasks.unshift(t);
            this.syncMutation('הוסיף/ה משימה:', t.title);
          }
        });

        document.addEventListener('click', e => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const act = btn.dataset.action;

          if (act === 'user') {
            this.user = btn.dataset.user;
            localStorage.setItem(KEYS.USER, this.user);
            this.renderHeader();
          } else if (act === 'view') {
            this.view = btn.dataset.view;
            this.renderToolbar();
            this.renderView();
          } else if (act === 'f-assign') {
            this.filters.assignee = btn.dataset.val;
            this.renderToolbar();
            this.renderView();
          } else if (act === 'toggle') {
            let title = '';
            this.tasks = this.tasks.map(t => {
              if (t.id !== btn.dataset.id) return t;
              title = t.title;
              const next = !t.done;
              return { ...t, done: next, completedBy: next ? this.user : null };
            });
            this.syncMutation('שינה/תה סטטוס משימה:', title);
          } else if (act === 'add-sub') {
            const id = btn.dataset.id;
            const val = document.getElementById(`sub-in-${id}`)?.value.trim();
            if (!val) return;
            this.tasks = this.tasks.map(t => t.id === id ? { ...t, subtasks: [...(t.subtasks || []), { id: uid('s'), title: val, done: false }] } : t);
            this.syncMutation('הוסיף/ה שלב:', val);
          } else if (act === 'toggle-sub') {
            const { id, sub } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === id ? {
              ...t, subtasks: (t.subtasks || []).map(s => s.id === sub ? { ...s, done: !s.done } : s)
            } : t);
            this.syncMutation('סימן/ה שלב בתת-משימה');
          } else if (act === 'del') {
            this.tasks = this.tasks.filter(t => t.id !== btn.dataset.id);
            this.syncMutation('מחק/ה משימה');
          } else if (act === 'modal') {
            this.modal = btn.dataset.modal;
            this.renderModal();
          } else if (act === 'close-modal') {
            this.modal = null;
            this.renderModal();
          } else if (act === 'save-cloud') {
            const val = document.getElementById('cloud-url-input')?.value.trim().replace(/\/$/, '');
            this.cloudUrl = val;
            localStorage.setItem(KEYS.CLOUD, val);
            this.modal = null;
            this.renderModal();
            if (val) {
              this.startCloudSync();
              this.toast('מחובר לענן בזמן אמת! ☁️', 'emerald');
            }
          } else if (act === 'copy-gem') {
            navigator.clipboard.writeText(document.getElementById('gem-box').value);
            this.toast('הועתק ללוח!', 'emerald');
          } else if (act === 'import-gem') {
            try {
              const raw = document.getElementById('gem-box').value;
              const match = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
              const parsed = JSON.parse(match ? match[1] : raw);
              const arr = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
              this.tasks = arr.map(t => normTask(t, this.user));
              this.modal = null;
              this.syncMutation('עדכן/ה משימות מ-Gemini');
              this.toast('המשימות עודכנו מ-Gemini!', 'emerald');
            } catch {
              this.toast('שגיאה בפענוח ה-JSON', 'red');
            }
          } else if (act === 'share-wa') {
            const base = window.location.href.split('?')[0];
            const link = this.cloudUrl ? `${base}?cloud=${encodeURIComponent(this.cloudUrl)}` : base;
            const openList = this.tasks.filter(t => !t.done).map((t, i) => `${i + 1}. *${t.title}* (${USERS[t.assignee].name})`).join('\n');
            const msg = `היי עדי ❤️, הנה הלוח המשותף שלנו:\n\n${openList || 'הכל בוצע!'}\n\n🔗 *לפתיחה וסימון בזמן אמת:*\n${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
          }
        });

        document.addEventListener('input', e => {
          if (e.target.id === 'q-input') {
            this.filters.q = e.target.value;
            this.renderView();
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => new App());
  </script>
</body>
</html>
