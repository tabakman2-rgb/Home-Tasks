      updateQuickTaskNLPPreview(rawVal) {
        this.quickTaskDraft.rawInput = rawVal;
        const p = NLPEngine.parseQuickTaskInput(rawVal);
        const parentMatch = NLPEngine.findParentMatch(p.cleanTitle || rawVal, this.tasksList);

        const box = document.getElementById('qa-nlp-preview');
        if (!box) return;

        const chips = [];
        if (p.dueDate) chips.push(`📅 ${formatShortHebDate(p.dueDate)}${p.dueTime ? ' ' + p.dueTime : ''}`);
        if (p.assignee) chips.push(`${USERS[p.assignee].avatar} ${USERS[p.assignee].name}`);
        if (p.category) chips.push(`${CATEGORIES[p.category].icon} ${CATEGORIES[p.category].label}`);
        if (p.priority) chips.push(`${PRIORITIES[p.priority].icon} ${PRIORITIES[p.priority].label}`);
        if (p.estimatedBudget > 0) chips.push(`💰 ₪${p.estimatedBudget.toLocaleString()}`);

        let html = '';
        if (chips.length) {
          html += `<div class="flex flex-wrap gap-1.5 text-[11px] font-bold">${chips.map(c => `<span class="px-2 py-0.5 rounded-lg bg-indigo-500/15 text-indigo-600 dark:text-indigo-300">✨ ${esc(c)}</span>`).join('')}</div>`;
        }
        if (parentMatch) {
          html += `
            <div class="rounded-xl bg-indigo-500/10 border border-indigo-500/30 p-2.5 flex items-center justify-between gap-2 text-xs">
              <div class="truncate">🧠 שייך ל-<strong class="text-indigo-600 dark:text-indigo-300">"${esc(parentMatch.parentTask.title)}"</strong></div>
              <button type="button" data-act="qa-attach-parent" data-parent-id="${parentMatch.parentTask.id}" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-extrabold shrink-0 cursor-pointer">↳ הוסף כשלב</button>
            </div>
          `;
        }
        box.innerHTML = html;
      }

      updateExpenseImpactLive() {
        const ed = this.quickExpenseDraft;
        const numAmt = parseFloat(ed.amountStr) || 0;
        const rate = ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1);
        const amountAgorot = Math.round(numAmt * rate * 100);
        const previewExp = normExpense({
          ...ed,
          amountAgorot,
          ronenShareAgorot: ed.splitType === 'custom' ? Math.round((parseFloat(ed.customRonenStr) || 0) * 100) : 0
        });
        const delta = FinanceEngine.expenseDelta(previewExp);
        const el = document.getElementById('qa-exp-impact');
        if (!el) return;
        if (amountAgorot <= 0) {
          el.textContent = 'הזן סכום כדי לראות את ההשפעה על ההתחשבנות';
        } else if (ed.paymentMethod === 'joint_card') {
          el.textContent = `🏦 יירשם תחת אשראי משותף (${formatILS(amountAgorot)}) — ללא החזר ביניכם`;
        } else if (delta > 0) {
          el.textContent = `💡 עדי תצטרך להחזיר לרונן ${formatILS(delta)} על הוצאה זו`;
        } else if (delta < 0) {
          el.textContent = `💡 רונן יצטרך להחזיר לעדי ${formatILS(Math.abs(delta))} על הוצאה זו`;
        } else {
          el.textContent = '✨ ללא שינוי במאזן ההחזרים';
        }
      }

      // =======================================================================
      // 8. ניהול אירועים, קיצורי מקלדת ומחוות Swipe במובייל
      // =======================================================================
      bindGlobalEvents() {
        // קיצורי מקלדת למחשב (N = משימה חדשה, E = הוצאה חדשה, Esc = סגירה)
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && this.sheet) {
            this.sheet = null;
            this.renderSheet();
            return;
          }
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if ((e.key === 'n' || e.key === 'N' || e.key === 'מ') && !e.metaKey && !e.ctrlKey) {
            e.preventDefault();
            this.openQuickSheet('task');
          } else if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey) {
            e.preventDefault();
            this.openQuickSheet('expense');
          }
        });

        // מחוות החלקה (Swipe) במובייל על שורות משימה
        let touchStartX = 0, touchStartY = 0, swipeEl = null, swipeId = null;
        document.addEventListener('touchstart', e => {
          const card = e.target.closest('[data-swipe-id]');
          if (!card || e.touches.length !== 1) return;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          swipeEl = card;
          swipeId = card.dataset.swipeId;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
          if (!swipeEl) return;
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (Math.abs(dy) > Math.abs(dx) * 1.1) { swipeEl = null; return; }
          if (Math.abs(dx) > 16) {
            const clamped = Math.max(-90, Math.min(90, dx));
            swipeEl.style.transform = `translateX(${clamped}px)`;
          }
        }, { passive: true });

        document.addEventListener('touchend', e => {
          if (!swipeEl || !swipeId) return;
          const dx = e.changedTouches[0].clientX - touchStartX;
          swipeEl.style.transform = '';
          const id = swipeId;
          swipeEl = null; swipeId = null;
          if (dx > 72) {
            this.toggleTaskDone(id);
          } else if (dx < -72) {
            this.snoozeTaskToTomorrow(id);
          }
        });

        // קלטים בזמן אמת
        document.addEventListener('input', e => {
          const id = e.target.id;
          if (id === 'home-search-input') {
            this.taskFilters.q = e.target.value;
            this.renderMainPreservingFocus();
          } else if (id === 'qa-task-input') {
            this.updateQuickTaskNLPPreview(e.target.value);
          } else if (id === 'qa-exp-amount') {
            this.quickExpenseDraft.amountStr = e.target.value;
            this.updateExpenseImpactLive();
          } else if (id === 'qa-exp-title') {
            this.quickExpenseDraft.title = e.target.value;
          } else if (id === 'qa-exp-custom-ronen') {
            this.quickExpenseDraft.customRonenStr = e.target.value;
            this.updateExpenseImpactLive();
          } else if (id === 'wa-import-box') {
            this.waRawInput = e.target.value;
          }
        });

        document.addEventListener('change', e => {
          const el = e.target;
          if (el.id === 'qa-date-manual') {
            this.quickTaskDraft.dueDate = el.value;
          } else if (el.id === 'qa-time-manual') {
            this.quickTaskDraft.dueTime = el.value;
          } else if (el.id === 'import-json-file') {
            const file = el.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => this.mergeExternalJSON(reader.result);
            reader.readAsText(file);
          } else if (el.dataset.waIdx !== undefined) {
            const idx = Number(el.dataset.waIdx);
            const item = this.waDrafts[idx];
            if (!item) return;
            if (el.dataset.waField === 'title') item.title = el.value;
            else if (el.dataset.waField === 'mode') {
              if (el.value === 'NEW') item.targetType = 'new_task';
              else if (el.value === 'EXPENSE') item.targetType = 'expense';
              else { item.targetType = 'subtask'; item.parentTaskId = el.value; }
            }
          }
        });

        // שליחת טפסים
        document.addEventListener('submit', e => {
          const form = e.target;
          if (form.dataset.subForm) {
            e.preventDefault();
            const tid = form.dataset.subForm;
            const inp = document.getElementById(`sub-input-${tid}`);
            const title = inp?.value.trim();
            if (!title || !this.tasksMap[tid]) return;
            const t = this.tasksMap[tid];
            const next = { ...t, subtasks: [...(t.subtasks || []), { id: uid('s'), title, done: false }] };
            this.saveTask(next, `הוסיף/ה שלב ("${title}")`);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            return;
          }

          if (form.id === 'quick-task-form') {
            e.preventDefault();
            const raw = document.getElementById('qa-task-input')?.value.trim();
            if (!raw) return;
            const p = NLPEngine.parseQuickTaskInput(raw);
            const td = this.quickTaskDraft;

            const newTask = normTask({
              title: p.cleanTitle || raw,
              assignee: p.assignee || td.assignee,
              category: p.category || td.category,
              priority: p.priority || td.priority,
              dueDate: td.dueDate || p.dueDate,
              dueTime: td.dueTime || p.dueTime,
              estimatedBudget: p.estimatedBudget || td.estimatedBudget,
              remindLead: td.remindLead
            }, this.user);

            this.saveTask(newTask, 'הוסיף/ה משימה');
            FeedbackEngine.play('pop', this.settings.soundEnabled);

            if (this.settings.ntfyTopic && this.settings.ntfyOnAssign && newTask.assignee !== this.user) {
              AlertEngine.sendNtfyPush(this.settings.ntfyTopic, `⚡ ${USERS[this.user].name} הוסיף/ה משימה: ${newTask.title}${newTask.dueDate ? ' (' + formatShortHebDate(newTask.dueDate) + ')' : ''}`);
            }

            this.sheet = null;
            this.renderSheet();
            this.toast(`נוספה משימה: "${newTask.title}"`, 'indigo');
            return;
          }

          if (form.id === 'quick-expense-form') {
            e.preventDefault();
            const ed = this.quickExpenseDraft;
            const numAmt = parseFloat(document.getElementById('qa-exp-amount')?.value || '0');
            const title = document.getElementById('qa-exp-title')?.value.trim();
            if (!title || !(numAmt > 0)) return;

            const rate = ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1);
            const amountAgorot = Math.round(numAmt * rate * 100);
            const exp = normExpense({
              ...ed,
              title,
              amountAgorot,
              originalAmount: numAmt,
              rateUsed: rate,
              ronenShareAgorot: ed.splitType === 'custom' ? Math.round((parseFloat(ed.customRonenStr) || 0) * 100) : 0,
              createdBy: this.user
            });

            this.saveExpense(exp, 'רשם/ה הוצאה');
            FeedbackEngine.play('coin', this.settings.soundEnabled);

            if (this.settings.ntfyTopic && this.settings.ntfyOnExpense && exp.paymentMethod === 'personal') {
              const fin = FinanceEngine.computeSummary(this.expensesList);
              AlertEngine.sendNtfyPush(this.settings.ntfyTopic, `💸 ${USERS[this.user].name} רשם/ה הוצאה: ${exp.title} (${formatILS(exp.amountAgorot)}). מאזן: ${fin.direction.shortText}`);
            }

            this.sheet = null;
            this.renderSheet();
            this.toast(`נרשמה הוצאה: ${exp.title} (${formatILS(exp.amountAgorot)})`, 'emerald');
            return;
          }

          if (form.id === 'edit-task-form' && this.editingTask) {
            e.preventDefault();
            const updated = {
              ...this.editingTask,
              title: document.getElementById('ed-title').value.trim(),
              assignee: document.getElementById('ed-assignee').value,
              category: document.getElementById('ed-category').value,
              priority: document.getElementById('ed-priority').value,
              dueDate: document.getElementById('ed-dueDate').value,
              dueTime: document.getElementById('ed-dueTime').value,
              estimatedBudget: Number(document.getElementById('ed-budget').value) || 0,
              link: document.getElementById('ed-link').value.trim(),
              notes: document.getElementById('ed-notes').value.trim()
            };
            this.saveTask(updated, 'ערך/ה משימה');
            this.sheet = null;
            this.editingTask = null;
            this.renderSheet();
            this.toast('המשימה עודכנה! ✏️', 'emerald');
            return;
          }

          if (form.id === 'edit-expense-form' && this.editingExpense) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('ee-amount').value || '0');
            if (!(amount > 0)) return;
            const updated = {
              ...this.editingExpense,
              title: document.getElementById('ee-title').value.trim(),
              amountAgorot: Math.round(amount * 100),
              originalAmount: amount,
              currency: 'ILS',
              date: document.getElementById('ee-date').value || todayISO(0),
              paymentMethod: document.getElementById('ee-method').value,
              paidBy: document.getElementById('ee-payer').value,
              splitType: document.getElementById('ee-split').value,
              category: document.getElementById('ee-cat').value
            };
            this.saveExpense(updated, 'ערך/ה הוצאה');
            this.sheet = null;
            this.editingExpense = null;
            this.renderSheet();
            this.toast('ההוצאה עודכנה!', 'emerald');
            return;
          }

          if (form.id === 'settle-form') {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('st-amount').value || '0');
            const paidBy = document.getElementById('st-payer').value;
            if (!(amount > 0)) return;
            const settlement = normExpense({
              title: `העברת התחשבנות (${USERS[paidBy].name} ← ${paidBy === 'adi' ? 'רונן' : 'עדי'})`,
              amountAgorot: Math.round(amount * 100),
              paymentMethod: 'personal',
              paidBy,
              splitType: 'settlement',
              category: 'bills',
              date: todayISO(0),
              createdBy: this.user
            });
            this.saveExpense(settlement, 'סגר/ה התחשבנות');
            FeedbackEngine.play('complete', this.settings.soundEnabled);
            FeedbackEngine.confetti();
            this.sheet = null;
            this.renderSheet();
            this.toast('ההעברה נרשמה והמאזן עודכן! 🤝', 'emerald');
          }
        });

        // לחיצות על כפתורי פעולה
        document.addEventListener('click', e => {
          const btn = e.target.closest('[data-act]');
          if (!btn) return;
          const act = btn.dataset.act;

          if (act === 'backdrop-close' && e.target === btn) {
            this.sheet = null; this.renderSheet(); return;
          }
          if (act === 'close-sheet') {
            this.sheet = null; this.renderSheet(); return;
          }
          if (act === 'tab') {
            this.tab = btn.dataset.tab;
            this.renderHeader(); this.renderMain(); this.renderNav();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          if (act === 'toggle-user') {
            this.user = this.user === 'ronen' ? 'adi' : 'ronen';
            localStorage.setItem(KEYS.USER, this.user);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            this.toast(`משתמש פעיל: ${USERS[this.user].avatar} ${USERS[this.user].name}`);
            this.renderHeader();
            return;
          }
          if (act === 'toggle-sound') {
            this.settings.soundEnabled = !this.settings.soundEnabled;
            this.saveLocal();
            this.renderHeader();
            return;
          }
          if (act === 'toggle-theme') {
            this.darkMode = !this.darkMode;
            localStorage.setItem(KEYS.THEME, this.darkMode ? 'dark' : 'light');
            this.applyTheme();
            this.renderHeader();
            return;
          }
          if (act === 'open-quick') {
            this.openQuickSheet(btn.dataset.mode || 'task');
            return;
          }
          if (act === 'open-sheet') {
            this.sheet = btn.dataset.sheet;
            this.renderSheet();
            return;
          }
          if (act === 'quick-mode') {
            this.quickMode = btn.dataset.mode;
            this.renderSheet();
            return;
          }
          if (act === 'toggle-radar-filter') {
            this.taskFilters.radarOnly = !this.taskFilters.radarOnly;
            this.renderMain();
            return;
          }
          if (act === 'filter-who') {
            this.taskFilters.who = btn.dataset.val;
            this.renderMain();
            return;
          }
          if (act === 'filter-cat') {
            this.taskFilters.category = btn.dataset.val;
            this.renderMain();
            return;
          }
          if (act === 'toggle-done-section') {
            this.showDoneSection = !this.showDoneSection;
            this.renderMain();
            return;
          }
          if (act === 'expand-task') {
            this.expandedTaskId = this.expandedTaskId === btn.dataset.id ? null : btn.dataset.id;
            this.renderMain();
            return;
          }
          if (act === 'toggle-task') {
            this.toggleTaskDone(btn.dataset.id);
            return;
          }
          if (act === 'snooze-task') {
            this.snoozeTaskToTomorrow(btn.dataset.id);
            return;
          }
          if (act === 'pin-task') {
            const t = this.tasksMap[btn.dataset.id];
            if (t) this.saveTask({ ...t, pinned: !t.pinned }, t.pinned ? 'שחרר/ה נעיצה' : 'נעץ/ה משימה');
            return;
          }
          if (act === 'react-task') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            const cycle = ['', '❤️', '🔥', '👏', '🎉'];
            const next = cycle[(cycle.indexOf(t.reaction || '') + 1) % cycle.length];
            this.saveTask({ ...t, reaction: next }, next ? `פרגן/ה ${next}` : 'הסיר/ה תגובה');
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            return;
          }
          if (act === 'toggle-sub') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            const subs = (t.subtasks || []).map(s => s.id === btn.dataset.sub ? { ...s, done: !s.done } : s);
            this.saveTask({ ...t, subtasks: subs }, 'עדכן/ה שלב במשימה');
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            return;
          }
          if (act === 'del-sub') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            const subs = (t.subtasks || []).filter(s => s.id !== btn.dataset.sub);
            this.saveTask({ ...t, subtasks: subs }, 'מחק/ה שלב');
            return;
          }
          if (act === 'del-task') {
            this.deleteTask(btn.dataset.id);
            this.toast('המשימה נמחקה');
            return;
          }
          if (act === 'open-edit-task') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            this.editingTask = JSON.parse(JSON.stringify(t));
            this.sheet = 'edit-task';
            this.renderSheet();
            return;
          }
          if (act === 'task-to-expense') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            this.quickMode = 'expense';
            this.quickExpenseDraft = this.freshExpenseDraft({
              title: t.title,
              amountStr: t.estimatedBudget > 0 ? String(t.estimatedBudget) : '',
              category: t.category,
              linkedTaskId: t.id
            });
            this.sheet = 'quick-add';
            this.renderSheet();
            return;
          }
          if (act === 'ics-single') {
            const t = this.tasksMap[btn.dataset.id];
            if (t && AlertEngine.downloadICS([t], `task-${t.id}.ics`)) {
              this.toast('קובץ התראה ליומן ירד — פתח אותו כדי לקבל התראה בטוחה! 📅', 'indigo');
            }
            return;
          }
          if (act === 'ics-all') {
            if (AlertEngine.downloadICS(this.tasksList, 'ronen-adi-deadlines.ics')) {
              this.toast('כל הדדליינים הפתוחים יוצאו ליומן (.ics)! 📅', 'emerald');
            } else {
              this.toast('אין משימות פתוחות עם תאריך יעד', 'amber');
            }
            return;
          }
          if (act === 'wa-single') {
            const t = this.tasksMap[btn.dataset.id];
            if (!t) return;
            const subs = (t.subtasks || []).map(s => `${s.done ? '✅' : '▫️'} ${s.title}`).join('\n');
            const msg = `⚡ *${t.title}*\nאחראי: ${USERS[t.assignee].name}${t.dueDate ? '\n📅 דדליין: ' + formatShortHebDate(t.dueDate) : ''}${t.notes ? '\n📝 ' + t.notes : ''}${subs ? '\n\n*שלבים:*\n' + subs : ''}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            return;
          }

          // כפתורי Quick Add Sheet
          if (act === 'qa-date-chip') {
            const target = todayISO(Number(btn.dataset.days));
            this.quickTaskDraft.dueDate = this.quickTaskDraft.dueDate === target ? '' : target;
            this.renderSheet();
            return;
          }
          if (act === 'qa-assignee') {
            this.quickTaskDraft.assignee = btn.dataset.val;
            this.renderSheet();
            return;
          }
          if (act === 'qa-priority') {
            this.quickTaskDraft.priority = btn.dataset.val;
            this.renderSheet();
            return;
          }
          if (act === 'qa-cat') {
            this.quickTaskDraft.category = btn.dataset.val;
            this.renderSheet();
            return;
          }
          if (act === 'qa-attach-parent') {
            const pid = btn.dataset.parentId;
            const raw = document.getElementById('qa-task-input')?.value.trim();
            if (!pid || !raw || !this.tasksMap[pid]) return;
            const clean = raw.replace(/^(>|תת:|\+)\s*/, '').trim();
            const parent = this.tasksMap[pid];
            this.saveTask({ ...parent, subtasks: [...(parent.subtasks || []), { id: uid('s'), title: clean, done: false }] }, `הוסיף/ה שלב תחת "${parent.title}"`);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            this.sheet = null;
            this.renderSheet();
            this.toast(`שויך כשלב תחת "${parent.title}" 🧠`, 'indigo');
            return;
          }
          if (act === 'voice-input') {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            const rec = new SR();
            rec.lang = 'he-IL';
            rec.interimResults = false;
            this.toast('מקשיב בעברית... 🎤', 'indigo');
            rec.onresult = ev => {
              const spoken = ev.results?.[0]?.[0]?.transcript || '';
              const inp = document.getElementById('qa-task-input');
              if (inp && spoken) {
                inp.value = spoken;
                this.updateQuickTaskNLPPreview(spoken);
              }
            };
            rec.onerror = () => this.toast('לא זוהתה הקלטה', 'amber');
            rec.start();
            return;
          }
          if (act === 'qa-exp-curr') {
            const order = ['ILS', 'EUR', 'USD'];
            this.quickExpenseDraft.currency = order[(order.indexOf(this.quickExpenseDraft.currency) + 1) % order.length];
            this.renderSheet();
            return;
          }
          if (act === 'qa-exp-pay') {
            this.quickExpenseDraft.paymentMethod = btn.dataset.method;
            this.quickExpenseDraft.paidBy = btn.dataset.payer;
            this.renderSheet();
            return;
          }
          if (act === 'qa-exp-split') {
            this.quickExpenseDraft.splitType = btn.dataset.val;
            this.renderSheet();
            return;
          }
          if (act === 'qa-exp-cat') {
            this.quickExpenseDraft.category = btn.dataset.val;
            this.renderSheet();
            return;
          }

          // פעולות ארנק
          if (act === 'wallet-method') {
            this.walletFilter.method = btn.dataset.val;
            this.renderMain();
            return;
          }
          if (act === 'wallet-period') {
            this.walletFilter.period = btn.dataset.val;
            this.renderMain();
            return;
          }
          if (act === 'open-edit-expense') {
            const ex = this.expensesMap[btn.dataset.id];
            if (!ex) return;
            this.editingExpense = JSON.parse(JSON.stringify(ex));
            this.sheet = 'edit-expense';
            this.renderSheet();
            return;
          }
          if (act === 'del-expense') {
            this.deleteExpense(btn.dataset.id);
            this.toast('ההוצאה נמחקה והמאזן חושב מחדש');
            return;
          }
          if (act === 'wa-send-balance') {
            this.waShareMode = 'balance';
            this.sheet = 'wa-share';
            this.renderSheet();
            return;
          }

          // פעולות Hub ומודאלים
          if (act === 'req-notif-perm') {
            if (!('Notification' in window)) {
              this.toast('הדפדפן לא תומך בהתראות — השתמש בכפתור היומן (.ics) או ב-ntfy', 'amber');
              return;
            }
            Notification.requestPermission().then(p => {
              this.renderMain();
              if (p === 'granted') {
                new Notification('⚡ Pulse Duo מוכן!', { body: 'תקבל התראות כשדדליינים מתקרבים.' });
                this.toast('התראות הדפדפן הופעלו בהצלחה! 🔔', 'emerald');
              } else {
                this.toast('התראות נחסמו — אפשר להשתמש ב-.ics או ב-ntfy', 'amber');
              }
            });
            return;
          }
          if (act === 'save-ntfy') {
            this.settings.ntfyTopic = document.getElementById('hub-ntfy-topic')?.value.trim() || '';
            this.saveLocal();
            this.toast(this.settings.ntfyTopic ? 'ערוץ ntfy נשמר! 📱' : 'ערוץ ntfy נוקה', 'emerald');
            return;
          }
          if (act === 'test-ntfy') {
            const topic = document.getElementById('hub-ntfy-topic')?.value.trim() || this.settings.ntfyTopic;
            if (!topic) { this.toast('הזן קודם שם ערוץ סודי', 'amber'); return; }
            AlertEngine.sendNtfyPush(topic, '⚡ בדיקת Push מ-Pulse Duo (רונן & עדי) — עובד מעולה!').then(ok => {
              this.toast(ok ? 'הודעת בדיקה נשלחה לערוץ! 📱' : 'שגיאה בשליחה ל-ntfy', ok ? 'emerald' : 'rose');
            });
            return;
          }
          if (act === 'save-rates') {
            const eur = parseFloat(document.getElementById('rate-eur')?.value);
            const usd = parseFloat(document.getElementById('rate-usd')?.value);
            if (eur > 0) this.settings.rates.EUR = eur;
            if (usd > 0) this.settings.rates.USD = usd;
            this.saveLocal();
            this.toast('שערי המטבע עודכנו! 💱', 'emerald');
            return;
          }
          if (act === 'export-json') {
            const payload = { version: '4.0', exportedAt: new Date().toISOString(), tasks: this.tasksList, expenses: this.expensesList };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `pulse-duo-backup-${todayISO(0)}.json`;
            a.click();
            this.toast('קובץ גיבוי ירד למכשיר 💾', 'emerald');
            return;
          }
          if (act === 'analyze-wa') {
            this.waRawInput = document.getElementById('wa-import-box')?.value || '';
            this.waDrafts = NLPEngine.parseWhatsApp(this.waRawInput, this.tasksList);
            if (!this.waDrafts.length) this.toast('לא זוהו שורות טקסט תקינות', 'amber');
            this.renderSheet();
            return;
          }
          if (act === 'commit-wa') {
            let tCount = 0, sCount = 0, eCount = 0;
            for (const d of this.waDrafts) {
              if (!d.title.trim()) continue;
              if (d.targetType === 'expense') {
                this.saveExpense(normExpense({ title: d.title, amountAgorot: Math.round((d.amount || 0) * 100), paidBy: d.paidBy, category: d.category, createdBy: this.user }), 'ייבא/ה הוצאה מוואטסאפ');
                eCount++;
              } else if (d.targetType === 'subtask' && d.parentTaskId && this.tasksMap[d.parentTaskId]) {
                const p = this.tasksMap[d.parentTaskId];
                this.saveTask({ ...p, subtasks: [...(p.subtasks || []), { id: uid('s'), title: d.title.trim(), done: false }] }, 'ייבא/ה שלב מוואטסאפ');
                sCount++;
              } else {
                this.saveTask(normTask({ title: d.title, assignee: d.assignee, category: d.category, priority: d.priority, dueDate: d.dueDate, dueTime: d.dueTime, estimatedBudget: d.amount }, this.user), 'ייבא/ה משימה מוואטסאפ');
                tCount++;
              }
            }
            this.waDrafts = []; this.waRawInput = ''; this.sheet = null;
            this.renderSheet();
            this.toast(`יובאו: ${tCount} משימות, ${sCount} שלבים, ${eCount} הוצאות 📥`, 'emerald');
            return;
          }
          if (act === 'wa-share-mode') {
            this.waShareMode = btn.dataset.mode;
            this.renderSheet();
            return;
          }
          if (act === 'copy-wa-share') {
            this.copyText(document.getElementById('wa-share-box')?.value || '');
            return;
          }
          if (act === 'send-wa-share') {
            const txt = document.getElementById('wa-share-box')?.value || '';
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
            return;
          }
          if (act === 'copy-gemini') {
            this.copyText(document.getElementById('gemini-json-box')?.value || '');
            return;
          }
          if (act === 'merge-gemini') {
            this.mergeExternalJSON(document.getElementById('gemini-json-box')?.value || '');
            return;
          }
          if (act === 'save-cloud-url') {
            const val = document.getElementById('cloud-url-in')?.value.trim().replace(/\/$/, '') || '';
            this.cloudUrl = val;
            localStorage.setItem(KEYS.CLOUD, val);
            this.sheet = null;
            this.renderSheet();
            if (val) {
              this.cloud.connect();
              this.toast('מתחבר לענן בזמן אמת... ☁️', 'emerald');
            } else {
              this.cloud.disconnect();
              this.setCloudStatus('offline');
            }
            return;
          }
          if (act === 'force-sync') {
            if (!this.cloudUrl) { this.toast('לא הוגדרה כתובת ענן', 'amber'); return; }
            this.cloud.connect();
            this.toast('מסנכרן מול הענן... 🔄', 'indigo');
          }
        });
      }

      openQuickSheet(mode = 'task') {
        this.quickMode = mode;
        this.quickTaskDraft = this.freshTaskDraft();
        this.quickExpenseDraft = this.freshExpenseDraft();
        this.sheet = 'quick-add';
        this.renderSheet();
      }

      toggleTaskDone(id) {
        const t = this.tasksMap[id];
        if (!t) return;
        const nextDone = !t.done;
        this.saveTask({
          ...t,
          done: nextDone,
          completedBy: nextDone ? this.user : null,
          completedAt: nextDone ? new Date().toISOString() : null
        }, nextDone ? 'סימן/ה כבוצע ✅' : 'פתח/ה מחדש משימה');

        if (nextDone) {
          FeedbackEngine.play('complete', this.settings.soundEnabled);
          if (t.priority === 'urgent' || t.priority === 'high') FeedbackEngine.confetti();

          // גשר חכם: אם יש תקציב או שמדובר בקניות/חתונה/טיול — מציע לרשום הוצאה בנגיעה
          if (t.estimatedBudget > 0 || ['shopping', 'wedding', 'trip', 'bills'].includes(t.category)) {
            this.toast(`כל הכבוד! "${t.title}" בוצע ✅`, 'emerald', {
              label: '💸 רשום הוצאה?',
              onClick: () => {
                this.quickMode = 'expense';
                this.quickExpenseDraft = this.freshExpenseDraft({
                  title: t.title,
                  amountStr: t.estimatedBudget > 0 ? String(t.estimatedBudget) : '',
                  category: t.category,
                  linkedTaskId: t.id
                });
                this.sheet = 'quick-add';
                this.renderSheet();
              }
            });
          }
        } else {
          FeedbackEngine.play('pop', this.settings.soundEnabled);
        }
      }

      snoozeTaskToTomorrow(id) {
        const t = this.tasksMap[id];
        if (!t || t.done) return;
        const tomorrow = todayISO(1);
        this.saveTask({ ...t, dueDate: tomorrow }, 'דחה/תה למחר');
        FeedbackEngine.play('pop', this.settings.soundEnabled);
        this.toast(`"${t.title}" נדחה למחר ⏰`, 'amber');
      }

      mergeExternalJSON(rawStr) {
        try {
          const match = String(rawStr || '').match(/```(?:json)?\s*([\s\S]*?)```/i);
          const parsed = JSON.parse(match ? match[1] : rawStr);
          const incomingTasks = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.tasks) ? parsed.tasks : []);
          const incomingExpenses = Array.isArray(parsed.expenses) ? parsed.expenses : [];

          let tMerged = 0, eMerged = 0;
          for (const rawT of incomingTasks) {
            const nt = normTask(rawT, this.user);
            this.tasksMap[nt.id] = nt;
            this.cloud.atomicWrite('tasks', nt.id, nt);
            tMerged++;
          }
          for (const rawE of incomingExpenses) {
            const ne = normExpense(rawE);
            this.expensesMap[ne.id] = ne;
            this.cloud.atomicWrite('expenses', ne.id, ne);
            eMerged++;
          }
          this.logAudit('מיזג/ה JSON', `${tMerged} משימות, ${eMerged} הוצאות`);
          this.saveLocal();
          this.sheet = null;
          this.renderAll();
          this.toast(`מוזגו בהצלחה: ${tMerged} משימות ו-${eMerged} הוצאות! 🔀`, 'emerald');
        } catch {
          this.toast('שגיאה בפענוח ה-JSON — בדוק את המבנה', 'rose');
        }
      }

      copyText(text) {
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => this.toast('הועתק ללוח! 📋', 'emerald'));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          this.toast('הועתק ללוח! 📋', 'emerald');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.__pulseDuo = new PulseDuoApp();
    });
  </script>
</body>
