<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f5fa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="רונן & עדי" />
  <title>Pulse Duo ⚡ רונן ועדי v5.0</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-app: #f3f5fa;
      --bg-card: #ffffff;
      --bg-elev: #eef2f7;
      --bg-input: #f8fafc;
      --bg-bar: #ffffff;
      --text-1: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --border-2: #cbd5e1;
      --indigo: #4f46e5;
      --indigo-soft: rgba(79, 70, 229, 0.11);
      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.11);
      --rose: #e11d48;
      --rose-soft: rgba(225, 29, 72, 0.11);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.13);
      --blue: #2563eb;
      --blue-soft: rgba(37, 99, 235, 0.11);
      --pink: #db2777;
      --pink-soft: rgba(219, 39, 119, 0.11);
      --teal: #0d9488;
      --shadow-sm: 0 1px 4px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.13);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    html.dark {
      --bg-app: #0b1120;
      --bg-card: #131c31;
      --bg-elev: #1c2842;
      --bg-input: #0e1628;
      --bg-bar: #111a2e;
      --text-1: #f8fafc;
      --text-2: #cbd5e1;
      --text-3: #64748b;
      --border: #1e2d4a;
      --border-2: #334569;
      --indigo: #6366f1;
      --indigo-soft: rgba(99, 102, 241, 0.22);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.20);
      --rose: #fb7185;
      --rose-soft: rgba(244, 63, 94, 0.20);
      --amber: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.20);
      --blue: #60a5fa;
      --blue-soft: rgba(59, 130, 246, 0.22);
      --pink: #f472b6;
      --pink-soft: rgba(236, 72, 153, 0.22);
      --teal: #14b8a6;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-app);
      color: var(--text-1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    button, input, select, textarea, a, label {
      font-family: inherit;
      touch-action: manipulation;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    button:active { opacity: 0.8; }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    .hidden { display: none !important; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { scrollbar-width: none; -ms-overflow-style: none; }

    /* Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 14px;
    }

    .header-inner {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cloud-dot-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-online { background: #10b981; }
    .dot-connecting { background: #f59e0b; }
    .dot-error { background: #f43f5e; }
    .dot-offline { background: #94a3b8; }

    .desk-tabs {
      display: none;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
    }
    .desk-tabs button {
      padding: 6px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text-2);
    }
    .desk-tabs button.active {
      background: var(--indigo);
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
    }
    .user-ronen { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(37, 99, 235, 0.24); }
    .user-adi { background: var(--pink-soft); color: var(--pink); border: 1px solid rgba(219, 39, 119, 0.24); }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .desk-new-btn {
      display: none;
      padding: 7px 14px;
      border-radius: 11px;
      background: var(--indigo);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    main.container {
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* Core Cards & Buttons */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bento-card {
      padding: 13px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .bento-card.radar-overdue { background: var(--rose-soft); border-color: rgba(225, 29, 72, 0.35); }
    .bento-card.radar-soon { background: var(--amber-soft); border-color: rgba(217, 119, 6, 0.35); }
    .bento-card.radar-calm { background: var(--emerald-soft); border-color: rgba(5, 150, 105, 0.28); }
    .bento-card.ring-active { outline: 2px solid var(--indigo); outline-offset: -1px; }

    .bento-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }
    .bento-val { font-size: 15px; font-weight: 900; color: var(--text-1); }
    .bento-sub { font-size: 11px; color: var(--text-2); }

    .launch-row { display: flex; gap: 8px; }
    .launch-main {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: right;
      font-size: 13px;
      color: var(--text-2);
    }
    .launch-exp {
      padding: 10px 13px;
      font-size: 12px;
      font-weight: 900;
      color: var(--emerald);
      flex-shrink: 0;
    }

    .pill-mini {
      padding: 5px 10px;
      border-radius: 10px;
      background: var(--indigo);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .btn-primary, .btn-emerald, .btn-teal, .btn-dark, .btn-soft {
      font-weight: 800;
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-emerald { background: var(--emerald); color: #fff; }
    .btn-teal { background: var(--teal); color: #fff; }
    .btn-dark { background: var(--text-1); color: var(--bg-card); }
    .btn-soft { background: var(--bg-elev); color: var(--text-1); border: 1px solid var(--border); font-weight: 700; font-size: 12px; padding: 9px 12px; }

    /* Compact Filter Bar */
    .compact-filter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .seg-bar {
      display: inline-flex;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 12px;
      gap: 2px;
    }
    .seg-bar button {
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-2);
      white-space: nowrap;
    }
    .seg-bar button.active {
      background: var(--bg-card);
      color: var(--text-1);
      box-shadow: var(--shadow-sm);
    }
    .seg-bar button.active-indigo {
      background: var(--indigo);
      color: #fff;
    }

    .cat-select {
      background: var(--bg-card);
      color: var(--text-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      max-width: 130px;
    }

    /* Chips & Inputs */
    .chip-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .chip {
      padding: 6px 11px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .chip.active { background: var(--text-1); color: var(--bg-card); border-color: var(--text-1); }
    .chip.active-indigo { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .chip.active-emerald { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .chip.active-rose { background: var(--rose); color: #fff; border-color: var(--rose); }
    .chip.active-blue { background: var(--blue); color: #fff; border-color: var(--blue); }
    .chip.active-pink { background: var(--pink); color: #fff; border-color: var(--pink); }

    .field {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-1);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }
    .field:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px var(--indigo-soft);
    }
    .field-sm { padding: 7px 10px; font-size: 13px; border-radius: 10px; }

    /* Tasks */
    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 6px;
      font-size: 12px;
      font-weight: 900;
    }

    .stack-sm { display: flex; flex-direction: column; gap: 8px; }
    .stack-md { display: flex; flex-direction: column; gap: 12px; }

    .task-card { overflow: hidden; touch-action: pan-y; }
    .task-card.is-done { opacity: 0.65; }
    .task-card.is-pinned { border-color: var(--indigo); }

    .task-main {
      padding: 12px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .check-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 900;
      color: transparent;
    }
    .check-circle.urgent { border-color: var(--rose); }
    .check-circle.checked { background: var(--emerald); border-color: var(--emerald); color: #fff; }

    .task-body { flex: 1; min-width: 0; cursor: pointer; }
    .task-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-1);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .task-title.done-text { text-decoration: line-through; color: var(--text-3); }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      font-size: 11px;
      color: var(--text-2);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-elev);
      color: var(--text-2);
    }
    .badge-overdue { background: var(--rose-soft); color: var(--rose); font-weight: 800; }
    .badge-today { background: var(--amber-soft); color: var(--amber); font-weight: 800; }
    .badge-indigo { background: var(--indigo-soft); color: var(--indigo); font-weight: 800; }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald); font-weight: 800; }
    .badge-pink { background: var(--pink-soft); color: var(--pink); font-weight: 800; }

    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--bg-elev);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .task-drawer {
      padding: 10px 13px 13px;
      border-top: 1px solid var(--border);
      background: var(--bg-input);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sub-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 12px;
    }
    .sub-row label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
    .sub-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--indigo); }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .mini-act {
      padding: 5px 9px;
      border-radius: 9px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-act.indigo { color: var(--indigo); background: var(--indigo-soft); border-color: transparent; }
    .mini-act.emerald { color: var(--emerald); }
    .mini-act.rose { color: var(--rose); }

    /* Wallet Hero & Friendly Split Cards */
    .hero-wallet {
      border-radius: 22px;
      padding: 18px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow-md);
    }
    .hero-balanced { background: linear-gradient(135deg, #059669, #0f766e); }
    .hero-ronen-owed { background: linear-gradient(135deg, #4f46e5, #6d28d9); }
    .hero-adi-owed { background: linear-gradient(135deg, #db2777, #4f46e5); }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
    }
    .hero-stat-box {
      background: rgba(255, 255, 255, 0.13);
      border-radius: 12px;
      padding: 8px;
      font-size: 11px;
    }
    .hero-stat-box strong { display: block; font-size: 13px; margin-top: 2px; }

    .split-card {
      padding: 10px 8px;
      border-radius: 13px;
      background: var(--bg-elev);
      border: 1.5px solid var(--border);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .split-card.active {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--text-1);
    }
    .split-card .sc-title { font-size: 12px; font-weight: 900; }
    .split-card .sc-sub { font-size: 11px; font-weight: 700; color: var(--emerald); }
    .split-card:not(.active) .sc-sub { color: var(--text-2); }

    .payer-card {
      padding: 10px 6px;
      border-radius: 13px;
      background: var(--bg-elev);
      border: 1.5px solid var(--border);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-2);
    }
    .payer-card.active-ronen { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
    .payer-card.active-adi { background: var(--pink-soft); border-color: var(--pink); color: var(--pink); }
    .payer-card.active-joint { background: var(--text-1); border-color: var(--text-1); color: var(--bg-card); }

    .cat-bar {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--bg-elev);
    }

    .exp-row {
      padding: 12px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .exp-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-elev);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    /* Ultra-clean 3-item Mobile Bottom Dock */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg-bar);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav-inner {
      max-width: 440px;
      margin: 0 auto;
      height: 62px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--text-3);
      font-size: 12px;
      font-weight: 700;
      height: 100%;
    }
    .nav-btn.active { color: var(--indigo); font-weight: 900; }
    .nav-btn .ico { font-size: 20px; line-height: 1; }

    .fab-btn {
      width: 54px;
      height: 54px;
      margin-top: -22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 28px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 22px rgba(79, 70, 229, 0.38);
    }

    /* Sheets & Modals */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(10, 15, 30, 0.58);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 540px;
      border-radius: 24px 24px 0 0;
      max-height: 92vh;
      overflow-y: auto;
      padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px));
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.15s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-elev);
      color: var(--text-2);
      font-size: 15px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .lbl { display: block; font-size: 11px; font-weight: 800; color: var(--text-2); margin-bottom: 4px; }

    .impact-box {
      padding: 11px 12px;
      border-radius: 13px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-1);
    }

    .amount-input {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      padding: 10px 14px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tool-tile {
      padding: 12px;
      border-radius: 14px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* Toasts */
    #toast-root {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      width: 92%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      padding: 10px 14px;
      border-radius: 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow-md);
      animation: slideUp 0.14s ease-out;
    }
    .toast-dark { background: #0f172a; }
    .toast-emerald { background: #059669; }
    .toast-indigo { background: #4f46e5; }
    .toast-amber { background: #d97706; }
    .toast-rose { background: #e11d48; }
    .toast-action {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .empty-box {
      padding: 32px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    @media (min-width: 768px) {
      body { padding-bottom: 36px; }
      .desk-tabs { display: flex; }
      .desk-new-btn { display: inline-flex; }
      .bottom-nav { display: none; }
      .sheet-backdrop { align-items: center; padding: 16px; }
      .sheet-panel { border-radius: 22px; padding: 20px; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:90;"></canvas>
  <div id="toast-root"></div>
  <div id="header-root"></div>
  <main id="main-root" class="container"></main>
  <div id="nav-root"></div>
  <div id="sheet-root"></div>

  <script type="module">
    // =========================================================================
    // 1. קבועים, מודל נתונים ותאימות מלאה לגרסאות קודמות (v3.0 / v4.x)
    // =========================================================================
    const KEYS = {
      USER: 'ra_user_v2',
      CLOUD: 'ra_cloud_url_v2',
      THEME: 'ra_theme_v2',
      LEGACY_TASKS: 'ra_tasks_v2',
      TASKS: 'ra_v4_tasks',
      EXPENSES: 'ra_v4_expenses',
      AUDIT: 'ra_v4_audit',
      QUEUE: 'ra_v4_offline_queue',
      SETTINGS: 'ra_v4_settings',
      NOTIFIED: 'ra_v4_notified_map',
      MIGRATED_LOCAL: 'ra_v4_migrated_local'
    };

    const USERS = {
      ronen: { id: 'ronen', name: 'רונן', avatar: '👨🏻‍💻' },
      adi:   { id: 'adi',   name: 'עדי',  avatar: '👩🏻' },
      both:  { id: 'both',  name: 'משותף', avatar: '💑' }
    };

    const CATEGORIES = {
      home:     { id: 'home',     label: 'בית',    icon: '🏠', color: '#3b82f6' },
      shopping: { id: 'shopping', label: 'קניות',  icon: '🛒', color: '#f59e0b' },
      wedding:  { id: 'wedding',  label: 'חתונה',  icon: '💍', color: '#ec4899' },
      trip:     { id: 'trip',     label: 'טיול',   icon: '✈️', color: '#10b981' },
      bills:    { id: 'bills',    label: 'חשבונות', icon: '🧾', color: '#8b5cf6' },
      other:    { id: 'other',    label: 'כללי',   icon: '✨', color: '#64748b' }
    };

    const EXPENSE_PRESETS = [
      { label: '🛒 סופר', title: 'קניות בסופר', category: 'shopping' },
      { label: '🥩 קצביה', title: 'בשר מהקצביה', category: 'shopping' },
      { label: '🍽️ מסעדה', title: 'מסעדה / אוכל בחוץ', category: 'other' },
      { label: '⛽ דלק', title: 'דלק', category: 'bills' },
      { label: '🏠 בית', title: 'קנייה לבית', category: 'home' },
      { label: '💍 חתונה', title: 'תשלום לחתונה', category: 'wedding' }
    ];

    const PRIORITIES = {
      urgent: { id: 'urgent', label: 'דחוף',  icon: '🔥', weight: 4 },
      high:   { id: 'high',   label: 'גבוהה', icon: '⚡', weight: 3 },
      medium: { id: 'medium', label: 'רגילה', icon: '📌', weight: 2 },
      low:    { id: 'low',    label: 'נמוכה', icon: '🌱', weight: 1 }
    };

    const DEFAULT_SETTINGS = {
      soundEnabled: true,
      ntfyTopic: '',
      ntfyOnAssign: true,
      ntfyOnExpense: true,
      alertLeadDays: 1,
      rates: { ILS: 1, EUR: 4.0, USD: 3.7 }
    };

    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    const esc = (s = '') => String(s ?? '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
    const safeUrl = (u = '') => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseLocalDate(isoStr, timeStr = '') {
      if (!isoStr || !/^\d{4}-\d{2}-\d{2}$/.test(isoStr)) return null;
      const [y, m, d] = isoStr.split('-').map(Number);
      if (timeStr && /^\d{2}:\d{2}$/.test(timeStr)) {
        const [hh, mm] = timeStr.split(':').map(Number);
        return new Date(y, m - 1, d, hh, mm, 0, 0);
      }
      return new Date(y, m - 1, d, 23, 59, 0, 0);
    }

    function formatShortHebDate(isoStr) {
      if (!isoStr) return '';
      const d = parseLocalDate(isoStr);
      if (!d) return isoStr;
      const t0 = parseLocalDate(todayISO(0));
      const diff = Math.round((d - t0) / 86400000);
      if (diff === 0) return 'היום';
      if (diff === 1) return 'מחר';
      if (diff === -1) return 'אתמול';
      if (diff < -1) return `באיחור ${Math.abs(diff)} ימים`;
      if (diff <= 6) return `יום ${['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'][d.getDay()]}`;
      return `${d.getDate()}/${d.getMonth() + 1}`;
    }

    function formatILS(agorot, showSign = false) {
      const abs = Math.abs(Math.round(agorot || 0));
      const val = (abs / 100).toLocaleString('he-IL', {
        minimumFractionDigits: abs % 100 ? 2 : 0,
        maximumFractionDigits: 2
      });
      const sign = showSign ? (agorot > 0 ? '+' : agorot < 0 ? '-' : '') : (agorot < 0 ? '-' : '');
      return `${sign}₪${val}`;
    }

    function normTask(raw = {}, actor = 'ronen') {
      const done = Boolean(raw.done || raw.status === 'done');
      return {
        id: raw.id || uid('t'),
        title: String(raw.title || 'משימה חדשה').trim(),
        category: CATEGORIES[raw.category] ? raw.category : 'other',
        assignee: USERS[raw.assignee] ? raw.assignee : 'both',
        priority: PRIORITIES[raw.priority] ? raw.priority : 'medium',
        done,
        pinned: Boolean(raw.pinned),
        dueDate: raw.dueDate || '',
        dueTime: raw.dueTime || '',
        remindLead: raw.remindLead !== undefined ? Number(raw.remindLead) : 1,
        estimatedBudget: Number(raw.estimatedBudget) || 0,
        notes: String(raw.notes || '').trim(),
        link: String(raw.link || '').trim(),
        reaction: raw.reaction || '',
        subtasks: Array.isArray(raw.subtasks)
          ? raw.subtasks.map(s => ({ id: s.id || uid('s'), title: String(s.title || '').trim(), done: Boolean(s.done) })).filter(s => s.title)
          : [],
        createdAt: raw.createdAt || new Date().toISOString(),
        updatedAt: raw.updatedAt || new Date().toISOString(),
        completedAt: done ? (raw.completedAt || raw.updatedAt || new Date().toISOString()) : null,
        completedBy: done ? (raw.completedBy || actor) : null
      };
    }

    function normExpense(raw = {}) {
      const amountAgorot = Math.max(0, Math.round(Number(raw.amountAgorot ?? (Number(raw.amount || 0) * 100)) || 0));
      const paymentMethod = raw.paymentMethod === 'joint_card' ? 'joint_card' : 'personal';
      const paidBy = raw.paidBy === 'adi' ? 'adi' : 'ronen';
      const splitType = ['equal', 'for_other', 'custom', 'settlement'].includes(raw.splitType) ? raw.splitType : 'equal';

      let ronenShareAgorot = 0;
      let adiShareAgorot = 0;

      if (splitType === 'equal') {
        adiShareAgorot = Math.floor(amountAgorot / 2);
        ronenShareAgorot = amountAgorot - adiShareAgorot;
      } else if (splitType === 'for_other') {
        if (paidBy === 'ronen') adiShareAgorot = amountAgorot;
        else ronenShareAgorot = amountAgorot;
      } else if (splitType === 'custom') {
        ronenShareAgorot = Math.min(amountAgorot, Math.max(0, Math.round(Number(raw.ronenShareAgorot) || 0)));
        adiShareAgorot = amountAgorot - ronenShareAgorot;
      }

      return {
        id: raw.id || uid('exp'),
        title: String(raw.title || 'הוצאה').trim(),
        amountAgorot,
        originalAmount: Number(raw.originalAmount) || (amountAgorot / 100),
        currency: ['ILS', 'EUR', 'USD'].includes(raw.currency) ? raw.currency : 'ILS',
        rateUsed: Number(raw.rateUsed) || 1,
        paymentMethod,
        paidBy,
        splitType,
        ronenShareAgorot,
        adiShareAgorot,
        category: CATEGORIES[raw.category] ? raw.category : 'other',
        date: raw.date || todayISO(0),
        linkedTaskId: raw.linkedTaskId || '',
        notes: String(raw.notes || '').trim(),
        createdBy: raw.createdBy === 'adi' ? 'adi' : 'ronen',
        updatedAt: raw.updatedAt || new Date().toISOString()
      };
    }

    // PWA Manifest
    try {
      const m = { name: 'Pulse Duo — רונן ועדי', short_name: 'רונן & עדי', start_url: '.', display: 'standalone', background_color: '#0b1120', theme_color: '#4f46e5', dir: 'rtl', lang: 'he' };
      const l = document.createElement('link');
      l.rel = 'manifest';
      l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/json' }));
      document.head.appendChild(l);
    } catch {}

    // =========================================================================
    // 2. משוב טקטילי, צליל עדין וקונפטי (א-סינכרוני)
    // =========================================================================
    class FeedbackEngine {
      static ctx = null;
      static play(type = 'pop', enabled = true) {
        if (navigator.vibrate) try { navigator.vibrate(type === 'complete' ? [10, 22, 14] : 7); } catch {}
        if (!enabled) return;
        setTimeout(() => {
          try {
            if (!this.ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              this.ctx = new AC();
            }
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain); gain.connect(this.ctx.destination);
            if (type === 'complete') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(523.25, now);
              osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.1);
              gain.gain.setValueAtTime(0.08, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
              osc.start(now); osc.stop(now + 0.21);
            } else if (type === 'coin') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(880, now);
              osc.frequency.setValueAtTime(1174.66, now + 0.06);
              gain.gain.setValueAtTime(0.07, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
              osc.start(now); osc.stop(now + 0.21);
            } else {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, now);
              osc.frequency.exponentialRampToValueAtTime(580, now + 0.05);
              gain.gain.setValueAtTime(0.04, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
              osc.start(now); osc.stop(now + 0.09);
            }
          } catch {}
        }, 0);
      }

      static confetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const colors = ['#4f46e5', '#10b981', '#ec4899', '#f59e0b', '#38bdf8'];
        const pts = Array.from({ length: 42 }, () => ({
          x: canvas.width * (0.25 + Math.random() * 0.5), y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 10, vy: -(4 + Math.random() * 8),
          s: 5 + Math.random() * 4, c: colors[Math.floor(Math.random() * colors.length)],
          r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.24, life: 1
        }));
        let f = 0;
        const tick = () => {
          f++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          for (const p of pts) {
            p.x += p.vx; p.y += p.vy; p.vy += 0.36; p.r += p.vr; p.life -= 0.02;
            if (p.life > 0) {
              alive = true;
              ctx.save(); ctx.globalAlpha = p.life; ctx.translate(p.x, p.y); ctx.rotate(p.r);
              ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.65); ctx.restore();
            }
          }
          if (alive && f < 80) requestAnimationFrame(tick);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
        requestAnimationFrame(tick);
      }
    }

    // =========================================================================
    // 3. מנוע התחשבנות באגורות + הפרדה אוטומטית בין "פתוח" ל"נסגר"
    // =========================================================================
    class FinanceEngine {
      static expenseDelta(exp) {
        if (!exp) return 0;
        if (exp.paymentMethod === 'joint_card' && exp.splitType !== 'settlement') return 0;
        if (exp.splitType === 'settlement') return exp.paidBy === 'adi' ? -exp.amountAgorot : exp.amountAgorot;
        return exp.paidBy === 'ronen' ? exp.adiShareAgorot : -exp.ronenShareAgorot;
      }

      static computeSummary(expenses = []) {
        let balanceAgorot = 0, personalRonenAgorot = 0, personalAdiAgorot = 0, jointCardAgorot = 0, thisMonthTotalAgorot = 0;
        const byCategory = {};
        const monthPrefix = todayISO(0).slice(0, 7);

        // מיון כרונולוגי מהישן לחדש לאיתור נקודת האיפוס האחרונה
        const personalChrono = expenses
          .filter(e => e.paymentMethod === 'personal' || e.splitType === 'settlement')
          .sort((a, b) => (a.date + a.updatedAt).localeCompare(b.date + b.updatedAt));

        let running = 0;
        let lastZeroIdx = -1;
        personalChrono.forEach((e, idx) => {
          running += this.expenseDelta(e);
          if (running === 0) lastZeroIdx = idx;
        });

        const openPersonal = personalChrono.slice(lastZeroIdx + 1).reverse();
        const settledPersonal = personalChrono.slice(0, lastZeroIdx + 1).reverse();

        for (const e of expenses) {
          balanceAgorot += this.expenseDelta(e);
          if (e.splitType === 'settlement') continue;
          if (e.paymentMethod === 'joint_card') jointCardAgorot += e.amountAgorot;
          else if (e.paidBy === 'ronen') personalRonenAgorot += e.amountAgorot;
          else personalAdiAgorot += e.amountAgorot;
          if ((e.date || '').startsWith(monthPrefix)) thisMonthTotalAgorot += e.amountAgorot;
          byCategory[e.category] = (byCategory[e.category] || 0) + e.amountAgorot;
        }

        const direction = balanceAgorot > 0
          ? { debtor: 'adi', creditor: 'ronen', amountAgorot: balanceAgorot, shortText: `עדי ← רונן ${formatILS(balanceAgorot)}`, fullText: `עדי צריכה להחזיר לרונן ${formatILS(balanceAgorot)}`, headline: '👩🏻 עדי צריכה להחזיר לרונן 👨🏻‍💻' }
          : balanceAgorot < 0
          ? { debtor: 'ronen', creditor: 'adi', amountAgorot: Math.abs(balanceAgorot), shortText: `רונן ← עדי ${formatILS(Math.abs(balanceAgorot))}`, fullText: `רונן צריך להחזיר לעדי ${formatILS(Math.abs(balanceAgorot))}`, headline: '👨🏻‍💻 רונן צריך להחזיר לעדי 👩🏻' }
          : { debtor: null, creditor: null, amountAgorot: 0, shortText: 'מאוזנים ✨', fullText: 'החשבון ביניכם מאוזן לגמרי ✨', headline: 'החשבון מאוזן לגמרי ✨' };

        return {
          balanceAgorot, direction, personalRonenAgorot, personalAdiAgorot,
          jointCardAgorot, thisMonthTotalAgorot, byCategory,
          openPersonal, settledPersonal
        };
      }
    }

    // =========================================================================
    // 4. מנוע NLP עברי חכם (משמר שעות ומשפטים טבעיים, מסווג לפי כוונה)
    // =========================================================================
    const SEMANTIC_RULES = [
      { category: 'wedding', name: 'חתונה', keywords: ['רב', 'רבנות', 'צהר', 'חופה', 'אולם', 'דיגיי', 'צלם', 'שמלה', 'חליפה', 'הזמנות', 'מוזמנים', 'טבעות', 'חתונה', 'כתובה'] },
      { category: 'trip', name: 'טיולים', keywords: ['טיסה', 'מלון', 'צימר', 'לרנקה', 'קפריסין', 'ניו יורק', 'קרוז', 'יקב', 'טיול', 'דרכון', 'ביטוח נסיעות', 'השכרת רכב'] },
      { category: 'bills', name: 'חשבונות', keywords: ['ארנונה', 'מים', 'חשמל', 'מנוי', 'ביטול מנוי', 'לשלם', 'תשלום', 'מקדמה', 'ביט', 'פייבוקס', 'אשראי', 'בנק', 'ביטוח'] },
      { category: 'home', name: 'בית ומטבח', keywords: ['להכין', 'לבשל', 'לאפות', 'בישול', 'ארוחת', 'לנקות', 'ניקיון', 'לסדר', 'כביסה', 'כלים', 'שואב', 'mova', 'מובה', 'פילטר', 'שקיות אבק', 'תמי 4', 'תמי4', 'חשמלאי', 'לתקן', 'תיקון', 'רכב', 'קיה', 'סוזוקי', 'טסט', 'מנגל', 'על האש'] },
      { category: 'shopping', name: 'קניות', keywords: ['לקנות', 'קניות', 'סופר', 'קצביה', 'קצב', 'להזמין', 'אליאקספרס', 'אמזון', 'שופרסל', 'רמי לוי', 'ירקות', 'פירות', 'מצרכים', 'טורטיות'] }
    ];

    class NLPEngine {
      static classifyCategory(rawText = '') {
        const lower = String(rawText || '').toLowerCase();

        // 1. בדיקת כוונת פעולה מפורשת (מונע בלבול בין "להכין אוכל" ל"לקנות אוכל")
        if (/(להכין|לבשל|לאפות|לחמם|להפשיר|לתבל|לנקות|לסדר|לשטוף|לתקן|כביסה|כלים)/.test(lower)) {
          // אלא אם מדובר בהכנה לחתונה / טיול
          if (SEMANTIC_RULES[0].keywords.some(k => lower.includes(k))) return 'wedding';
          if (SEMANTIC_RULES[1].keywords.some(k => lower.includes(k))) return 'trip';
          return 'home';
        }
        if (/(לקנות|קניות|בסופר|מהסופר|מהקצב|בקצביה|להביא מהסופר)/.test(lower)) {
          return 'shopping';
        }

        // 2. סריקה לפי סדר עדיפויות מדויק
        for (const rule of SEMANTIC_RULES) {
          if (rule.keywords.some(k => lower.includes(k))) return rule.category;
        }
        return null;
      }

      static parseQuickTaskInput(rawText = '') {
        const original = String(rawText || '');
        let title = original;
        const p = { cleanTitle: '', dueDate: '', dueTime: '', assignee: null, priority: null, category: null, estimatedBudget: 0 };

        // 1. הסרת תגיות שליטה מפורשות בלבד (@עדי / @רונן / !דחוף)
        if (/@עדי(?=\s|$)/.test(title)) { p.assignee = 'adi'; title = title.replace(/@עדי(?=\s|$)/g, ''); }
        else if (/@רונן(?=\s|$)/.test(title)) { p.assignee = 'ronen'; title = title.replace(/@רונן(?=\s|$)/g, ''); }
        else if (/@משותף(?=\s|$)/.test(title)) { p.assignee = 'both'; title = title.replace(/@משותף(?=\s|$)/g, ''); }

        if (/(!דחוף|!!|דחוף!)/i.test(title)) { p.priority = 'urgent'; title = title.replace(/(!דחוף|!!|דחוף!)/gi, ''); }
        else if (/(!חשוב|!גבוה)/i.test(title)) { p.priority = 'high'; title = title.replace(/(!חשוב|!גבוה)/gi, ''); }

        // 2. חילוץ תקציב (₪150 / 150 ש"ח)
        const bm = title.match(/(?:₪\s*(\d[\d,]*))|(?:(\d[\d,]*)\s*(?:₪|ש"ח|ש״ח|שח))/);
        if (bm) {
          p.estimatedBudget = Number((bm[1] || bm[2]).replace(/,/g, '')) || 0;
          title = title.replace(bm[0], '');
        }

        // 3. חילוץ שעה (עד 19:00 / ב-19:00 / 19:00 / בשעה 19) — בלי למחוק אותה מהמשפט!
        const tm = original.match(/(?:(?:עד|ב-?|בשעה|לשעה|שעה)\s*)?(\d{1,2}):(\d{2})/);
        if (tm) {
          const h = Number(tm[1]), m = Number(tm[2]);
          if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
            p.dueTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
          }
        } else {
          const hourOnly = original.match(/(?:עד|בשעה|לשעה)\s+(\d{1,2})(?=\s|$|[,.])/);
          if (hourOnly) {
            const h = Number(hourOnly[1]);
            if (h >= 0 && h <= 23) p.dueTime = `${String(h).padStart(2, '0')}:00`;
          }
        }

        // 4. חילוץ תאריך עברי טבעי — מוחק רק מילת זמן בודדת בתחילת/סוף משפט (בלי להשאיר מילות יחס תלויות!)
        if (/(?:^|\s)מחרתיים(?=\s|$|[,.])/.test(original)) {
          p.dueDate = todayISO(2);
          title = title.replace(/^מחרתיים\s+|\s+מחרתיים$/g, '');
        } else if (/(?:^|\s)מחר(?=\s|$|[,.])/.test(original)) {
          p.dueDate = todayISO(1);
          title = title.replace(/^מחר\s+|\s+מחר$/g, '');
        } else if (/(?:^|\s)היום(?=\s|$|[,.])/.test(original)) {
          p.dueDate = todayISO(0);
          title = title.replace(/^היום\s+|\s+היום$/g, '');
        } else if (/(?:סופ"ש|סופ״ש|שישי הקרוב)/.test(original)) {
          const dFri = (5 - new Date().getDay() + 7) % 7 || 7;
          p.dueDate = todayISO(dFri);
        } else {
          const dm = original.match(/(?:ב?יום\s+)(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)/);
          if (dm) {
            const map = { 'ראשון': 0, 'שני': 1, 'שלישי': 2, 'רביעי': 3, 'חמישי': 4, 'שישי': 5, 'שבת': 6 };
            let diff = (map[dm[1]] - new Date().getDay() + 7) % 7;
            if (diff === 0) diff = 7;
            p.dueDate = todayISO(diff);
          } else {
            const em = original.match(/(?:^|\s|עד\s+|ל-?|ב-?)(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(?=\s|$|[,.])/);
            if (em) {
              const d = Number(em[1]), mo = Number(em[2]);
              const now = new Date();
              let y = em[3] ? Number(em[3]) : now.getFullYear();
              if (y < 100) y += 2000;
              if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) {
                const candidate = new Date(y, mo - 1, d);
                if (!em[3] && (now - candidate) > 30 * 86400000) y += 1;
                p.dueDate = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              }
            }
          }
        }

        // אם זוהתה שעה בלי תאריך מפורש -> ברירת מחדל להיום (או מחר אם השעה כבר חלפה)
        if (p.dueTime && !p.dueDate) {
          const now = new Date();
          const [hh, mm] = p.dueTime.split(':').map(Number);
          const todayAt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm);
          p.dueDate = todayAt > now ? todayISO(0) : todayISO(1);
        }

        // 5. סיווג קטגוריה חכם לפי כוונה
        p.category = this.classifyCategory(original);

        p.cleanTitle = title.replace(/\s{2,}/g, ' ').trim();
        return p;
      }

      static tokenize(text = '') {
        const stop = new Set(['את', 'של', 'על', 'עם', 'או', 'גם', 'כי', 'אם', 'לא', 'כן', 'זה', 'לי', 'לנו', 'צריך', 'לקנות', 'לעשות', 'לבדוק', 'להזמין', 'להכין', 'רונן', 'עדי', 'משותף', 'עד', 'מחר', 'היום']);
        return String(text || '').toLowerCase().replace(/[^\u0590-\u05FFa-z0-9\s]/g, ' ').trim().split(/\s+/).map(w => w.replace(/^[הובלמכש]/, '')).filter(w => w.length >= 2 && !stop.has(w));
      }

      static findParentMatch(inputText = '', tasks = []) {
        const raw = String(inputText || '').trim();
        if (raw.length < 3 || !tasks.length) return null;
        const open = tasks.filter(t => !t.done);
        const candidates = open.length ? open : tasks;
        const clean = raw.replace(/^(>|תת:|\+)\s*/, '').trim();
        const lower = clean.toLowerCase();
        const tokens = this.tokenize(clean);

        let best = null, bestScore = 0, reason = '';
        for (const t of candidates) {
          if (t.title.trim().toLowerCase() === lower) continue;
          let score = 0, r = '';
          const tText = `${t.title} ${t.notes || ''}`.toLowerCase();
          const tTokens = this.tokenize(tText);
          for (const tok of tokens) {
            if (tTokens.some(tt => tt === tok || (tt.length >= 3 && tok.length >= 3 && (tt.includes(tok) || tok.includes(tt))))) {
              score += 35; r = `קשר למילה "${tok}"`;
            }
          }
          for (const cl of SEMANTIC_RULES) {
            if (cl.keywords.some(k => lower.includes(k)) && cl.keywords.some(k => tText.includes(k))) {
              score += 40; r = `נושא "${cl.name}"`;
            }
          }
          if (score > bestScore) { bestScore = score; best = t; reason = r; }
        }
        return best && bestScore >= 45 ? { parentTask: best, cleanSubtaskTitle: clean, reason } : null;
      }

      static parseWhatsApp(rawText = '', tasks = []) {
        const lines = String(rawText || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const headerRe = /^(?:\[?\d{1,2}[./-]\d{1,2}[./-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*[-–]?\s*)([^:]+):\s*(.+)$/;
        const out = [];
        for (const line of lines) {
          let sender = '', content = line;
          const m = line.match(headerRe);
          if (m) { sender = m[1].trim(); content = m[2].trim(); }
          content = content.replace(/^[-*•✅⭕📌\d.)\]]+\s*/, '').trim();
          if (content.length < 2) continue;

          const p = this.parseQuickTaskInput(content);
          let assignee = p.assignee || 'both';
          if (!p.assignee) {
            if (/\b(עדי|לעדי)\b/.test(content) || sender.includes('עדי')) assignee = 'adi';
            else if (/\b(רונן|לרונן)\b/.test(content) || sender.includes('רונן')) assignee = 'ronen';
          }
          const isExp = p.estimatedBudget > 0 && /(שילמתי|עלה|שולם|העברתי|קניתי|חיוב|אשראי|להחזיר|חצי)/i.test(content);
          const pm = isExp ? null : this.findParentMatch(p.cleanTitle || content, tasks);

          out.push({
            tempId: uid('wa'),
            title: p.cleanTitle || content,
            assignee, category: p.category || 'other', priority: p.priority || 'medium',
            dueDate: p.dueDate, dueTime: p.dueTime, amount: p.estimatedBudget,
            paidBy: sender.includes('עדי') ? 'adi' : 'ronen',
            targetType: isExp ? 'expense' : (pm ? 'subtask' : 'new_task'),
            parentTaskId: pm ? pm.parentTask.id : (tasks.find(t => !t.done)?.id || ''),
            matchReason: isExp ? 'זוהה תשלום' : (pm ? pm.reason : '')
          });
        }
        return out;
      }
    }

    // =========================================================================
    // 5. מנוע התראות 4 שכבות (רדאר, דפדפן, .ics ליומן, ntfy Push)
    // =========================================================================
    class AlertEngine {
      static classifyTask(task) {
        if (task.done) return 'done';
        if (!task.dueDate) return 'later';
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        const due = parseLocalDate(task.dueDate, task.dueTime);
        if (!due) return 'later';
        const diff = Math.round((new Date(due.getFullYear(), due.getMonth(), due.getDate()) - todayStart) / 86400000);
        if (diff < 0 || (diff === 0 && task.dueTime && due < now)) return 'overdue';
        if (diff === 0) return 'today';
        if (diff <= 7) return 'week';
        return 'later';
      }

      static getUrgentDeadlineTasks(tasks = []) {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        return tasks.filter(t => {
          if (t.done || !t.dueDate) return false;
          const d = parseLocalDate(t.dueDate, t.dueTime);
          if (!d) return false;
          return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - todayStart) / 86400000) <= 3;
        }).sort((a, b) => (a.dueDate + (a.dueTime || '23:59')).localeCompare(b.dueDate + (b.dueTime || '23:59')));
      }

      static checkBrowserNotifications(tasks = [], settings = DEFAULT_SETTINGS) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        let map = {};
        try { map = JSON.parse(localStorage.getItem(KEYS.NOTIFIED) || '{}'); } catch {}
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        let changed = false;

        for (const t of tasks) {
          if (t.done || !t.dueDate) continue;
          const d = parseLocalDate(t.dueDate, t.dueTime);
          if (!d) continue;
          const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - todayStart) / 86400000);
          const lead = t.remindLead !== undefined ? Number(t.remindLead) : settings.alertLeadDays;

          let bucket = null, title = '';
          if (diff < 0) { bucket = 'overdue_' + todayISO(0); title = '🔥 משימה באיחור!'; }
          else if (diff === 0) { bucket = 'today_' + todayISO(0); title = t.dueTime ? `⏰ היום עד ${t.dueTime}` : '⏰ דדליין היום!'; }
          else if (diff <= lead) { bucket = `lead_${diff}_${todayISO(0)}`; title = diff === 1 ? '📅 מחר הדדליין' : `📅 עוד ${diff} ימים לדדליין`; }

          if (bucket) {
            const key = `${t.id}__${bucket}`;
            if (!map[key]) {
              map[key] = Date.now();
              changed = true;
              try { new Notification(title, { body: t.title, tag: key }); } catch {}
            }
          }
        }
        if (changed) localStorage.setItem(KEYS.NOTIFIED, JSON.stringify(map));
      }

      static escapeICS(s = '') {
        return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
      }

      static buildVEvent(task) {
        if (!task.dueDate) return '';
        const dc = task.dueDate.replace(/-/g, '');
        const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
        let dt = [];
        if (task.dueTime && /^\d{2}:\d{2}$/.test(task.dueTime)) {
          const [hh, mm] = task.dueTime.split(':').map(Number);
          const endH = String(Math.min(23, hh + 1)).padStart(2, '0');
          dt = [`DTSTART:${dc}T${String(hh).padStart(2, '0')}${String(mm).padStart(2, '0')}00`, `DTEND:${dc}T${endH}${String(mm).padStart(2, '0')}00`];
        } else {
          const nd = parseLocalDate(task.dueDate);
          nd.setDate(nd.getDate() + 1);
          dt = [`DTSTART;VALUE=DATE:${dc}`, `DTEND;VALUE=DATE:${nd.getFullYear()}${String(nd.getMonth() + 1).padStart(2, '0')}${String(nd.getDate()).padStart(2, '0')}`];
        }
        const leadDays = Math.max(1, Number(task.remindLead) || 1);
        const desc = [`אחראי: ${USERS[task.assignee]?.name || 'משותף'}`, task.notes ? `הערות: ${task.notes}` : ''].filter(Boolean).join('\n');
        return [
          'BEGIN:VEVENT', `UID:${task.id}@pulseduo.local`, `DTSTAMP:${stamp}`, ...dt,
          `SUMMARY:${this.escapeICS('⚡ ' + task.title)}`, `DESCRIPTION:${this.escapeICS(desc)}`,
          'BEGIN:VALARM', `TRIGGER:-P${leadDays}D`, 'ACTION:DISPLAY', `DESCRIPTION:${this.escapeICS('תזכורת דדליין: ' + task.title)}`, 'END:VALARM',
          'BEGIN:VALARM', 'TRIGGER:-PT1H', 'ACTION:DISPLAY', `DESCRIPTION:${this.escapeICS('עוד שעה דדליין: ' + task.title)}`, 'END:VALARM',
          'END:VEVENT'
        ].join('\r\n');
      }

      static downloadICS(list = [], filename = 'pulse-duo-deadlines.ics') {
        const events = list.filter(t => !t.done && t.dueDate).map(t => this.buildVEvent(t)).filter(Boolean);
        if (!events.length) return false;
        const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PulseDuo//RonenAdi//HE', 'CALSCALE:GREGORIAN', ...events, 'END:VCALENDAR'].join('\r\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
        a.download = filename;
        a.click();
        return true;
      }

      static async sendNtfyPush(topic, text) {
        const clean = String(topic || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!clean) return false;
        try {
          const res = await fetch(`https://ntfy.sh/${encodeURIComponent(clean)}`, { method: 'POST', body: text });
          return res.ok;
        } catch { return false; }
      }
    }

    // =========================================================================
    // 6. מנוע ענן אטומי + סינון Echo + סנכרון חי SSE (תואם v4.0/v4.1)
    // =========================================================================
    class CloudSyncEngine {
      constructor(app) {
        this.app = app;
        this.es = null;
        this.reconnectTimer = null;
        this.recentWrites = new Map();
        this.queue = JSON.parse(localStorage.getItem(KEYS.QUEUE) || '[]');
        window.addEventListener('online', () => this.flushQueue());
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && this.base) this.connect();
        });
      }

      get base() { return this.app.cloudUrl ? `${this.app.cloudUrl}/ronen_adi_v4` : ''; }

      markLocalWrite(col, id, stamp) {
        this.recentWrites.set(`${col}/${id}`, stamp || 'DEL');
        if (this.recentWrites.size > 80) this.recentWrites.delete(this.recentWrites.keys().next().value);
      }

      isEcho(col, id, data) {
        const key = `${col}/${id}`;
        if (!this.recentWrites.has(key)) return false;
        const exp = this.recentWrites.get(key);
        const inc = data === null ? 'DEL' : (data?.updatedAt || data?.ts || '');
        if (exp === inc) { this.recentWrites.delete(key); return true; }
        return false;
      }

      saveQueue() { localStorage.setItem(KEYS.QUEUE, JSON.stringify(this.queue)); }

      async atomicWrite(col, id, data) {
        if (!this.base) return;
        this.markLocalWrite(col, id, data === null ? 'DEL' : (data.updatedAt || data.ts || ''));
        try {
          const res = await fetch(`${this.base}/${col}/${encodeURIComponent(id)}.json`, {
            method: data === null ? 'DELETE' : 'PUT',
            headers: data === null ? {} : { 'Content-Type': 'application/json' },
            body: data === null ? undefined : JSON.stringify(data)
          });
          if (!res.ok) throw new Error(res.status);
          this.app.setCloudStatus('online');
        } catch {
          this.queue.push({ col, id, data });
          this.saveQueue();
          this.app.setCloudStatus('error');
        }
      }

      async flushQueue() {
        if (!this.base || !this.queue.length) return;
        const list = [...this.queue]; this.queue = []; this.saveQueue();
        for (const it of list) await this.atomicWrite(it.col, it.id, it.data);
      }

      async connect() {
        this.disconnect();
        if (!this.base) { this.app.setCloudStatus('offline'); return; }
        this.app.setCloudStatus('connecting');
        try {
          const res = await fetch(`${this.base}.json`);
          if (!res.ok) throw new Error(res.status);
          let data = await res.json();
          if (!data || (!data.tasks && !data.expenses)) {
            const mig = await this.tryMigrateFromV3();
            if (mig) data = mig;
            else if (Object.keys(this.app.tasksMap).length || Object.keys(this.app.expensesMap).length) {
              const seed = { tasks: this.app.tasksMap, expenses: this.app.expensesMap, audit: this.app.auditMap };
              await fetch(`${this.base}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(seed) });
              data = seed;
            }
          }
          if (data) this.app.hydrateFromCloudRoot(data);
          await this.flushQueue();
          this.app.setCloudStatus('online');
          this.openEventStream();
        } catch {
          this.app.setCloudStatus('error');
          this.scheduleReconnect();
        }
      }

      async tryMigrateFromV3() {
        try {
          const res = await fetch(`${this.app.cloudUrl}/ronen_adi_board.json`);
          if (!res.ok) return null;
          const legacy = await res.json();
          if (!legacy || !Array.isArray(legacy.tasks) || !legacy.tasks.length) return null;
          const tasks = {};
          for (const rt of legacy.tasks) { const t = normTask(rt, this.app.user); tasks[t.id] = t; }
          const audit = {};
          if (Array.isArray(legacy.audit)) legacy.audit.slice(0, 60).forEach((a, i) => { const id = a.id || uid('m' + i); audit[id] = { ...a, id }; });
          const payload = { tasks, expenses: this.app.expensesMap || {}, audit };
          await fetch(`${this.base}.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          this.app.toast(`יובאו ${Object.keys(tasks).length} משימות מגרסה קודמת! 🚀`, 'emerald');
          return payload;
        } catch { return null; }
      }

      openEventStream() {
        if (!window.EventSource || !this.base) return;
        try {
          this.es = new EventSource(`${this.base}.json`);
          const onEv = (isPatch) => (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (!msg || typeof msg.path !== 'string') return;
              this.app.applyCloudStreamDelta(msg.path, msg.data, isPatch);
              this.app.setCloudStatus('online');
            } catch {}
          };
          this.es.addEventListener('put', onEv(false));
          this.es.addEventListener('patch', onEv(true));
          this.es.onerror = () => { this.disconnect(); this.app.setCloudStatus('error'); this.scheduleReconnect(); };
        } catch { this.scheduleReconnect(); }
      }

      scheduleReconnect() {
        if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
        this.reconnectTimer = setTimeout(() => this.connect(), 8000);
      }

      disconnect() {
        if (this.es) { this.es.close(); this.es = null; }
        if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }
      }
    }

      freshTaskDraft(over = {}) {

          customRonenStr: '', customAdiStr: '', category: 'shopping', date: todayISO(0), linkedTaskId: '',
          ...over
