<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="רונן & עדי" />
  <title>Pulse Duo ⚡ רונן ועדי v4.0</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-app: #f4f6fb;
      --bg-card: #ffffff;
      --bg-elevated: #f8fafc;
      --bg-input: #f1f5f9;
      --bg-nav: rgba(255, 255, 255, 0.88);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --shadow-card: 0 2px 10px rgba(15, 23, 42, 0.04);
      --shadow-float: 0 12px 32px rgba(15, 23, 42, 0.14);
    }

    html.dark {
      --bg-app: #0b1120;
      --bg-card: #131c31;
      --bg-elevated: #1b2742;
      --bg-input: #0f172a;
      --bg-nav: rgba(19, 28, 49, 0.90);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-subtle: #1e293b;
      --border-strong: #334155;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-float: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    @media (min-width: 768px) {
      body { padding-bottom: 40px; }
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .card-surface {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
    }

    .elevated-surface {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
    }

    .input-surface {
      background-color: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }
    .input-surface:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .text-main { color: var(--text-primary); }
    .text-sub { color: var(--text-secondary); }
    .text-dim { color: var(--text-muted); }
    .border-soft { border-color: var(--border-subtle); }

    .glass-bar {
      background-color: var(--bg-nav);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-color: var(--border-subtle);
    }

    /* Micro-animations */
    @keyframes springPop {
      0% { transform: scale(0.85); }
      55% { transform: scale(1.18); }
      100% { transform: scale(1); }
    }
    .anim-pop { animation: springPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @keyframes sheetUp {
      from { transform: translateY(28px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .anim-sheet { animation: sheetUp 0.24s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-row { animation: fadeSlide 0.2s ease-out; }

    .swipe-card {
      touch-action: pan-y;
      transition: transform 0.18s ease-out;
      will-change: transform;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen antialiased">

  <!-- קנבס קונפטי נקודתי לרגעי הצלחה -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-[90]"></canvas>

  <!-- התראות צפות (Toasts) -->
  <div id="toast-root" class="fixed top-4 left-1/2 -translate-x-1/2 z-[80] flex flex-col items-center gap-2 pointer-events-none w-[92%] max-w-md"></div>

  <!-- אזורי ממשק מבודדים (למניעת איבוד פוקוס בעדכוני ענן) -->
  <div id="header-root"></div>

  <main id="main-root" class="max-w-3xl mx-auto px-3.5 sm:px-5 pt-4 space-y-4"></main>

  <!-- ניווט תחתון למובייל + כפתור הוספה מהיר -->
  <div id="nav-root"></div>

  <!-- שכבת Bottom Sheets ומודאלים מבודדת -->
  <div id="sheet-root"></div>

  <script type="module">
    // =========================================================================
    // 1. קבועים, מודל נתונים, עזרים ותאימות מלאה ל-v3.0
    // =========================================================================
    const KEYS = {
      // מפתחות תואמי v3.0 לשמירת הגדרות קיימות
      USER: 'ra_user_v2',
      CLOUD: 'ra_cloud_url_v2',
      THEME: 'ra_theme_v2',
      LEGACY_TASKS: 'ra_tasks_v2',
      LEGACY_AUDIT: 'ra_audit_v2',
      // מפתחות v4.0
      TASKS: 'ra_v4_tasks',
      EXPENSES: 'ra_v4_expenses',
      AUDIT: 'ra_v4_audit',
      QUEUE: 'ra_v4_offline_queue',
      SETTINGS: 'ra_v4_settings',
      NOTIFIED: 'ra_v4_notified_map',
      MIGRATED_LOCAL: 'ra_v4_migrated_local'
    };

    const USERS = {
      ronen: { id: 'ronen', name: 'רונן', avatar: '👨🏻‍💻', accent: '#2563eb' },
      adi:   { id: 'adi',   name: 'עדי',  avatar: '👩🏻',   accent: '#db2777' },
      both:  { id: 'both',  name: 'משותף', avatar: '💑',   accent: '#7c3aed' }
    };

    const CATEGORIES = {
      wedding:  { id: 'wedding',  label: 'חתונה',  icon: '💍', color: '#ec4899' },
      home:     { id: 'home',     label: 'בית',    icon: '🏠', color: '#3b82f6' },
      shopping: { id: 'shopping', label: 'קניות',  icon: '🛒', color: '#f59e0b' },
      trip:     { id: 'trip',     label: 'טיול',   icon: '✈️', color: '#10b981' },
      bills:    { id: 'bills',    label: 'חשבונות', icon: '🧾', color: '#8b5cf6' },
      other:    { id: 'other',    label: 'כללי',   icon: '✨', color: '#64748b' }
    };

    const PRIORITIES = {
      urgent: { id: 'urgent', label: 'דחוף',  icon: '🔥', weight: 4 },
      high:   { id: 'high',   label: 'גבוהה', icon: '⚡', weight: 3 },
      medium: { id: 'medium', label: 'רגילה', icon: '📌', weight: 2 },
      low:    { id: 'low',    label: 'נמוכה', icon: '🌱', weight: 1 }
    };

    const DEFAULT_SETTINGS = {
      soundEnabled: true,
      ntfyTopic: '',
      ntfyOnAssign: true,
      ntfyOnExpense: true,
      alertLeadDays: 1,
      rates: { ILS: 1, EUR: 4.0, USD: 3.7 }
    };

    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    const esc = (s = '') => String(s ?? '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
    const safeUrl = (u = '') => {
      const s = String(u || '').trim();
      return /^https?:\/\//i.test(s) ? s : '';
    };

    function todayISO(offsetDays = 0) {
      const d = new Date();
      d.setHours(12, 0, 0, 0);
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseLocalDate(isoStr, timeStr = '') {
      if (!isoStr || !/^\d{4}-\d{2}-\d{2}$/.test(isoStr)) return null;
      const [y, m, d] = isoStr.split('-').map(Number);
      if (timeStr && /^\d{2}:\d{2}$/.test(timeStr)) {
        const [hh, mm] = timeStr.split(':').map(Number);
        return new Date(y, m - 1, d, hh, mm, 0, 0);
      }
      return new Date(y, m - 1, d, 23, 59, 0, 0);
    }

    function formatShortHebDate(isoStr) {
      if (!isoStr) return '';
      const d = parseLocalDate(isoStr);
      if (!d) return isoStr;
      const t0 = parseLocalDate(todayISO(0));
      const diffDays = Math.round((d - t0) / 86400000);
      if (diffDays === 0) return 'היום';
      if (diffDays === 1) return 'מחר';
      if (diffDays === -1) return 'אתמול';
      if (diffDays < -1) return `באיחור ${Math.abs(diffDays)} ימים`;
      if (diffDays <= 6) {
        const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
        return `יום ${days[d.getDay()]}`;
      }
      return `${d.getDate()}/${d.getMonth() + 1}`;
    }

    function formatILS(agorot, showSign = false) {
      const abs = Math.abs(Math.round(agorot || 0));
      const shekels = abs / 100;
      const hasDecimals = abs % 100 !== 0;
      const formatted = shekels.toLocaleString('he-IL', {
        minimumFractionDigits: hasDecimals ? 2 : 0,
        maximumFractionDigits: 2
      });
      const sign = showSign ? (agorot > 0 ? '+' : agorot < 0 ? '-' : '') : (agorot < 0 ? '-' : '');
      return `${sign}₪${formatted}`;
    }

    function normTask(raw = {}, actor = 'ronen') {
      const done = Boolean(raw.done || raw.status === 'done');
      return {
        id: raw.id || uid('t'),
        title: String(raw.title || 'משימה חדשה').trim(),
        category: CATEGORIES[raw.category] ? raw.category : 'other',
        assignee: USERS[raw.assignee] ? raw.assignee : 'both',
        priority: PRIORITIES[raw.priority] ? raw.priority : 'medium',
        done,
        pinned: Boolean(raw.pinned),
        dueDate: raw.dueDate || '',
        dueTime: raw.dueTime || '',
        remindLead: raw.remindLead !== undefined ? Number(raw.remindLead) : 1,
        estimatedBudget: Number(raw.estimatedBudget) || 0,
        notes: String(raw.notes || '').trim(),
        link: String(raw.link || '').trim(),
        reaction: raw.reaction || '',
        subtasks: Array.isArray(raw.subtasks)
          ? raw.subtasks
              .map(s => ({
                id: s.id || uid('s'),
                title: String(s.title || '').trim(),
                done: Boolean(s.done)
              }))
              .filter(s => s.title)
          : [],
        createdAt: raw.createdAt || new Date().toISOString(),
        updatedAt: raw.updatedAt || new Date().toISOString(),
        completedAt: done ? (raw.completedAt || raw.updatedAt || new Date().toISOString()) : null,
        completedBy: done ? (raw.completedBy || actor) : null
      };
    }

    function normExpense(raw = {}) {
      const amountAgorot = Math.max(0, Math.round(Number(raw.amountAgorot ?? (Number(raw.amount || 0) * 100)) || 0));
      const paymentMethod = raw.paymentMethod === 'joint_card' ? 'joint_card' : 'personal';
      const paidBy = raw.paidBy === 'adi' ? 'adi' : 'ronen';
      const validSplits = ['equal', 'for_other', 'custom', 'settlement'];
      const splitType = validSplits.includes(raw.splitType) ? raw.splitType : 'equal';

      let ronenShareAgorot = 0;
      let adiShareAgorot = 0;

      if (splitType === 'settlement') {
        ronenShareAgorot = 0;
        adiShareAgorot = 0;
      } else if (splitType === 'equal') {
        adiShareAgorot = Math.floor(amountAgorot / 2);
        ronenShareAgorot = amountAgorot - adiShareAgorot;
      } else if (splitType === 'for_other') {
        if (paidBy === 'ronen') {
          adiShareAgorot = amountAgorot;
          ronenShareAgorot = 0;
        } else {
          ronenShareAgorot = amountAgorot;
          adiShareAgorot = 0;
        }
      } else if (splitType === 'custom') {
        const r = Math.min(amountAgorot, Math.max(0, Math.round(Number(raw.ronenShareAgorot) || 0)));
        ronenShareAgorot = r;
        adiShareAgorot = amountAgorot - r;
      }

      return {
        id: raw.id || uid('exp'),
        title: String(raw.title || 'הוצאה').trim(),
        amountAgorot,
        originalAmount: Number(raw.originalAmount) || (amountAgorot / 100),
        currency: ['ILS', 'EUR', 'USD'].includes(raw.currency) ? raw.currency : 'ILS',
        rateUsed: Number(raw.rateUsed) || 1,
        paymentMethod,
        paidBy,
        splitType,
        ronenShareAgorot,
        adiShareAgorot,
        category: CATEGORIES[raw.category] ? raw.category : 'other',
        date: raw.date || todayISO(0),
        linkedTaskId: raw.linkedTaskId || '',
        notes: String(raw.notes || '').trim(),
        createdBy: raw.createdBy === 'adi' ? 'adi' : 'ronen',
        updatedAt: raw.updatedAt || new Date().toISOString()
      };
    }

    // הגדרת Manifest דינמי להוספה נוחה למסך הבית (PWA)
    (function injectDynamicManifest() {
      try {
        const manifest = {
          name: 'Pulse Duo — רונן ועדי',
          short_name: 'רונן & עדי',
          start_url: '.',
          display: 'standalone',
          background_color: '#0b1120',
          theme_color: '#4f46e5',
          dir: 'rtl',
          lang: 'he'
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch {}
    })();

    // =========================================================================
    // 2. מנוע תחושה, צלילים עדינים (Web Audio) וקונפטי (FeedbackEngine)
    // =========================================================================
    class FeedbackEngine {
      static ctx = null;

      static ensureCtx() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      static play(type = 'pop', enabled = true) {
        if (navigator.vibrate) {
          if (type === 'complete') navigator.vibrate([12, 30, 18]);
          else if (type === 'coin') navigator.vibrate(15);
          else navigator.vibrate(8);
        }
        if (!enabled) return;
        const ctx = this.ensureCtx();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'complete') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.11);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        } else if (type === 'coin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1174.66, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
          osc.start(now);
          osc.stop(now + 0.25);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.06);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      }

      static confetti() {
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#4f46e5', '#10b981', '#ec4899', '#f59e0b', '#38bdf8'];
        const particles = Array.from({ length: 48 }, () => ({
          x: canvas.width * (0.25 + Math.random() * 0.5),
          y: canvas.height * 0.35,
          vx: (Math.random() - 0.5) * 11,
          vy: -(4 + Math.random() * 9),
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.25,
          life: 1
        }));

        let frame = 0;
        const step = () => {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.36;
            p.rot += p.vrot;
            p.life -= 0.018;
            if (p.life > 0) {
              alive = true;
              ctx.save();
              ctx.globalAlpha = Math.max(0, p.life);
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
              ctx.restore();
            }
          }
          if (alive && frame < 95) requestAnimationFrame(step);
          else ctx.clearRect(0, 0, canvas.width, canvas.height);
        };
        requestAnimationFrame(step);
      }
    }

    // =========================================================================
    // 3. מנוע התחשבנות זוגית מדויק באגורות (FinanceEngine)
    // =========================================================================
    class FinanceEngine {
      /**
       * מחזיר דלתא באגורות של רשומה אחת על המאזן B:
       * B > 0 => עדי חייבת להחזיר לרונן
       * B < 0 => רונן חייב להחזיר לעדי
       * B = 0 => מאוזנים / ללא השפעה (למשל אשראי משותף)
       */
      static expenseDelta(exp) {
        if (!exp) return 0;
        if (exp.paymentMethod === 'joint_card' && exp.splitType !== 'settlement') return 0;
        if (exp.splitType === 'settlement') {
          return exp.paidBy === 'adi' ? -exp.amountAgorot : exp.amountAgorot;
        }
        return exp.paidBy === 'ronen' ? exp.adiShareAgorot : -exp.ronenShareAgorot;
      }

      static computeSummary(expenses = []) {
        let balanceAgorot = 0;
        let personalRonenAgorot = 0;
        let personalAdiAgorot = 0;
        let jointCardAgorot = 0;
        const byCategory = {};
        const thisMonthPrefix = todayISO(0).slice(0, 7);
        let thisMonthTotalAgorot = 0;

        for (const e of expenses) {
          balanceAgorot += this.expenseDelta(e);
          if (e.splitType === 'settlement') continue;

          if (e.paymentMethod === 'joint_card') {
            jointCardAgorot += e.amountAgorot;
          } else if (e.paidBy === 'ronen') {
            personalRonenAgorot += e.amountAgorot;
          } else {
            personalAdiAgorot += e.amountAgorot;
          }

          if ((e.date || '').startsWith(thisMonthPrefix)) {
            thisMonthTotalAgorot += e.amountAgorot;
          }
          byCategory[e.category] = (byCategory[e.category] || 0) + e.amountAgorot;
        }

        const direction = balanceAgorot > 0
          ? { debtor: 'adi', creditor: 'ronen', amountAgorot: balanceAgorot, shortText: `עדי ← רונן ${formatILS(balanceAgorot)}`, fullText: `עדי צריכה להחזיר לרונן ${formatILS(balanceAgorot)}` }
          : balanceAgorot < 0
          ? { debtor: 'ronen', creditor: 'adi', amountAgorot: Math.abs(balanceAgorot), shortText: `רונן ← עדי ${formatILS(Math.abs(balanceAgorot))}`, fullText: `רונן צריך להחזיר לעדי ${formatILS(Math.abs(balanceAgorot))}` }
          : { debtor: null, creditor: null, amountAgorot: 0, shortText: 'מאוזנים ✨', fullText: 'החשבון ביניכם מאוזן לגמרי ✨' };

        return {
          balanceAgorot,
          direction,
          personalRonenAgorot,
          personalAdiAgorot,
          jointCardAgorot,
          thisMonthTotalAgorot,
          byCategory
        };
      }
    }

    // =========================================================================
    // 4. מנוע NLP עברי להוספה ב-2 שניות, זיהוי תתי-משימות וייבוא WhatsApp
    // =========================================================================
    const SEMANTIC_CLUSTERS = [
      { name: 'חתונה ורבנות', category: 'wedding', keywords: ['רב', 'רבנות', 'צהר', 'חופה', 'אולם', 'דיגיי', 'צלם', 'שמלה', 'חליפה', 'הזמנות', 'מוזמנים', 'טבעות', 'חתונה', 'כתובה'] },
      { name: 'טיולים ונופש', category: 'trip', keywords: ['טיסה', 'מלון', 'צימר', 'לרנקה', 'קפריסין', 'ניו יורק', 'קרוז', 'יקב', 'טיול', 'דרכון', 'ביטוח נסיעות', 'השכרת רכב'] },
      { name: 'קניות ומטבח', category: 'shopping', keywords: ['סופר', 'קניות', 'בשר', 'קצב', 'מנגל', 'על האש', 'טורטיות', 'ירקות', 'סלטים', 'חומוס', 'טחינה', 'אוכל'] },
      { name: 'בית וציוד', category: 'home', keywords: ['שואב', 'mova', 'מובה', 'פילטר', 'שקיות', 'אליאקספרס', 'תמי 4', 'תמי4', 'חשמלאי', 'תיקון', 'רכב', 'קיה', 'סוזוקי', 'טסט', 'ביטוח'] },
      { name: 'חשבונות וביטולים', category: 'bills', keywords: ['ארנונה', 'מים', 'חשמל', 'מנוי', 'ביטול', 'אשראי', 'בנק', 'מקדמה', 'תשלום', 'ביט', 'פייבוקס'] }
    ];

    class NLPEngine {
      static parseQuickTaskInput(rawText = '') {
        let text = String(rawText || '');
        const parsed = {
          cleanTitle: '',
          dueDate: '',
          dueTime: '',
          assignee: null,
          priority: null,
          category: null,
          estimatedBudget: 0
        };

        // 1. אחראי מפורש (@עדי / @רונן / @משותף)
        if (/@עדי\b/.test(text)) { parsed.assignee = 'adi'; text = text.replace(/@עדי\b/g, ''); }
        else if (/@רונן\b/.test(text)) { parsed.assignee = 'ronen'; text = text.replace(/@רונן\b/g, ''); }
        else if (/@משותף\b/.test(text)) { parsed.assignee = 'both'; text = text.replace(/@משותף\b/g, ''); }

        // 2. דחיפות מפורשת (!דחוף / !! / !חשוב)
        if (/(!דחוף|!!|דחוף!)/i.test(text)) { parsed.priority = 'urgent'; text = text.replace(/(!דחוף|!!|דחוף!)/gi, ''); }
        else if (/(!חשוב|!גבוה)/i.test(text)) { parsed.priority = 'high'; text = text.replace(/(!חשוב|!גבוה)/gi, ''); }

        // 3. שעה (ב-18:00 או 14:30)
        const timeMatch = text.match(/(?:ב-?|שעה\s+)?(\d{1,2}:\d{2})/);
        if (timeMatch) {
          const [h, m] = timeMatch[1].split(':').map(Number);
          if (h >= 0 && h <= 23 && m >= 0 && m <= 59) {
            parsed.dueTime = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            text = text.replace(timeMatch[0], '');
          }
        }

        // 4. תאריך בעברית טבעית
        if (/\bמחרתיים\b/.test(text)) {
          parsed.dueDate = todayISO(2);
          text = text.replace(/\bמחרתיים\b/, '');
        } else if (/\bמחר\b/.test(text)) {
          parsed.dueDate = todayISO(1);
          text = text.replace(/\bמחר\b/, '');
        } else if (/\bהיום\b/.test(text)) {
          parsed.dueDate = todayISO(0);
          text = text.replace(/\bהיום\b/, '');
        } else if (/\b(סופ"ש|סופ״ש|שישי הקרוב)\b/.test(text)) {
          const now = new Date();
          const daysToFri = (5 - now.getDay() + 7) % 7 || 7;
          parsed.dueDate = todayISO(daysToFri);
          text = text.replace(/\b(סופ"ש|סופ״ש|שישי הקרוב)\b/, '');
        } else {
          const dayMap = { 'ראשון': 0, 'שני': 1, 'שלישי': 2, 'רביעי': 3, 'חמישי': 4, 'שישי': 5, 'שבת': 6 };
          const dayRegex = /(?:ב?יום\s+)(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)/;
          const dm = text.match(dayRegex);
          if (dm) {
            const target = dayMap[dm[1]];
            const cur = new Date().getDay();
            let diff = (target - cur + 7) % 7;
            if (diff === 0) diff = 7;
            parsed.dueDate = todayISO(diff);
            text = text.replace(dm[0], '');
          } else {
            const explicitDate = text.match(/\b(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\b/);
            if (explicitDate) {
              const d = Number(explicitDate[1]);
              const mo = Number(explicitDate[2]);
              let y = explicitDate[3] ? Number(explicitDate[3]) : new Date().getFullYear();
              if (y < 100) y += 2000;
              if (d >= 1 && d <= 31 && mo >= 1 && mo <= 12) {
                parsed.dueDate = `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                text = text.replace(explicitDate[0], '');
              }
            }
          }
        }

        // 5. סכום תקציב (150 ₪ / ₪150 / 150 ש"ח)
        const budgetMatch = text.match(/(?:₪\s*(\d[\d,]*))|(?:(\d[\d,]*)\s*(?:₪|ש"ח|ש״ח|שח))/);
        if (budgetMatch) {
          parsed.estimatedBudget = Number((budgetMatch[1] || budgetMatch[2]).replace(/,/g, '')) || 0;
          text = text.replace(budgetMatch[0], '');
        }

        // 6. זיהוי קטגוריה אוטומטי לפי תוכן
        const lower = rawText.toLowerCase();
        for (const c of SEMANTIC_CLUSTERS) {
          if (c.keywords.some(kw => lower.includes(kw))) {
            parsed.category = c.category;
            break;
          }
        }

        parsed.cleanTitle = text.replace(/\s{2,}/g, ' ').trim();
        return parsed;
      }

      static tokenize(text = '') {
        const stop = new Set(['את', 'של', 'על', 'עם', 'או', 'גם', 'כי', 'אם', 'לא', 'כן', 'זה', 'לי', 'לנו', 'צריך', 'לקנות', 'לעשות', 'לבדוק', 'להזמין', 'רונן', 'עדי', 'משותף']);
        return String(text || '')
          .toLowerCase()
          .replace(/[^\u0590-\u05FFa-z0-9\s]/g, ' ')
          .trim()
          .split(/\s+/)
          .map(w => w.replace(/^[הובלמכש]/, ''))
          .filter(w => w.length >= 2 && !stop.has(w));
      }

      static findParentMatch(inputText = '', tasks = []) {
        const raw = String(inputText || '').trim();
        if (raw.length < 3 || !tasks.length) return null;
        const open = tasks.filter(t => !t.done);
        const candidates = open.length ? open : tasks;
        const clean = raw.replace(/^(>|תת:|\+)\s*/, '').trim();
        const lower = clean.toLowerCase();
        const tokens = this.tokenize(clean);

        let best = null;
        let bestScore = 0;
        let reason = '';

        for (const t of candidates) {
          if (t.title.trim().toLowerCase() === lower) continue;
          let score = 0;
          let r = '';
          const tText = `${t.title} ${t.notes || ''}`.toLowerCase();
          const tTokens = this.tokenize(tText);

          for (const tok of tokens) {
            if (tTokens.some(tt => tt === tok || (tt.length >= 3 && tok.length >= 3 && (tt.includes(tok) || tok.includes(tt))))) {
              score += 35;
              r = `קשר למילה "${tok}"`;
            }
          }
          for (const cl of SEMANTIC_CLUSTERS) {
            if (cl.keywords.some(k => lower.includes(k)) && cl.keywords.some(k => tText.includes(k))) {
              score += 45;
              r = `נושא "${cl.name}"`;
            }
          }
          if (score > bestScore) {
            bestScore = score;
            best = t;
            reason = r;
          }
        }
        return best && bestScore >= 40 ? { parentTask: best, cleanSubtaskTitle: clean, reason } : null;
      }

      static parseWhatsApp(rawText = '', tasks = []) {
        const lines = String(rawText || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const headerRe = /^(?:\[?\d{1,2}[./-]\d{1,2}[./-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*[-–]?\s*)([^:]+):\s*(.+)$/;
        const out = [];

        for (const line of lines) {
          let sender = '';
          let content = line;
          const m = line.match(headerRe);
          if (m) { sender = m[1].trim(); content = m[2].trim(); }
          content = content.replace(/^[-*•✅⭕📌\d.)\]]+\s*/, '').trim();
          if (content.length < 2) continue;

          const parsed = this.parseQuickTaskInput(content);
          let assignee = parsed.assignee || 'both';
          if (!parsed.assignee) {
            if (/\b(עדי|לעדי)\b/.test(content) || sender.includes('עדי')) assignee = 'adi';
            else if (/\b(רונן|לרונן)\b/.test(content) || sender.includes('רונן')) assignee = 'ronen';
          }

          const looksLikeExpense = parsed.estimatedBudget > 0 && /(שילמתי|עלה|שולם|העברתי|קניתי|חיוב|אשראי|להחזיר|חצי)/i.test(content);
          const parentMatch = looksLikeExpense ? null : this.findParentMatch(parsed.cleanTitle || content, tasks);

          out.push({
            tempId: uid('wa'),
            title: parsed.cleanTitle || content,
            assignee,
            category: parsed.category || 'other',
            priority: parsed.priority || 'medium',
            dueDate: parsed.dueDate,
            dueTime: parsed.dueTime,
            amount: parsed.estimatedBudget,
            paidBy: sender.includes('עדי') ? 'adi' : 'ronen',
            targetType: looksLikeExpense ? 'expense' : (parentMatch ? 'subtask' : 'new_task'),
            parentTaskId: parentMatch ? parentMatch.parentTask.id : (tasks.find(t => !t.done)?.id || ''),
            matchReason: looksLikeExpense ? 'זוהה תשלום/הוצאה' : (parentMatch ? parentMatch.reason : '')
          });
        }
        return out;
      }
    }

    // =========================================================================
    // 5. מנוע התראות 4 שכבות: רדאר, דפדפן, .ics ליומן ו-ntfy.sh (AlertEngine)
    // =========================================================================
    class AlertEngine {
      static classifyTask(task) {
        if (task.done) return 'done';
        if (!task.dueDate) return 'later';
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        const dueObj = parseLocalDate(task.dueDate, task.dueTime);
        if (!dueObj) return 'later';

        const dueDayStart = new Date(dueObj.getFullYear(), dueObj.getMonth(), dueObj.getDate(), 0, 0, 0, 0);
        const diffDays = Math.round((dueDayStart - todayStart) / 86400000);

        if (diffDays < 0 || (diffDays === 0 && task.dueTime && dueObj < now)) return 'overdue';
        if (diffDays === 0) return 'today';
        if (diffDays <= 7) return 'week';
        return 'later';
      }

      static getUrgentDeadlineTasks(tasks = []) {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        return tasks.filter(t => {
          if (t.done || !t.dueDate) return false;
          const d = parseLocalDate(t.dueDate, t.dueTime);
          if (!d) return false;
          const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
          const diffDays = Math.round((dStart - todayStart) / 86400000);
          return diffDays <= 3;
        }).sort((a, b) => (a.dueDate + (a.dueTime || '23:59')).localeCompare(b.dueDate + (b.dueTime || '23:59')));
      }

      static checkBrowserNotifications(tasks = [], settings = DEFAULT_SETTINGS) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        let notifiedMap = {};
        try { notifiedMap = JSON.parse(localStorage.getItem(KEYS.NOTIFIED) || '{}'); } catch {}

        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        let changed = false;

        for (const t of tasks) {
          if (t.done || !t.dueDate) continue;
          const d = parseLocalDate(t.dueDate, t.dueTime);
          if (!d) continue;
          const dStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
          const diffDays = Math.round((dStart - todayStart) / 86400000);
          const lead = t.remindLead !== undefined ? t.remindLead : settings.alertLeadDays;

          let bucket = null;
          let label = '';
          if (diffDays < 0) { bucket = 'overdue_' + todayISO(0); label = '🔥 משימה באיחור!'; }
          else if (diffDays === 0) { bucket = 'today_' + todayISO(0); label = t.dueTime ? `⏰ היום ב-${t.dueTime}` : '⏰ דדליין היום!'; }
          else if (diffDays <= lead) { bucket = `lead_${diffDays}_${todayISO(0)}`; label = diffDays === 1 ? '📅 מחר הדדליין' : `📅 עוד ${diffDays} ימים לדדליין`; }

          if (bucket) {
            const key = `${t.id}__${bucket}`;
            if (!notifiedMap[key]) {
              notifiedMap[key] = Date.now();
              changed = true;
              try {
                new Notification(label, {
                  body: `${t.title}${t.notes ? ' — ' + t.notes.slice(0, 60) : ''}`,
                  tag: key
                });
              } catch {}
            }
          }
        }
        if (changed) localStorage.setItem(KEYS.NOTIFIED, JSON.stringify(notifiedMap));
      }

      static escapeICS(str = '') {
        return String(str || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
      }

      static buildVEvent(task) {
        if (!task.dueDate) return '';
        const dateClean = task.dueDate.replace(/-/g, '');
        const hasTime = Boolean(task.dueTime && /^\d{2}:\d{2}$/.test(task.dueTime));
        const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
        let dtLines = [];
        if (hasTime) {
          const [hh, mm] = task.dueTime.split(':').map(Number);
          const endH = String(Math.min(23, hh + 1)).padStart(2, '0');
          const startStr = `${dateClean}T${String(hh).padStart(2, '0')}${String(mm).padStart(2, '0')}00`;
          const endStr = `${dateClean}T${endH}${String(mm).padStart(2, '0')}00`;
          dtLines = [`DTSTART:${startStr}`, `DTEND:${endStr}`];
        } else {
          const nextD = parseLocalDate(task.dueDate);
          nextD.setDate(nextD.getDate() + 1);
          const nextClean = `${nextD.getFullYear()}${String(nextD.getMonth() + 1).padStart(2, '0')}${String(nextD.getDate()).padStart(2, '0')}`;
          dtLines = [`DTSTART;VALUE=DATE:${dateClean}`, `DTEND;VALUE=DATE:${nextClean}`];
        }

        const desc = [
          `אחראי: ${USERS[task.assignee]?.name || 'משותף'}`,
          task.notes ? `הערות: ${task.notes}` : '',
          task.subtasks?.length ? `שלבים: ${task.subtasks.map(s => (s.done ? '[v] ' : '[ ] ') + s.title).join(' | ')}` : ''
        ].filter(Boolean).join('\n');

        return [
          'BEGIN:VEVENT',
          `UID:${task.id}@pulseduo.local`,
          `DTSTAMP:${stamp}`,
          ...dtLines,
          `SUMMARY:${this.escapeICS('⚡ ' + task.title)}`,
          `DESCRIPTION:${this.escapeICS(desc)}`,
          'BEGIN:VALARM',
          'TRIGGER:-P1D',
          'ACTION:DISPLAY',
          `DESCRIPTION:${this.escapeICS('מחר דדליין: ' + task.title)}`,
          'END:VALARM',
          'BEGIN:VALARM',
          'TRIGGER:-PT1H',
          'ACTION:DISPLAY',
          `DESCRIPTION:${this.escapeICS('בקרוב דדליין: ' + task.title)}`,
          'END:VALARM',
          'END:VEVENT'
        ].join('\r\n');
      }

      static downloadICS(tasksList = [], filename = 'pulse-duo-deadlines.ics') {
        const events = tasksList.filter(t => !t.done && t.dueDate).map(t => this.buildVEvent(t)).filter(Boolean);
        if (!events.length) return false;
        const ics = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//PulseDuo//RonenAdi//HE',
          'CALSCALE:GREGORIAN',
          ...events,
          'END:VCALENDAR'
        ].join('\r\n');
        const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        return true;
      }

      static async sendNtfyPush(topic, text) {
        const cleanTopic = String(topic || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
        if (!cleanTopic) return false;
        try {
          const res = await fetch(`https://ntfy.sh/${encodeURIComponent(cleanTopic)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain; charset=utf-8' },
            body: text
          });
          return res.ok;
        } catch {
          return false;
        }
      }
    }

    // =========================================================================
    // 6. מנוע ענן אטומי Firebase RTDB + SSE חי + תור אופליין + מיגרציה מ-v3.0
    // =========================================================================
    class CloudSyncEngine {
      constructor(app) {
        this.app = app;
        this.es = null;
        this.reconnectTimer = null;
        this.queue = JSON.parse(localStorage.getItem(KEYS.QUEUE) || '[]');
        window.addEventListener('online', () => this.flushQueue());
      }

      get base() {
        return this.app.cloudUrl ? `${this.app.cloudUrl}/ronen_adi_v4` : '';
      }

      saveQueue() {
        localStorage.setItem(KEYS.QUEUE, JSON.stringify(this.queue));
      }

      enqueue(item) {
        this.queue.push(item);
        this.saveQueue();
      }

      async atomicWrite(collection, id, data) {
        if (!this.base) return;
        const url = `${this.base}/${collection}/${encodeURIComponent(id)}.json`;
        try {
          const res = await fetch(url, {
            method: data === null ? 'DELETE' : 'PUT',
            headers: data === null ? {} : { 'Content-Type': 'application/json' },
            body: data === null ? undefined : JSON.stringify(data)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          this.app.setCloudStatus('online');
        } catch {
          this.enqueue({ collection, id, data });
          this.app.setCloudStatus('error');
        }
      }

      async flushQueue() {
        if (!this.base || !this.queue.length) return;
        const pending = [...this.queue];
        this.queue = [];
        this.saveQueue();
        for (const item of pending) {
          await this.atomicWrite(item.collection, item.id, item.data);
        }
      }

      async connect() {
        this.disconnect();
        if (!this.base) {
          this.app.setCloudStatus('offline');
          return;
        }
        this.app.setCloudStatus('connecting');

        try {
          const res = await fetch(`${this.base}.json`);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          let v4Data = await res.json();

          // מיגרציה אוטומטית ובטוחה מ-v3.0 אם הנתיב החדש ריק
          if (!v4Data || (!v4Data.tasks && !v4Data.expenses)) {
            const migrated = await this.tryMigrateFromV3();
            if (migrated) {
              v4Data = migrated;
            } else if (Object.keys(this.app.tasksMap).length > 0 || Object.keys(this.app.expensesMap).length > 0) {
              // דחיפת נתונים מקומיים קיימים לענן החדש
              const seedPayload = {
                tasks: this.app.tasksMap,
                expenses: this.app.expensesMap,
                audit: this.app.auditMap
              };
              await fetch(`${this.base}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(seedPayload)
              });
              v4Data = seedPayload;
            }
          }

          if (v4Data) {
            this.app.hydrateFromCloudRoot(v4Data);
          }
          await this.flushQueue();
          this.app.setCloudStatus('online');
          this.openEventStream();
        } catch {
          this.app.setCloudStatus('error');
          this.scheduleReconnect();
        }
      }

      async tryMigrateFromV3() {
        try {
          const res = await fetch(`${this.app.cloudUrl}/ronen_adi_board.json`);
          if (!res.ok) return null;
          const legacy = await res.json();
          if (!legacy || !Array.isArray(legacy.tasks) || !legacy.tasks.length) return null;

          const tasksObj = {};
          for (const rawT of legacy.tasks) {
            const t = normTask(rawT, this.app.user);
            tasksObj[t.id] = t;
          }
          const auditObj = {};
          if (Array.isArray(legacy.audit)) {
            legacy.audit.slice(0, 60).forEach((a, idx) => {
              const id = a.id || uid('mig' + idx);
              auditObj[id] = { ...a, id };
            });
          }
          const payload = { tasks: tasksObj, expenses: this.app.expensesMap || {}, audit: auditObj };
          await fetch(`${this.base}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          this.app.toast(`יובאו אוטומטית ${Object.keys(tasksObj).length} משימות מגרסה 3.0! 🚀`, 'emerald');
          return payload;
        } catch {
          return null;
        }
      }

      openEventStream() {
        if (!window.EventSource || !this.base) return;
        try {
          this.es = new EventSource(`${this.base}.json`);
          const handleEvent = (isPatch) => (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              if (!msg || typeof msg.path !== 'string') return;
              this.app.applyCloudStreamDelta(msg.path, msg.data, isPatch);
              this.app.setCloudStatus('online');
            } catch {}
          };
          this.es.addEventListener('put', handleEvent(false));
          this.es.addEventListener('patch', handleEvent(true));
          this.es.onerror = () => {
            this.disconnect();
            this.app.setCloudStatus('error');
            this.scheduleReconnect();
          };
        } catch {
          this.scheduleReconnect();
        }
      }

      scheduleReconnect() {
        if (this.reconnectTimer) clearTimeout(this.reconnectTimer);
        this.reconnectTimer = setTimeout(() => this.connect(), 10000);
      }

      disconnect() {
        if (this.es) { this.es.close(); this.es = null; }
        if (this.reconnectTimer) { clearTimeout(this.reconnectTimer); this.reconnectTimer = null; }
      }
    }

    // =========================================================================
    // 7. בקר האפליקציה הראשי (PulseDuoApp v4.0)
    // =========================================================================
    class PulseDuoApp {
      constructor() {
        this.user = localStorage.getItem(KEYS.USER) || 'ronen';
        this.cloudUrl = (localStorage.getItem(KEYS.CLOUD) || '').replace(/\/$/, '');
        this.darkMode = localStorage.getItem(KEYS.THEME) === 'dark';
        this.cloudStatus = this.cloudUrl ? 'connecting' : 'offline';

        this.settings = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(KEYS.SETTINGS) || '{}') };
        if (!this.settings.rates) this.settings.rates = { ...DEFAULT_SETTINGS.rates };

        this.tab = 'home'; // 'home' | 'wallet' | 'hub'
        this.expandedTaskId = null;
        this.showDoneSection = false;
        this.taskFilters = { q: '', who: 'all', category: 'all', radarOnly: false };
        this.walletFilter = { method: 'personal', period: 'all' }; // method: 'personal' | 'joint_card' | 'all'

        // מצב Sheets / Modals (מבודד לחלוטין מרינדור הרקע)
        this.sheet = null; // null | 'quick-add' | 'edit-task' | 'edit-expense' | 'settle' | 'wa-import' | 'wa-share' | 'gemini' | 'cloud'
        this.quickMode = 'task'; // 'task' | 'expense'
        this.quickTaskDraft = this.freshTaskDraft();
        this.quickExpenseDraft = this.freshExpenseDraft();
        this.editingTask = null;
        this.editingExpense = null;
        this.waRawInput = '';
        this.waDrafts = [];
        this.waShareMode = 'adi_focus';

        this.tasksMap = {};
        this.expensesMap = {};
        this.auditMap = {};

        this.loadLocalState();
        this.applyTheme();
        this.checkUrlParams();

        this.cloud = new CloudSyncEngine(this);
        this.bindGlobalEvents();
        this.renderAll();

        if (this.cloudUrl) this.cloud.connect();
        this.startNotificationLoop();
      }

      freshTaskDraft(overrides = {}) {
        return {
          rawInput: '',
          title: '',
          assignee: 'both',
          category: 'other',
          priority: 'medium',
          dueDate: '',
          dueTime: '',
          remindLead: this.settings.alertLeadDays,
          estimatedBudget: 0,
          notes: '',
          parentTaskId: null,
          ...overrides
        };
      }

      freshExpenseDraft(overrides = {}) {
        return {
          title: '',
          amountStr: '',
          currency: 'ILS',
          paymentMethod: 'personal',
          paidBy: this.user === 'adi' ? 'adi' : 'ronen',
          splitType: 'equal',
          customRonenStr: '',
          category: 'shopping',
          date: todayISO(0),
          linkedTaskId: '',
          notes: '',
          ...overrides
        };
      }

      loadLocalState() {
        const storedTasks = JSON.parse(localStorage.getItem(KEYS.TASKS) || 'null');
        const storedExpenses = JSON.parse(localStorage.getItem(KEYS.EXPENSES) || 'null');
        const storedAudit = JSON.parse(localStorage.getItem(KEYS.AUDIT) || 'null');

        if (storedTasks && typeof storedTasks === 'object') {
          Object.values(storedTasks).forEach(t => { const nt = normTask(t, this.user); this.tasksMap[nt.id] = nt; });
        } else if (!localStorage.getItem(KEYS.MIGRATED_LOCAL)) {
          // מיגרציה מקומית אוטומטית מ-v3.0
          const legacyTasks = JSON.parse(localStorage.getItem(KEYS.LEGACY_TASKS) || 'null');
          if (Array.isArray(legacyTasks) && legacyTasks.length) {
            legacyTasks.forEach(t => { const nt = normTask(t, this.user); this.tasksMap[nt.id] = nt; });
          } else {
            this.seedInitialTasks().forEach(t => { this.tasksMap[t.id] = t; });
          }
          localStorage.setItem(KEYS.MIGRATED_LOCAL, '1');
        }

        if (storedExpenses && typeof storedExpenses === 'object') {
          Object.values(storedExpenses).forEach(e => { const ne = normExpense(e); this.expensesMap[ne.id] = ne; });
        }

        if (storedAudit && typeof storedAudit === 'object') {
          this.auditMap = storedAudit;
        } else {
          const legacyAudit = JSON.parse(localStorage.getItem(KEYS.LEGACY_AUDIT) || '[]');
          if (Array.isArray(legacyAudit)) {
            legacyAudit.slice(0, 50).forEach(a => { const id = a.id || uid('log'); this.auditMap[id] = { ...a, id }; });
          }
        }
        this.saveLocal();
      }

      seedInitialTasks() {
        return [
          normTask({
            id: 'welcome_rabbi',
            title: 'חיפוש ותיאום רב לחתונה',
            category: 'wedding',
            assignee: 'both',
            priority: 'high',
            dueDate: todayISO(3),
            notes: 'בדיקת צהר / רב מוסמך ותיאום פגישת היכרות',
            subtasks: [
              { id: 's_1', title: 'איסוף 3 המלצות לרבנים', done: false },
              { id: 's_2', title: 'שיחת היכרות וסגירת תאריך', done: false }
            ]
          }),
          normTask({
            id: 'welcome_tami4',
            title: 'תזכורת לביטול מנוי שנתי תמי 4 לפני חידוש',
            category: 'bills',
            assignee: 'ronen',
            priority: 'medium',
            dueDate: '2027-01-03',
            dueTime: '10:00',
            notes: 'המנוי השנתי מסתיים ב-8.1.2027 — ללחוץ על כפתור היומן (.ics) כדי לקבל התראה בטוחה'
          })
        ];
      }

      get tasksList() { return Object.values(this.tasksMap); }
      get expensesList() {
        return Object.values(this.expensesMap).sort((a, b) => (b.date + b.updatedAt).localeCompare(a.date + a.updatedAt));
      }
      get auditList() {
        return Object.values(this.auditMap).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 60);
      }

      saveLocal() {
        localStorage.setItem(KEYS.TASKS, JSON.stringify(this.tasksMap));
        localStorage.setItem(KEYS.EXPENSES, JSON.stringify(this.expensesMap));
        localStorage.setItem(KEYS.AUDIT, JSON.stringify(this.auditMap));
        localStorage.setItem(KEYS.SETTINGS, JSON.stringify(this.settings));
      }

      applyTheme() {
        document.documentElement.classList.toggle('dark', this.darkMode);
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', this.darkMode ? '#0b1120' : '#f4f6fb');
      }

      checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const cUrl = params.get('cloud');
        if (cUrl) {
          this.cloudUrl = decodeURIComponent(cUrl).replace(/\/$/, '');
          localStorage.setItem(KEYS.CLOUD, this.cloudUrl);
          window.history.replaceState({}, '', window.location.pathname);
          setTimeout(() => this.toast('חיבור הענן נשמר אוטומטית במכשיר! ☁️', 'emerald'), 300);
        }
      }

      setCloudStatus(status) {
        if (this.cloudStatus === status) return;
        this.cloudStatus = status;
        this.renderHeader();
      }

      hydrateFromCloudRoot(root) {
        if (!root || typeof root !== 'object') return;
        this.tasksMap = {};
        if (root.tasks && typeof root.tasks === 'object') {
          Object.entries(root.tasks).forEach(([k, v]) => {
            if (v) { const t = normTask({ ...v, id: v.id || k }, this.user); this.tasksMap[t.id] = t; }
          });
        }
        this.expensesMap = {};
        if (root.expenses && typeof root.expenses === 'object') {
          Object.entries(root.expenses).forEach(([k, v]) => {
            if (v) { const e = normExpense({ ...v, id: v.id || k }); this.expensesMap[e.id] = e; }
          });
        }
        if (root.audit && typeof root.audit === 'object') {
          this.auditMap = {};
          Object.entries(root.audit).forEach(([k, v]) => { if (v) this.auditMap[k] = v; });
        }
        this.saveLocal();
        // רינדור מבודד — לעולם לא הורס Sheet פתוח
        this.renderHeader();
        this.renderMainPreservingFocus();
      }

      applyCloudStreamDelta(path, data, isPatch) {
        if (path === '/') {
          if (isPatch && data && typeof data === 'object') {
            if (data.tasks !== undefined) this.applyCloudStreamDelta('/tasks', data.tasks, false);
            if (data.expenses !== undefined) this.applyCloudStreamDelta('/expenses', data.expenses, false);
            if (data.audit !== undefined) this.applyCloudStreamDelta('/audit', data.audit, false);
          } else if (data) {
            this.hydrateFromCloudRoot(data);
          }
          return;
        }

        const parts = path.split('/').filter(Boolean);
        const col = parts[0];
        const id = parts[1];
        const map = col === 'tasks' ? this.tasksMap : col === 'expenses' ? this.expensesMap : col === 'audit' ? this.auditMap : null;
        if (!map) return;

        if (parts.length === 1) {
          const target = {};
          if (data && typeof data === 'object') {
            Object.entries(data).forEach(([k, v]) => {
              if (!v) return;
              target[k] = col === 'tasks' ? normTask({ ...v, id: k }, this.user) : col === 'expenses' ? normExpense({ ...v, id: k }) : v;
            });
          }
          if (col === 'tasks') this.tasksMap = target;
          else if (col === 'expenses') this.expensesMap = target;
          else this.auditMap = target;
        } else if (parts.length === 2) {
          if (data === null) {
            delete map[id];
          } else {
            const merged = isPatch && map[id] ? { ...map[id], ...data } : data;
            map[id] = col === 'tasks' ? normTask({ ...merged, id }, this.user) : col === 'expenses' ? normExpense({ ...merged, id }) : merged;
          }
        } else if (parts.length >= 3 && map[id]) {
          // עדכון שדה פנימי
          const field = parts[2];
          map[id] = { ...map[id], [field]: data };
          if (col === 'tasks') map[id] = normTask(map[id], this.user);
          if (col === 'expenses') map[id] = normExpense(map[id]);
        }

        this.saveLocal();
        this.renderHeader();
        this.renderMainPreservingFocus();
      }

      logAudit(action, detail = '') {
        const entry = {
          id: uid('log'),
          ts: Date.now(),
          actorId: this.user,
          actorName: USERS[this.user].name,
          actorAvatar: USERS[this.user].avatar,
          action,
          detail,
          time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
          date: formatShortHebDate(todayISO(0))
        };
        this.auditMap[entry.id] = entry;
        // שמירת מקסימום 70 רשומות לוקאלית
        const sorted = Object.values(this.auditMap).sort((a, b) => (b.ts || 0) - (a.ts || 0));
        if (sorted.length > 70) {
          sorted.slice(70).forEach(old => delete this.auditMap[old.id]);
        }
        this.cloud.atomicWrite('audit', entry.id, entry);
      }

      saveTask(task, auditVerb = 'עדכן/ה משימה') {
        const clean = normTask({ ...task, updatedAt: new Date().toISOString() }, this.user);
        this.tasksMap[clean.id] = clean;
        this.logAudit(auditVerb, clean.title);
        this.saveLocal();
        this.cloud.atomicWrite('tasks', clean.id, clean);
        this.renderMainPreservingFocus();
        this.renderHeader();
      }

      deleteTask(id) {
        const t = this.tasksMap[id];
        if (!t) return;
        delete this.tasksMap[id];
        if (this.expandedTaskId === id) this.expandedTaskId = null;
        this.logAudit('מחק/ה משימה', t.title);
        this.saveLocal();
        this.cloud.atomicWrite('tasks', id, null);
        this.renderMainPreservingFocus();
        this.renderHeader();
      }

      saveExpense(exp, auditVerb = 'רשם/ה הוצאה') {
        const clean = normExpense({ ...exp, updatedAt: new Date().toISOString() });
        this.expensesMap[clean.id] = clean;
        this.logAudit(auditVerb, `${clean.title} (${formatILS(clean.amountAgorot)})`);
        this.saveLocal();
        this.cloud.atomicWrite('expenses', clean.id, clean);
        this.renderMainPreservingFocus();
        this.renderHeader();
      }

      deleteExpense(id) {
        const e = this.expensesMap[id];
        if (!e) return;
        delete this.expensesMap[id];
        this.logAudit('מחק/ה הוצאה', e.title);
        this.saveLocal();
        this.cloud.atomicWrite('expenses', id, null);
        this.renderMainPreservingFocus();
        this.renderHeader();
      }

      startNotificationLoop() {
        const check = () => AlertEngine.checkBrowserNotifications(this.tasksList, this.settings);
        setTimeout(check, 2000);
        setInterval(check, 60000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') check();
        });
      }

      toast(msg, tone = 'dark', actionBtn = null) {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        const bg = tone === 'emerald' ? 'bg-emerald-600'
          : tone === 'indigo' ? 'bg-indigo-600'
          : tone === 'amber' ? 'bg-amber-600'
          : tone === 'rose' ? 'bg-rose-600'
          : 'bg-slate-900';
        el.className = `${bg} text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs sm:text-sm font-bold flex items-center justify-between gap-3 pointer-events-auto anim-sheet w-full`;
        el.innerHTML = `<span class="flex-1">${esc(msg)}</span>${
          actionBtn ? `<button type="button" class="px-2.5 py-1 rounded-lg bg-white/20 hover:bg-white/30 text-xs font-extrabold shrink-0 cursor-pointer">${esc(actionBtn.label)}</button>` : ''
        }`;
        if (actionBtn) {
          el.querySelector('button').addEventListener('click', () => {
            actionBtn.onClick();
            el.remove();
          });
        }
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-8px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, actionBtn ? 5500 : 3200);
      }

      // =======================================================================
      // רינדור שכבות הממשק
      // =======================================================================
      renderAll() {
        this.renderHeader();
        this.renderMain();
        this.renderNav();
        this.renderSheet();
      }

      renderMainPreservingFocus() {
        const active = document.activeElement;
        const activeId = active?.id || '';
        const isTypingInMain = active && document.getElementById('main-root')?.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
        const val = isTypingInMain ? active.value : null;
        const selStart = isTypingInMain ? active.selectionStart : null;

        this.renderMain();

        if (isTypingInMain && activeId) {
          const restored = document.getElementById(activeId);
          if (restored) {
            restored.value = val;
            restored.focus();
            if (selStart !== null && restored.setSelectionRange) {
              try { restored.setSelectionRange(selStart, selStart); } catch {}
            }
          }
        }
      }

                  <span>${USERS[this.user].avatar}</span>

      renderNav() {
        document.getElementById('nav-root').innerHTML = `

      renderMain() {
        const main = document.getElementById('main-root');
        if (this.tab === 'home') main.innerHTML = this.buildHomeView();
        else if (this.tab === 'wallet') main.innerHTML = this.buildWalletView();
        else main.innerHTML = this.buildHubView();
