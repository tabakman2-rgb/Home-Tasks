      // =======================================================================
      // 9. ניהול אירועים, קיצורי מקלדת ומחוות Swipe
      // =======================================================================
      bindEvents() {
        window.addEventListener('beforeunload', () => this.saveLocalImmediate());

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && this.sheet) { this.sheet = null; this.renderSheet(); return; }
          const tag = document.activeElement?.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if ((e.key === 'n' || e.key === 'N' || e.key === 'מ') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.openQuickSheet('task'); }
          else if ((e.key === 'e' || e.key === 'E') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.openQuickSheet('expense'); }
        });

        // Swipe חלק במובייל
        let sx = 0, sy = 0, swEl = null, swId = null, swActive = false;
        document.addEventListener('touchstart', e => {
          if (e.touches.length !== 1 || e.target.closest('button,input,textarea,select,a,label')) return;
          const card = e.target.closest('[data-swipe-id]');
          if (!card) return;
          sx = e.touches[0].clientX; sy = e.touches[0].clientY;
          swEl = card; swId = card.dataset.swipeId; swActive = false;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
          if (!swEl) return;
          const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
          if (!swActive) {
            if (Math.abs(dy) > 14 && Math.abs(dy) >= Math.abs(dx)) { swEl = null; return; }
            if (Math.abs(dx) > 22 && Math.abs(dx) > Math.abs(dy) * 1.4) swActive = true;
          }
          if (swActive) swEl.style.transform = `translateX(${Math.max(-88, Math.min(88, dx))}px)`;
        }, { passive: true });

        document.addEventListener('touchend', e => {
          if (!swEl) return;
          const dx = e.changedTouches[0].clientX - sx;
          swEl.style.transform = '';
          const id = swId, was = swActive;
          swEl = null; swId = null; swActive = false;
          if (was && dx > 74) this.toggleTaskDone(id);
          else if (was && dx < -74) this.snoozeTaskToTomorrow(id);
        });

        // Input events
        document.addEventListener('input', e => {
          const id = e.target.id;
          if (id === 'home-search-input') { this.taskFilters.q = e.target.value; this.renderMainPreservingFocus(); }
          else if (id === 'qa-task-input') this.updateQuickTaskNLP(e.target.value);
          else if (id === 'qa-exp-amount') {
            this.quickExpenseDraft.amountStr = e.target.value;
            this.updateExpenseImpactLive();
          } else if (id === 'qa-exp-title') {
            this.quickExpenseDraft.title = e.target.value;
          } else if (id === 'qa-exp-custom-ronen') {
            const ed = this.quickExpenseDraft;
            ed.customRonenStr = e.target.value;
            const totalILS = (parseFloat(ed.amountStr) || 0) * (ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1));
            const rVal = Math.min(totalILS, Math.max(0, parseFloat(e.target.value) || 0));
            const adiVal = Math.max(0, +(totalILS - rVal).toFixed(2));
            ed.customAdiStr = totalILS > 0 ? String(adiVal) : '';
            const adiIn = document.getElementById('qa-exp-custom-adi');
            if (adiIn) adiIn.value = ed.customAdiStr;
            this.updateExpenseImpactLive();
          } else if (id === 'qa-exp-custom-adi') {
            const ed = this.quickExpenseDraft;
            ed.customAdiStr = e.target.value;
            const totalILS = (parseFloat(ed.amountStr) || 0) * (ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1));
            const aVal = Math.min(totalILS, Math.max(0, parseFloat(e.target.value) || 0));
            const rVal = Math.max(0, +(totalILS - aVal).toFixed(2));
            ed.customRonenStr = totalILS > 0 ? String(rVal) : '';
            const ronIn = document.getElementById('qa-exp-custom-ronen');
            if (ronIn) ronIn.value = ed.customRonenStr;
            this.updateExpenseImpactLive();
          } else if (id === 'wa-import-box') {
            this.waRawInput = e.target.value;
          }
        });

        // Change events
        document.addEventListener('change', e => {
          const el = e.target;
          if (el.id === 'home-cat-select') { this.taskFilters.category = el.value; this.renderMain(); }
          else if (el.id === 'qa-date-manual') { this.quickTaskDraft.dueDate = el.value; this.quickTaskDraft.touched.date = true; this.syncQuickSheetUI(); }
          else if (el.id === 'qa-time-manual') { this.quickTaskDraft.dueTime = el.value; this.quickTaskDraft.touched.time = true; }
          else if (el.id === 'qa-remind-lead') { this.quickTaskDraft.remindLead = Number(el.value); }
          else if (el.id === 'qa-exp-cat-sel') { this.quickExpenseDraft.category = el.value; }
          else if (el.id === 'qa-exp-date') { this.quickExpenseDraft.date = el.value || todayISO(0); }
          else if (el.id === 'ed-dueDate') { this.syncEditTaskDateChips(); }
          else if (el.id === 'ee-split') { this.syncEditExpenseCustomVisibility(); }
          else if (el.id === 'import-json-file') {
            const f = el.files?.[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => this.mergeExternalJSON(r.result);
            r.readAsText(f);
          } else if (el.dataset.waIdx !== undefined) {
            const item = this.waDrafts[Number(el.dataset.waIdx)];
            if (!item) return;
            if (el.dataset.waField === 'title') item.title = el.value;
            else if (el.dataset.waField === 'mode') {
              if (el.value === 'NEW') item.targetType = 'new_task';
              else if (el.value === 'EXPENSE') item.targetType = 'expense';
              else { item.targetType = 'subtask'; item.parentTaskId = el.value; }
            }
          }
        });

        // Submit events
        document.addEventListener('submit', e => {
          const form = e.target;
          if (form.dataset.subForm) {
            e.preventDefault();
            const tid = form.dataset.subForm;
            const title = document.getElementById(`sub-input-${tid}`)?.value.trim();
            if (!title || !this.tasksMap[tid]) return;
            const t = this.tasksMap[tid];
            this.saveTask({ ...t, subtasks: [...(t.subtasks || []), { id: uid('s'), title, done: false }] }, `הוסיף/ה שלב ("${title}")`);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            setTimeout(() => document.getElementById(`sub-input-${tid}`)?.focus(), 10);
            return;
          }

          if (form.id === 'quick-task-form') {
            e.preventDefault();
            const raw = document.getElementById('qa-task-input')?.value.trim();
            if (!raw) return;
            const p = NLPEngine.parseQuickTaskInput(raw);
            const td = this.quickTaskDraft;
            const dueTime = document.getElementById('qa-time-manual')?.value || td.dueTime || p.dueTime;
            let dueDate = document.getElementById('qa-date-manual')?.value || (td.touched.date ? td.dueDate : (td.dueDate || p.dueDate));
            if (dueTime && !dueDate) dueDate = todayISO(0);

            const task = normTask({
              title: p.cleanTitle || raw,
              assignee: td.touched.assignee ? td.assignee : (p.assignee || td.assignee),
              category: td.touched.category ? td.category : (p.category || td.category),
              priority: td.touched.priority ? td.priority : (p.priority || td.priority),
              dueDate,
              dueTime,
              remindLead: Number(document.getElementById('qa-remind-lead')?.value ?? td.remindLead),
              estimatedBudget: p.estimatedBudget || td.estimatedBudget
            }, this.user);

            this.sheet = null; this.renderSheet();
            this.saveTask(task, 'הוסיף/ה משימה');
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            if (this.settings.ntfyTopic && this.settings.ntfyOnAssign && task.assignee !== this.user) {
              AlertEngine.sendNtfyPush(this.settings.ntfyTopic, `⚡ ${USERS[this.user].name} הוסיף/ה: ${task.title}${task.dueDate ? ' (' + formatShortHebDate(task.dueDate) + (task.dueTime ? ' ' + task.dueTime : '') + ')' : ''}`);
            }
            this.toast(`נוספה משימה: "${task.title}"`, 'indigo');
            return;
          }

          if (form.id === 'quick-expense-form') {
            e.preventDefault();
            const ed = this.quickExpenseDraft;
            const amt = parseFloat(document.getElementById('qa-exp-amount')?.value || '0');
            const title = document.getElementById('qa-exp-title')?.value.trim();
            if (!title || !(amt > 0)) return;
            const rate = ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1);
            const agorot = Math.round(amt * rate * 100);
            const exp = normExpense({
              ...ed,
              title,
              category: document.getElementById('qa-exp-cat-sel')?.value || ed.category,
              date: document.getElementById('qa-exp-date')?.value || todayISO(0),
              amountAgorot: agorot, originalAmount: amt, rateUsed: rate,
              ronenShareAgorot: ed.splitType === 'custom' ? Math.round((parseFloat(ed.customRonenStr) || 0) * 100) : 0,
              createdBy: this.user
            });

            this.sheet = null; this.renderSheet();
            this.saveExpense(exp, 'רשם/ה הוצאה');
            FeedbackEngine.play('coin', this.settings.soundEnabled);
            if (this.settings.ntfyTopic && this.settings.ntfyOnExpense && exp.paymentMethod === 'personal') {
              const fin = FinanceEngine.computeSummary(this.expensesList);
              AlertEngine.sendNtfyPush(this.settings.ntfyTopic, `💸 ${USERS[this.user].name} רשם/ה: ${exp.title} (${formatILS(exp.amountAgorot)}). מאזן: ${fin.direction.shortText}`);
            }
            this.toast(`נרשמה הוצאה: ${exp.title} (${formatILS(exp.amountAgorot)})`, 'emerald');
            return;
          }

          if (form.id === 'edit-task-form' && this.editingTask) {
            e.preventDefault();
            const dueTime = document.getElementById('ed-dueTime').value;
            let dueDate = document.getElementById('ed-dueDate').value;
            if (dueTime && !dueDate) dueDate = todayISO(0);
            const updated = {
              ...this.editingTask,
              title: document.getElementById('ed-title').value.trim(),
              assignee: document.getElementById('ed-assignee').value,
              category: document.getElementById('ed-category').value,
              priority: document.getElementById('ed-priority').value,
              dueDate, dueTime,
              remindLead: Number(document.getElementById('ed-remindLead').value),
              estimatedBudget: Number(document.getElementById('ed-budget').value) || 0,
              link: document.getElementById('ed-link').value.trim(),
              notes: document.getElementById('ed-notes').value.trim(),
              subtasks: this.readEditSubtasksFromDOM()
            };
            this.sheet = null; this.editingTask = null; this.renderSheet();
            this.saveTask(updated, 'ערך/ה משימה');
            this.toast('המשימה עודכנה! ✏️', 'emerald');
            return;
          }

          if (form.id === 'edit-expense-form' && this.editingExpense) {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('ee-amount').value || '0');
            if (!(amt > 0)) return;
            const splitType = document.getElementById('ee-split').value;
            const ronenCustom = Math.round((parseFloat(document.getElementById('ee-custom-ronen')?.value || '0')) * 100);
            const updated = {
              ...this.editingExpense,
              title: document.getElementById('ee-title').value.trim(),
              amountAgorot: Math.round(amt * 100), originalAmount: amt, currency: 'ILS',
              date: document.getElementById('ee-date').value || todayISO(0),
              paymentMethod: document.getElementById('ee-method').value,
              paidBy: document.getElementById('ee-payer').value,
              splitType, ronenShareAgorot: splitType === 'custom' ? ronenCustom : 0,
              category: document.getElementById('ee-cat').value
            };
            this.sheet = null; this.editingExpense = null; this.renderSheet();
            this.saveExpense(updated, 'ערך/ה הוצאה');
            this.toast('ההוצאה עודכנה!', 'emerald');
            return;
          }

          if (form.id === 'settle-form') {
            e.preventDefault();
            const amt = parseFloat(document.getElementById('st-amount').value || '0');
            const paidBy = document.getElementById('st-payer').value;
            const sendWa = document.getElementById('st-send-wa')?.checked;
            if (!(amt > 0)) return;
            const set = normExpense({
              title: `העברת התחשבנות (${USERS[paidBy].name} ← ${paidBy === 'adi' ? 'רונן' : 'עדי'})`,
              amountAgorot: Math.round(amt * 100), paymentMethod: 'personal', paidBy,
              splitType: 'settlement', category: 'bills', date: todayISO(0), createdBy: this.user
            });
            this.sheet = null; this.renderSheet();
            this.saveExpense(set, 'סגר/ה התחשבנות');
            FeedbackEngine.play('complete', this.settings.soundEnabled);
            FeedbackEngine.confetti();
            this.toast('ההעברה נרשמה והמאזן עודכן! 🤝', 'emerald');
            if (sendWa) {
              const msg = `🤝 סגרנו התחשבנות! נרשמה העברה של ${formatILS(set.amountAgorot)} (${USERS[paidBy].name} ← ${paidBy === 'adi' ? 'רונן' : 'עדי'}). המאזן התעדכן באפליקציה ✨`;
              window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            }
          }
        });

        // Click delegation
        document.addEventListener('click', e => {
          if (e.target.id === 'sheet-backdrop') { this.sheet = null; this.renderSheet(); return; }
          const btn = e.target.closest('[data-act]');
          if (!btn) return;
          const act = btn.dataset.act;

          if (act === 'close-sheet') { this.sheet = null; this.renderSheet(); return; }
          if (act === 'tab') {
            this.tab = btn.dataset.tab;
            this.renderHeader(); this.renderMain(); this.renderNav();
            window.scrollTo(0, 0);
            return;
          }
          if (act === 'toggle-user') {
            this.user = this.user === 'ronen' ? 'adi' : 'ronen';
            localStorage.setItem(KEYS.USER, this.user);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            this.renderHeader();
            this.toast(`משתמש פעיל: ${USERS[this.user].avatar} ${USERS[this.user].name}`);
            return;
          }
          if (act === 'toggle-sound') {
            this.settings.soundEnabled = !this.settings.soundEnabled;
            this.saveLocal();
            if (this.sheet === 'tools') this.renderSheet();
            this.toast(this.settings.soundEnabled ? 'צלילים הופעלו 🔊' : 'צלילים הושתקו 🔇');
            return;
          }
          if (act === 'toggle-theme') {
            this.darkMode = !this.darkMode;
            localStorage.setItem(KEYS.THEME, this.darkMode ? 'dark' : 'light');
            this.applyTheme(); this.renderHeader(); return;
          }
          if (act === 'open-quick') { this.openQuickSheet(btn.dataset.mode || 'task'); return; }
          if (act === 'open-sheet') { this.sheet = btn.dataset.sheet; this.renderSheet(); return; }

          // Quick Add instant in-place updates
          if (act === 'quick-mode') {
            this.quickMode = btn.dataset.mode;
            this.syncQuickSheetUI();
            document.getElementById(this.quickMode === 'task' ? 'qa-task-input' : 'qa-exp-amount')?.focus();
            return;
          }
          if (act === 'qa-date-chip') {
            const days = Number(btn.dataset.days);
            this.quickTaskDraft.touched.date = true;
            if (days === -1) this.quickTaskDraft.dueDate = '';
            else {
              const target = todayISO(days);
              this.quickTaskDraft.dueDate = this.quickTaskDraft.dueDate === target ? '' : target;
            }
            this.syncQuickSheetUI();
            return;
          }
          if (act === 'qa-assignee') { this.quickTaskDraft.assignee = btn.dataset.val; this.quickTaskDraft.touched.assignee = true; this.syncQuickSheetUI(); return; }
          if (act === 'qa-priority') { this.quickTaskDraft.priority = btn.dataset.val; this.quickTaskDraft.touched.priority = true; this.syncQuickSheetUI(); return; }
          if (act === 'qa-cat') { this.quickTaskDraft.category = btn.dataset.val; this.quickTaskDraft.touched.category = true; this.syncQuickSheetUI(); return; }
          if (act === 'qa-attach-parent') {
            const pid = btn.dataset.parentId;
            const raw = document.getElementById('qa-task-input')?.value.trim();
            if (!pid || !raw || !this.tasksMap[pid]) return;
            const clean = raw.replace(/^(>|תת:|\+)\s*/, '').trim();
            const parent = this.tasksMap[pid];
            this.sheet = null; this.renderSheet();
            this.saveTask({ ...parent, subtasks: [...(parent.subtasks || []), { id: uid('s'), title: clean, done: false }] }, `הוסיף/ה שלב תחת "${parent.title}"`);
            FeedbackEngine.play('pop', this.settings.soundEnabled);
            this.toast(`שויך כשלב תחת "${parent.title}" 🧠`, 'indigo');
            return;
          }
          if (act === 'voice-input') {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            const rec = new SR(); rec.lang = 'he-IL'; rec.interimResults = false;
            this.toast('מקשיב בעברית... 🎤', 'indigo');
            rec.onresult = ev => {
              const spoken = ev.results?.[0]?.[0]?.transcript || '';
              const inp = document.getElementById('qa-task-input');
              if (inp && spoken) { inp.value = spoken; this.updateQuickTaskNLP(spoken); }
            };
            rec.onerror = () => this.toast('לא זוהתה הקלטה', 'amber');
            rec.start();
            return;
          }
          if (act === 'qa-exp-preset') {
            const pr = EXPENSE_PRESETS[Number(btn.dataset.idx)];
            if (!pr) return;
            this.quickExpenseDraft.title = pr.title;
            this.quickExpenseDraft.category = pr.category;
            const inp = document.getElementById('qa-exp-title');
            if (inp) inp.value = pr.title;
            this.syncQuickSheetUI();
            return;
          }
          if (act === 'qa-exp-curr') {
            const ord = ['ILS', 'EUR', 'USD'];
            this.quickExpenseDraft.currency = ord[(ord.indexOf(this.quickExpenseDraft.currency) + 1) % ord.length];
            this.syncQuickSheetUI(); return;
          }
          if (act === 'qa-exp-pay') {
            this.quickExpenseDraft.paymentMethod = btn.dataset.method;
            this.quickExpenseDraft.paidBy = btn.dataset.payer;
            this.syncQuickSheetUI(); return;
          }
          if (act === 'qa-exp-split') {
            this.quickExpenseDraft.splitType = btn.dataset.val;
            if (btn.dataset.val === 'custom') {
              const ed = this.quickExpenseDraft;
              const totalILS = (parseFloat(ed.amountStr) || 0) * (ed.currency === 'ILS' ? 1 : (Number(this.settings.rates[ed.currency]) || 1));
              if (totalILS > 0 && !ed.customRonenStr) {
                const half = +(totalILS / 2).toFixed(2);
                ed.customRonenStr = String(half);
                ed.customAdiStr = String(+(totalILS - half).toFixed(2));
                const rIn = document.getElementById('qa-exp-custom-ronen');
                const aIn = document.getElementById('qa-exp-custom-adi');
                if (rIn) rIn.value = ed.customRonenStr;
                if (aIn) aIn.value = ed.customAdiStr;
              }
            }
            this.syncQuickSheetUI(); return;
          }

          // Edit task controls
          if (act === 'ed-date-chip') {
            const days = Number(btn.dataset.days);
            const inp = document.getElementById('ed-dueDate');
            if (inp) {
              const target = days === -1 ? '' : todayISO(days);
              inp.value = inp.value === target ? '' : target;
              this.syncEditTaskDateChips();
            }
            return;
          }
          if (act === 'ed-add-sub' && this.editingTask) {
            this.editingTask.subtasks = [...this.readEditSubtasksFromDOM(), { id: uid('s'), title: '', done: false }];
            const box = document.getElementById('ed-subs-list');
            if (box) { box.innerHTML = this.buildEditSubtasksHTML(this.editingTask.subtasks); const ins = box.querySelectorAll('.ed-sub-title'); ins[ins.length - 1]?.focus(); }
            return;
          }
          if (act === 'ed-del-sub' && this.editingTask) {
            const cur = this.readEditSubtasksFromDOM(); cur.splice(Number(btn.dataset.idx), 1);
            this.editingTask.subtasks = cur;
            const box = document.getElementById('ed-subs-list');
            if (box) box.innerHTML = this.buildEditSubtasksHTML(cur);
            return;
          }

          // Home actions
          if (act === 'toggle-radar-filter') { this.taskFilters.radarOnly = !this.taskFilters.radarOnly; this.renderMain(); return; }
          if (act === 'filter-who') { this.taskFilters.who = btn.dataset.val; this.renderMain(); return; }
          if (act === 'toggle-search') {
            this.showSearchBar = !this.showSearchBar;
            if (!this.showSearchBar) this.taskFilters.q = '';
            this.renderMain();
            if (this.showSearchBar) setTimeout(() => document.getElementById('home-search-input')?.focus(), 20);
            return;
          }
          if (act === 'toggle-done-section') { this.showDoneSection = !this.showDoneSection; this.renderMain(); return; }
          if (act === 'expand-task') { this.expandedTaskId = this.expandedTaskId === btn.dataset.id ? null : btn.dataset.id; this.renderMain(); return; }
          if (act === 'toggle-task') { this.toggleTaskDone(btn.dataset.id); return; }
          if (act === 'snooze-task') { this.snoozeTaskToTomorrow(btn.dataset.id); return; }
          if (act === 'pin-task') { const t = this.tasksMap[btn.dataset.id]; if (t) this.saveTask({ ...t, pinned: !t.pinned }, t.pinned ? 'שחרר/ה נעיצה' : 'נעץ/ה משימה'); return; }
          if (act === 'react-task') {
            const t = this.tasksMap[btn.dataset.id]; if (!t) return;
            const cyc = ['', '❤️', '🔥', '👏', '🎉'];
            const next = cyc[(cyc.indexOf(t.reaction || '') + 1) % cyc.length];
            this.saveTask({ ...t, reaction: next }, next ? `פרגן/ה ${next}` : 'הסיר/ה תגובה');
            FeedbackEngine.play('pop', this.settings.soundEnabled); return;
          }
          if (act === 'toggle-sub') {
            const t = this.tasksMap[btn.dataset.id]; if (!t) return;
            this.saveTask({ ...t, subtasks: (t.subtasks || []).map(s => s.id === btn.dataset.sub ? { ...s, done: !s.done } : s) }, 'עדכן/ה שלב');
            FeedbackEngine.play('pop', this.settings.soundEnabled); return;
          }
          if (act === 'del-sub') {
            const t = this.tasksMap[btn.dataset.id]; if (!t) return;
            this.saveTask({ ...t, subtasks: (t.subtasks || []).filter(s => s.id !== btn.dataset.sub) }, 'מחק/ה שלב'); return;
          }
          if (act === 'del-task') { this.deleteTask(btn.dataset.id); return; }
          if (act === 'open-edit-task') { const t = this.tasksMap[btn.dataset.id]; if (!t) return; this.editingTask = JSON.parse(JSON.stringify(t)); this.sheet = 'edit-task'; this.renderSheet(); return; }
          if (act === 'task-to-expense') {
            const t = this.tasksMap[btn.dataset.id]; if (!t) return;
            this.quickMode = 'expense';
            this.quickExpenseDraft = this.freshExpenseDraft({ title: t.title, amountStr: t.estimatedBudget > 0 ? String(t.estimatedBudget) : '', category: t.category, linkedTaskId: t.id });
            this.sheet = 'quick-add'; this.renderSheet(); return;
          }
          if (act === 'ics-single') { const t = this.tasksMap[btn.dataset.id]; if (t && AlertEngine.downloadICS([t], `task-${t.id}.ics`)) this.toast('קובץ ליומן ירד — פתח אותו להתראה בטוחה! 📅', 'indigo'); return; }
          if (act === 'ics-all') { if (AlertEngine.downloadICS(this.tasksList, 'ronen-adi-deadlines.ics')) this.toast('כל הדדליינים יוצאו ליומן (.ics)! 📅', 'emerald'); else this.toast('אין משימות פתוחות עם תאריך יעד', 'amber'); return; }
          if (act === 'wa-single') {
            const t = this.tasksMap[btn.dataset.id]; if (!t) return;
            const subs = (t.subtasks || []).map(s => `${s.done ? '✅' : '▫️'} ${s.title}`).join('\n');
            const msg = `⚡ *${t.title}*\nאחראי: ${USERS[t.assignee].name}${t.dueDate ? '\n📅 ' + formatShortHebDate(t.dueDate) + (t.dueTime ? ' ' + t.dueTime : '') : ''}${t.notes ? '\n📝 ' + t.notes : ''}${subs ? '\n\n*שלבים:*\n' + subs : ''}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank'); return;
          }

          // Wallet actions
          if (act === 'wallet-tab') { this.walletTab = btn.dataset.val; this.renderMain(); return; }
          if (act === 'toggle-settled-history') { this.showSettledHistory = !this.showSettledHistory; this.renderMain(); return; }
          if (act === 'open-edit-expense') { const ex = this.expensesMap[btn.dataset.id]; if (!ex) return; this.editingExpense = JSON.parse(JSON.stringify(ex)); this.sheet = 'edit-expense'; this.renderSheet(); return; }
          if (act === 'del-expense') { this.deleteExpense(btn.dataset.id); return; }
          if (act === 'wa-send-balance') { this.waShareMode = 'balance'; this.sheet = 'wa-share'; this.renderSheet(); return; }

          // Tools & Modals actions
          if (act === 'toggle-tools-audit') {
            this.showToolsAudit = !this.showToolsAudit;
            document.getElementById('tools-audit-list')?.classList.toggle('hidden', !this.showToolsAudit);
            return;
          }
          if (act === 'req-notif-perm') {
            if (!('Notification' in window)) { this.toast('הדפדפן לא תומך — השתמש ב-.ics או ntfy', 'amber'); return; }
            Notification.requestPermission().then(p => {
              if (this.sheet === 'tools') this.renderSheet();
              if (p === 'granted') { new Notification('⚡ Pulse Duo מוכן!', { body: 'תקבל התראות כשדדליינים מתקרבים.' }); this.toast('התראות הופעלו! 🔔', 'emerald'); }
              else this.toast('התראות נחסמו — אפשר להשתמש ב-.ics או ntfy', 'amber');
            }); return;
          }
          if (act === 'save-ntfy') { this.settings.ntfyTopic = document.getElementById('hub-ntfy-topic')?.value.trim() || ''; this.saveLocal(); this.toast(this.settings.ntfyTopic ? 'ערוץ ntfy נשמר! 📱' : 'ערוץ ntfy נוקה', 'emerald'); return; }
          if (act === 'test-ntfy') {
            const topic = document.getElementById('hub-ntfy-topic')?.value.trim() || this.settings.ntfyTopic;
            if (!topic) { this.toast('הזן קודם שם ערוץ סודי', 'amber'); return; }
            AlertEngine.sendNtfyPush(topic, '⚡ בדיקת Push מ-Pulse Duo — עובד מעולה!').then(ok => this.toast(ok ? 'הודעת בדיקה נשלחה! 📱' : 'שגיאה בשליחה ל-ntfy', ok ? 'emerald' : 'rose')); return;
          }
          if (act === 'save-rates') {
            const eur = parseFloat(document.getElementById('rate-eur')?.value), usd = parseFloat(document.getElementById('rate-usd')?.value);
            if (eur > 0) this.settings.rates.EUR = eur;
            if (usd > 0) this.settings.rates.USD = usd;
            this.saveLocal(); this.toast('שערי המטבע עודכנו! 💱', 'emerald'); return;
          }
          if (act === 'export-json') {
            const blob = new Blob([JSON.stringify({ version: '5.0', exportedAt: new Date().toISOString(), tasks: this.tasksList, expenses: this.expensesList }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pulse-duo-backup-${todayISO(0)}.json`; a.click();
            this.toast('קובץ גיבוי ירד 💾', 'emerald'); return;
          }
          if (act === 'analyze-wa') {
            this.waRawInput = document.getElementById('wa-import-box')?.value || '';
            this.waDrafts = NLPEngine.parseWhatsApp(this.waRawInput, this.tasksList);
            if (!this.waDrafts.length) this.toast('לא זוהו שורות טקסט תקינות', 'amber');
            const wrap = document.getElementById('wa-drafts-wrap');
            if (wrap) wrap.innerHTML = this.buildWaDraftsHTML(); return;
          }
          if (act === 'commit-wa') {
            let tc = 0, sc = 0, ec = 0;
            for (const d of this.waDrafts) {
              if (!d.title.trim()) continue;
              if (d.targetType === 'expense') { this.saveExpense(normExpense({ title: d.title, amountAgorot: Math.round((d.amount || 0) * 100), paidBy: d.paidBy, category: d.category, createdBy: this.user }), 'ייבא/ה הוצאה'); ec++; }
              else if (d.targetType === 'subtask' && d.parentTaskId && this.tasksMap[d.parentTaskId]) { const p = this.tasksMap[d.parentTaskId]; this.saveTask({ ...p, subtasks: [...(p.subtasks || []), { id: uid('s'), title: d.title.trim(), done: false }] }, 'ייבא/ה שלב'); sc++; }
              else { this.saveTask(normTask({ title: d.title, assignee: d.assignee, category: d.category, priority: d.priority, dueDate: d.dueDate, dueTime: d.dueTime, estimatedBudget: d.amount }, this.user), 'ייבא/ה משימה'); tc++; }
            }
            this.waDrafts = []; this.waRawInput = ''; this.sheet = null; this.renderSheet();
            this.toast(`יובאו: ${tc} משימות, ${sc} שלבים, ${ec} הוצאות 📥`, 'emerald'); return;
          }
          if (act === 'wa-share-mode') {
            this.waShareMode = btn.dataset.mode;
            document.querySelectorAll('[data-act="wa-share-mode"]').forEach(b => b.className = `chip ${b.dataset.mode === this.waShareMode ? 'active-emerald' : ''}`);
            const box = document.getElementById('wa-share-box');
            if (box) box.value = this.composeWaShareMsg(); return;
          }
          if (act === 'copy-wa-share') { this.copyText(document.getElementById('wa-share-box')?.value || ''); return; }
          if (act === 'send-wa-share') { window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('wa-share-box')?.value || '')}`, '_blank'); return; }
          if (act === 'copy-gemini') { this.copyText(document.getElementById('gemini-json-box')?.value || ''); return; }
          if (act === 'merge-gemini') { this.mergeExternalJSON(document.getElementById('gemini-json-box')?.value || ''); return; }
          if (act === 'save-cloud-url') {
            const val = document.getElementById('cloud-url-in')?.value.trim().replace(/\/$/, '') || '';
            this.cloudUrl = val; localStorage.setItem(KEYS.CLOUD, val);
            this.sheet = null; this.renderSheet();
            if (val) { this.cloud.connect(); this.toast('מתחבר לענן... ☁️', 'emerald'); }
            else { this.cloud.disconnect(); this.setCloudStatus('offline'); }
            return;
          }
          if (act === 'force-sync') {
            if (!this.cloudUrl) { this.toast('לא הוגדרה כתובת ענן', 'amber'); return; }
            this.cloud.connect(); this.toast('מסנכרן מול הענן... 🔄', 'indigo');
          }
        });
      }

      openQuickSheet(mode = 'task') {
        this.quickMode = mode;
        this.quickTaskDraft = this.freshTaskDraft();
        this.quickExpenseDraft = this.freshExpenseDraft();
        this.sheet = 'quick-add';
        this.renderSheet();
      }

      toggleTaskDone(id) {
        const t = this.tasksMap[id]; if (!t) return;
        const next = !t.done;
        this.saveTask({ ...t, done: next, completedBy: next ? this.user : null, completedAt: next ? new Date().toISOString() : null }, next ? 'סימן/ה כבוצע ✅' : 'פתח/ה מחדש');
        if (next) {
          FeedbackEngine.play('complete', this.settings.soundEnabled);
          if (t.priority === 'urgent' || t.priority === 'high') FeedbackEngine.confetti();
          if (t.estimatedBudget > 0 || ['shopping', 'wedding', 'trip', 'bills'].includes(t.category)) {
            this.toast(`כל הכבוד! "${t.title}" בוצע ✅`, 'emerald', {
              label: '💸 רשום הוצאה?',
              onClick: () => {
                this.quickMode = 'expense';
                this.quickExpenseDraft = this.freshExpenseDraft({ title: t.title, amountStr: t.estimatedBudget > 0 ? String(t.estimatedBudget) : '', category: t.category, linkedTaskId: t.id });
                this.sheet = 'quick-add'; this.renderSheet();
              }
            });
          }
        } else FeedbackEngine.play('pop', this.settings.soundEnabled);
      }

      snoozeTaskToTomorrow(id) {
        const t = this.tasksMap[id]; if (!t || t.done) return;
        this.saveTask({ ...t, dueDate: todayISO(1) }, 'דחה/תה למחר');
        FeedbackEngine.play('pop', this.settings.soundEnabled);
        this.toast(`"${t.title}" נדחה למחר ⏰`, 'amber');
      }

      mergeExternalJSON(rawStr) {
        try {
          const m = String(rawStr || '').match(/```(?:json)?\s*([\s\S]*?)```/i);
          const parsed = JSON.parse(m ? m[1] : rawStr);
          const tasks = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.tasks) ? parsed.tasks : []);
          const exps = Array.isArray(parsed.expenses) ? parsed.expenses : [];
          let tc = 0, ec = 0;
          for (const rt of tasks) { const nt = normTask(rt, this.user); this.tasksMap[nt.id] = nt; this.cloud.atomicWrite('tasks', nt.id, nt); tc++; }
          for (const re of exps) { const ne = normExpense(re); this.expensesMap[ne.id] = ne; this.cloud.atomicWrite('expenses', ne.id, ne); ec++; }
          this.logAudit('מיזג/ה JSON', `${tc} משימות, ${ec} הוצאות`);
          this.saveLocal(); this.sheet = null; this.renderAll();
          this.toast(`מוזגו: ${tc} משימות ו-${ec} הוצאות! 🔀`, 'emerald');
        } catch { this.toast('שגיאה בפענוח ה-JSON', 'rose'); }
      }

      copyText(txt) {
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => this.toast('הועתק ללוח! 📋', 'emerald'));
        else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); this.toast('הועתק ללוח! 📋', 'emerald'); }
      }
    }

    window.addEventListener('DOMContentLoaded', () => { window.__pulseDuo = new PulseDuoApp(); });
  </script>
</body>
</html>
