    function generateUniqueId(prefix = 'tsk') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).substring(2, 8)}`;
    }

    function escapeHtml(str = '') {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatHebrewDateTime(isoString) {
      if (!isoString) return '';
      try {
        return new Intl.DateTimeFormat('he-IL', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }).format(new Date(isoString));
      } catch {
        return isoString;
      }
    }

    function formatHebrewDateShort(dateString) {
      if (!dateString) return 'ללא תאריך יעד';
      try {
        return new Intl.DateTimeFormat('he-IL', {
          weekday: 'short', day: '2-digit', month: '2-digit'
        }).format(new Date(dateString));
      } catch {
        return dateString;
      }
    }

    function createNormalizedTask(rawInput = {}, activeUser = 'ronen') {
      const now = new Date().toISOString();
      const isDone = Boolean(rawInput.done || rawInput.status === 'done');
      const normalizedSubtasks = Array.isArray(rawInput.subtasks)
        ? rawInput.subtasks.map((st, idx) => ({
            id: st.id || generateUniqueId(`sub_${idx}`),
            title: String(st.title || '').trim(),
            done: Boolean(st.done),
            completedBy: st.completedBy || null,
            completedAt: st.completedAt || null
          })).filter(st => st.title.length > 0)
        : [];

      return {
        id: rawInput.id || generateUniqueId('task'),
        title: String(rawInput.title || 'משימה חדשה').trim(),
        category: CATEGORIES[rawInput.category] ? rawInput.category : 'home',
        assignee: USERS[rawInput.assignee] ? rawInput.assignee : 'both',
        priority: PRIORITIES[rawInput.priority] ? rawInput.priority : 'medium',
        status: isDone ? 'done' : (TASK_STATUSES[rawInput.status] ? rawInput.status : 'todo'),
        done: isDone,
        dueDate: rawInput.dueDate || '',
        estimatedBudget: Number(rawInput.estimatedBudget) || 0,
        actualCost: Number(rawInput.actualCost) || 0,
        notes: String(rawInput.notes || '').trim(),
        subtasks: normalizedSubtasks,
        createdBy: USERS[rawInput.createdBy] ? rawInput.createdBy : activeUser,
        createdAt: rawInput.createdAt || now,
        updatedBy: activeUser,
        updatedAt: now,
        completedBy: isDone ? (rawInput.completedBy || activeUser) : null,
        completedAt: isDone ? (rawInput.completedAt || now) : null,
        pinned: Boolean(rawInput.pinned),
        source: rawInput.source || 'manual'
      };
    }

    function calculateSubtaskProgress(task) {
      if (!task || !Array.isArray(task.subtasks) || task.subtasks.length === 0) {
        return { hasSubtasks: false, total: 0, completed: 0, percentage: task?.done ? 100 : 0 };
      }
      const total = task.subtasks.length;
      const completed = task.subtasks.filter(st => st.done).length;
      return {
        hasSubtasks: true,
        total,
        completed,
        percentage: Math.round((completed / total) * 100)
      };
    }

    function calculateDashboardMetrics(tasks = []) {
      const metrics = {
        totalTasks: tasks.length,
        completedTasks: 0,
        pendingTasks: 0,
        urgentPending: 0,
        completionRate: 0,
        byAssignee: {
          ronen: { total: 0, done: 0, pending: 0 },
          adi: { total: 0, done: 0, pending: 0 },
          both: { total: 0, done: 0, pending: 0 }
        },
        budget: { totalEstimated: 0, totalActual: 0, variance: 0 }
      };

      tasks.forEach(task => {
        const isDone = Boolean(task.done || task.status === 'done');
        if (isDone) {
          metrics.completedTasks += 1;
        } else {
          metrics.pendingTasks += 1;
          if (task.priority === 'urgent') metrics.urgentPending += 1;
        }
        const aKey = metrics.byAssignee[task.assignee] ? task.assignee : 'both';
        metrics.byAssignee[aKey].total += 1;
        if (isDone) metrics.byAssignee[aKey].done += 1;
        else metrics.byAssignee[aKey].pending += 1;

        metrics.budget.totalEstimated += Number(task.estimatedBudget) || 0;
        metrics.budget.totalActual += Number(task.actualCost) || 0;
      });

      metrics.completionRate = metrics.totalTasks > 0
        ? Math.round((metrics.completedTasks / metrics.totalTasks) * 100)
        : 0;
      metrics.budget.variance = metrics.budget.totalEstimated - metrics.budget.totalActual;
      return metrics;
    }

    // ------------------------------------------------------------------------
    // [PART 2] גשר הסנכרון ל-Gemini, מנוע ה-AI לפירוק טקסט ומחולל הוואטסאפ
    // ------------------------------------------------------------------------
    class GeminiProtocolBridge {
      static exportStateForGeminiChat(tasks = [], activeUser = 'ronen', roomId = APP_CONFIG.DEFAULT_ROOM_ID) {
        const metrics = calculateDashboardMetrics(tasks);
        const nowIso = new Date().toISOString();
        const openTasks = tasks.filter(t => !t.done);
        const completedTasks = tasks.filter(t => t.done);

        const openLines = openTasks.map((t, i) => {
          const cat = CATEGORIES[t.category]?.label || t.category;
          const assignee = USERS[t.assignee]?.name || t.assignee;
          const prio = PRIORITIES[t.priority]?.label || t.priority;
          const subProg = calculateSubtaskProgress(t);
          const subText = subProg.hasSubtasks ? ` | שלבים: ${subProg.completed}/${subProg.total}` : '';
          const budgetText = t.estimatedBudget > 0 ? ` | תקציב: ₪${t.estimatedBudget}` : '';
          return `${i + 1}. [פתוח] "${t.title}" (אחראי: ${assignee} | קטגוריה: ${cat} | דחיפות: ${prio}${budgetText}${subText})`;
        });

        const completedLines = completedTasks.map((t, i) => {
          const completedBy = USERS[t.completedBy]?.name || 'משותף';
          return `${i + 1}. [בוצע ✅ ע"י ${completedBy}] "${t.title}"`;
        });

        const syncPayload = {
          protocol: 'RONEN_ADI_GEMINI_SYNC_V1',
          exportedAt: nowIso,
          exportedBy: activeUser,
          roomId,
          tasks: tasks.map(t => ({
            id: t.id,
            title: t.title,
            category: t.category,
            assignee: t.assignee,
            priority: t.priority,
            status: t.status,
            done: t.done,
            dueDate: t.dueDate,
            estimatedBudget: t.estimatedBudget,
            actualCost: t.actualCost,
            notes: t.notes,
            subtasks: (t.subtasks || []).map(st => ({ id: st.id, title: st.title, done: st.done }))
          }))
        };

        return [
          `=== 🔄 דוח סנכרון לוח משימות רונן ועדי עבור Gemini ===`,
          `זמן: ${formatHebrewDateTime(nowIso)} | הושלמו: ${metrics.completedTasks}/${metrics.totalTasks} (${metrics.completionRate}%)`,
          ``,
          `📌 משימות פתוחות כרגע (${openTasks.length}):`,
          openLines.length > 0 ? openLines.join('\n') : 'אין משימות פתוחות.',
          ``,
          `✅ משימות שכבר בוצעו (${completedTasks.length}):`,
          completedLines.length > 0 ? completedLines.join('\n') : 'טרם סומנו משימות כבוצעות.',
          ``,
          `🤖 הנחיה ל-Gemini: כשאתה מוסיף או מעדכן עבורנו משימות, החזר בלוק JSON תקני בפורמט הבא להדבקה ישירה בדף:`,
          '```json',
          JSON.stringify(syncPayload, null, 2),
          '```'
        ].join('\n');
      }

      static parseIncomingGeminiPayload(rawText = '') {
        const cleanInput = String(rawText || '').trim();
        if (!cleanInput) throw new Error('לא הוזן טקסט לפענוח.');

        let extracted = cleanInput;
        const blockMatch = cleanInput.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (blockMatch && blockMatch[1]) {
          extracted = blockMatch[1].trim();
        } else {
          const fb = cleanInput.indexOf('{');
          const lb = cleanInput.lastIndexOf('}');
          const fArr = cleanInput.indexOf('[');
          const lArr = cleanInput.lastIndexOf(']');
          if (fb !== -1 && lb > fb && (fArr === -1 || fb < fArr)) {
            extracted = cleanInput.substring(fb, lb + 1);
          } else if (fArr !== -1 && lArr > fArr) {
            extracted = cleanInput.substring(fArr, lArr + 1);
          }
        }

        const parsed = JSON.parse(extracted);
        let rawTasks = [];
        let mode = 'merge';

        if (Array.isArray(parsed)) {
          rawTasks = parsed;
        } else if (parsed && typeof parsed === 'object') {
          if (Array.isArray(parsed.tasks)) rawTasks = parsed.tasks;
          else if (Array.isArray(parsed.items)) rawTasks = parsed.items;
          else if (parsed.title) rawTasks = [parsed];
          if (parsed.mode) mode = parsed.mode;
        }

        if (!rawTasks.length) throw new Error('לא נמצאו משימות ב-JSON.');
        return { mode, tasks: rawTasks };
      }

      static mergeTasksWithExisting(existingTasks = [], incomingRawTasks = [], activeUser = 'ronen', mode = 'merge') {
        if (mode === 'replace') {
          const replaced = incomingRawTasks.map(item => createNormalizedTask({ ...item, source: 'gemini_sync' }, activeUser));
          return { mergedTasks: replaced, addedCount: replaced.length, updatedCount: 0 };
        }

        const byId = new Map();
        const byTitle = new Map();
        existingTasks.forEach(t => {
          byId.set(t.id, t);
          byTitle.set(t.title.trim().toLowerCase(), t);
        });

        let addedCount = 0;
        let updatedCount = 0;
        const updatedList = [...existingTasks];

        incomingRawTasks.forEach(raw => {
          const norm = createNormalizedTask({ ...raw, source: 'gemini_sync' }, activeUser);
          const match = (raw.id && byId.get(raw.id)) || byTitle.get(norm.title.toLowerCase());

          if (match) {
            updatedCount += 1;
            const existingSubs = match.subtasks || [];
            const subMap = new Set(existingSubs.map(s => s.title.trim().toLowerCase()));
            const mergedSubs = [...existingSubs];
            (norm.subtasks || []).forEach(ns => {
              if (!subMap.has(ns.title.trim().toLowerCase())) mergedSubs.push(ns);
            });

            const idx = updatedList.findIndex(item => item.id === match.id);
            if (idx !== -1) {
              updatedList[idx] = {
                ...match,
                ...norm,
                id: match.id,
                done: raw.done !== undefined ? Boolean(raw.done) : match.done,
                subtasks: mergedSubs,
                updatedAt: new Date().toISOString()
              };
            }
          } else {
            addedCount += 1;
            updatedList.unshift(norm);
          }
        });

        return { mergedTasks: updatedList, addedCount, updatedCount };
      }
    }

    class SmartHebrewTaskParser {
      static parseFreeTextLocally(rawText = '') {
        const lines = String(rawText || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const parsedTasks = [];

        lines.forEach(line => {
          const cleanLine = line.replace(/^[-*•✅⭕📌\d.)\]]+\s*/, '').trim();
          if (!cleanLine) return;

          let assignee = 'both';
          if (/\b(עדי|לעדי|של עדי)\b/.test(cleanLine) && !/\b(רונן ועדי|עדי ורונן)\b/.test(cleanLine)) assignee = 'adi';
          else if (/\b(רונן|לרונן|של רונן)\b/.test(cleanLine) && !/\b(רונן ועדי|עדי ורונן)\b/.test(cleanLine)) assignee = 'ronen';

          let category = 'home';
          if (/(חתונה|אולם|צילום|צלם|שמלה|חליפה|טבעות|מוזמנים|save the date|שקיעה|יום השנה)/i.test(cleanLine)) category = 'wedding';
          else if (/(צימר|כינרת|טיול|מלון|חופשה|מסלול|יקב|נסיעה|אגרה|ווייז|waze|גולן)/i.test(cleanLine)) category = 'trip';
          else if (/(קניות|סופר|בשר|על האש|מנגל|סלט|כרוב|טחינה|חומוס|מטבוחה|בטטה|פיתות|קצב|מסעדה|meatbar|מיטבר)/i.test(cleanLine)) category = 'shopping';
          else if (/(מעגל|לוח|ספק|הנדסה|פרויקט|מצלמה|canon|אליאקספרס|קוד)/i.test(cleanLine)) category = 'projects';

          let priority = 'medium';
          if (/(דחוף|קריטי|מיידי|היום|חובה|🔥|!!)/.test(cleanLine)) priority = 'urgent';
          else if (/(חשוב|גבוה|בהקדם|לפני הסופ"ש)/.test(cleanLine)) priority = 'high';

          let estimatedBudget = 0;
          const budgetMatch = cleanLine.match(/(?:₪|ש"ח|שח|תקציב|עלות)\s*(\d[\d,]*)|(\d[\d,]*)\s*(?:₪|ש"ח|שח)/);
          if (budgetMatch) {
            estimatedBudget = Number((budgetMatch[1] || budgetMatch[2] || '').replace(/,/g, '')) || 0;
          }

          const subtasks = [];
          let finalTitle = cleanLine;
          const colonParts = cleanLine.split(':');
          if (colonParts.length === 2 && colonParts[1].includes(',')) {
            finalTitle = colonParts[0].trim();
            colonParts[1].split(',').map(s => s.trim()).filter(Boolean).forEach(sub => {
              subtasks.push({ id: generateUniqueId('sub'), title: sub, done: false });
            });
          }

          parsedTasks.push(createNormalizedTask({
            title: finalTitle,
            category,
            assignee,
            priority,
            estimatedBudget,
            subtasks,
            source: 'ai_breakdown'
          }, 'ronen'));
        });

        return parsedTasks;
      }
    }

    class UrlPayloadCodec {
      static encodeTasksToUrlParam(tasks = []) {
        try {
          const minimal = tasks.slice(0, 30).map(t => ({
            i: t.id, t: t.title, c: t.category, a: t.assignee, p: t.priority,
            d: t.done ? 1 : 0, u: t.dueDate || '', b: t.estimatedBudget || 0, n: t.notes || '',
            s: (t.subtasks || []).map(st => ({ t: st.title, d: st.done ? 1 : 0 }))
          }));
          const utf8Bytes = new TextEncoder().encode(JSON.stringify(minimal));
          let bin = '';
          utf8Bytes.forEach(b => { bin += String.fromCharCode(b); });
          return encodeURIComponent(btoa(bin));
        } catch {
          return '';
        }
      }

      static decodeTasksFromUrlParam(encoded = '') {
        if (!encoded) return null;
        try {
          const bin = atob(decodeURIComponent(encoded));
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const arr = JSON.parse(new TextDecoder().decode(bytes));
          if (!Array.isArray(arr)) return null;
          return arr.map(item => createNormalizedTask({
            id: item.i, title: item.t, category: item.c, assignee: item.a, priority: item.p,
            done: Boolean(item.d), dueDate: item.u, estimatedBudget: item.b, notes: item.n,
            subtasks: Array.isArray(item.s) ? item.s.map(s => ({ title: s.t, done: Boolean(s.d) })) : []
          }));
        } catch {
          return null;
        }
      }

      static generateShareableLink(tasks = [], roomId = APP_CONFIG.DEFAULT_ROOM_ID) {
        const base = window.location.href.split('?')[0];
        const enc = this.encodeTasksToUrlParam(tasks);
        return `${base}?room=${encodeURIComponent(roomId)}&sync=${enc}`;
      }
    }

    class WhatsAppShareEngine {
      static buildWhatsAppMessage(tasks = [], mode = 'adi_focus') {
        const metrics = calculateDashboardMetrics(tasks);
        const openTasks = tasks.filter(t => !t.done);
        const lines = [];

        if (mode === 'adi_focus') {
          const adiOpen = openTasks.filter(t => t.assignee === 'adi' || t.assignee === 'both');
          lines.push(`היי עדי ❤️, הנה עדכון מהלוח המשותף שלנו (${metrics.completedTasks}/${metrics.totalTasks} בוצעו ✅):`);
          lines.push(``);
          if (!adiOpen.length) {
            lines.push(`🎉 כל המשימות שלנו הושלמו!`);
          } else {
            lines.push(`📋 *משימות פתוחות שלנו (${adiOpen.length}):*`);
            adiOpen.forEach((t, i) => {
              const tag = t.assignee === 'adi' ? '👩🏻 עדי' : '💑 משותף';
              const subProg = calculateSubtaskProgress(t);
              const subStr = subProg.hasSubtasks ? ` [${subProg.completed}/${subProg.total}]` : '';
              lines.push(`${i + 1}. ${PRIORITIES[t.priority]?.icon || '📌'} *${t.title}* (${tag})${subStr}`);
              if (subProg.hasSubtasks) {
                t.subtasks.filter(s => !s.done).forEach(s => lines.push(`   ▫️ ${s.title}`));
              }
            });
          }
        } else if (mode === 'trip_checklist') {
          lines.push(`🏕️ *צ'ק-ליסט טיול וצימר - רונן ועדי*`);
          lines.push(``);
          tasks.filter(t => t.category === 'trip').forEach((t, i) => {
            lines.push(`${i + 1}. ${t.done ? '✅' : '⭕'} *${t.title}*${t.estimatedBudget > 0 ? ` (₪${t.estimatedBudget})` : ''}`);
          });
        } else if (mode === 'wedding_checklist') {
          lines.push(`💍 *משימות חתונה ואירועים - רונן ועדי*`);
          lines.push(``);
          tasks.filter(t => t.category === 'wedding').forEach((t, i) => {
            lines.push(`${i + 1}. ${t.done ? '✅' : '⭕'} *${t.title}* (${USERS[t.assignee]?.name})`);
          });
        } else {
          lines.push(`📊 *סיכום לוח משימות רונן ועדי (${metrics.completionRate}% הושלם)*`);
          lines.push(`תקציב מתוכנן כולל: ₪${metrics.budget.totalEstimated.toLocaleString()}`);
          lines.push(``);
          openTasks.forEach((t, i) => {
            lines.push(`${i + 1}. ⭕ *${t.title}* [${USERS[t.assignee]?.name}]`);
          });
        }

        const shareLink = UrlPayloadCodec.generateShareableLink(tasks);
        lines.push(``);
        lines.push(`🔗 *לפתיחת הלוח האינטראקטיבי וסימון שבוצע:*`);
        lines.push(shareLink);
        return lines.join('\n');
      }

      static buildSingleTaskWhatsAppMessage(task) {
        if (!task) return '';
        const lines = [
          `*משימה מהלוח של רונן ועדי:* ${task.title}`,
          `סטטוס: ${task.done ? 'בוצע ✅' : 'לביצוע ⭕'} | אחראי: ${USERS[task.assignee]?.name}`
        ];
        if (task.estimatedBudget > 0) lines.push(`💰 תקציב משוער: ₪${task.estimatedBudget.toLocaleString()}`);
        if (task.notes) lines.push(`📝 הערות: ${task.notes}`);
        if (task.subtasks?.length) {
          lines.push(``, `*שלבים:*`);
          task.subtasks.forEach(s => lines.push(`${s.done ? '✅' : '▫️'} ${s.title}`));
        }
        return lines.join('\n');
      }
    }

      getFilteredAndSortedTasks() {
        const q = this.filters.searchQuery.trim().toLowerCase();
        return [...this.tasks]
          .filter(t => {
            if (this.filters.status === 'open' && t.done) return false;
            if (this.filters.status === 'done' && !t.done) return false;

            if (this.filters.assignee === 'ronen' && !(t.assignee === 'ronen' || t.assignee === 'both')) return false;
            if (this.filters.assignee === 'adi' && !(t.assignee === 'adi' || t.assignee === 'both')) return false;
            if (this.filters.assignee === 'both_only' && t.assignee !== 'both') return false;

            if (this.filters.category !== 'all' && t.category !== this.filters.category) return false;

            if (q) {
              const inTitle = t.title.toLowerCase().includes(q);
              const inNotes = (t.notes || '').toLowerCase().includes(q);
              const inSub = (t.subtasks || []).some(s => s.title.toLowerCase().includes(q));
              if (!inTitle && !inNotes && !inSub) return false;
            }
            return true;
          })
          .sort((a, b) => {
            if (a.done !== b.done) return a.done ? 1 : -1;
            if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
            const wA = PRIORITIES[a.priority]?.weight || 2;
            const wB = PRIORITIES[b.priority]?.weight || 2;
            if (wA !== wB) return wB - wA;
            return new Date(b.createdAt) - new Date(a.createdAt);
          });
      }

                    <option value="both" selected>💑 משותף</option>
                    <option value="ronen">👨🏻‍💻 רונן</option>
                    <option value="adi">👩🏻 עדי</option>
                  </select>
                  <select id="new-task-category" class="rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm font-medium">
                    ${catOptions}
                  </select>
                  <button type="button" data-action="toggle-quickadd-expand"
                    class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-600 hover:bg-slate-100 cursor-pointer">
                    ${this.isQuickAddExpanded ? 'פחות ▲' : 'תקציב ושלבים ▼'}
                  </button>
                  <button type="submit"
                    class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white font-bold text-xs sm:text-sm cursor-pointer">
                    + הוסף משימה
                  </button>
                </div>
              </div>

              <div class="${this.isQuickAddExpanded ? 'grid' : 'hidden'} grid-cols-1 sm:grid-cols-4 gap-2.5 pt-2.5 border-t border-slate-100">
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">דחיפות</label>
                  <select id="new-task-priority" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs">${prioOptions}</select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">תאריך יעד</label>
                  <input type="date" id="new-task-duedate" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">תקציב משוער (₪)</label>
                  <input type="number" id="new-task-budget" min="0" step="10" placeholder="0" class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">תתי-משימות (מופרדות בפסיק)</label>
                  <input type="text" id="new-task-subtasks" placeholder="שלב 1, שלב 2, שלב 3..." class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs" />
                </div>
                <div class="sm:col-span-4">
                  <input type="text" id="new-task-notes" placeholder="הערות, דגשים או לינק..." class="w-full rounded-lg border border-slate-300 px-2.5 py-1.5 text-xs" />
                </div>
              </div>
            </form>
            <div class="flex items-center gap-2 flex-wrap mt-2.5 pt-2 border-t border-slate-100">
              <span class="text-xs font-bold text-slate-400">⚡ תבניות מהירות:</span>
              ${tplButtons}
            </div>
          </section>
        `;
      }

      renderToolbar() {
        const views = [
          { id: 'cards', label: '🗂️ כרטיסיות ושלבים' },
          { id: 'table', label: '📊 טבלה הנדסית ותקציב' },
          { id: 'kanban', label: '📋 לוח קנבן' },
          { id: 'audit', label: `🕒 יומן פעילות (${this.auditLogs.length})` }
        ];

        const viewBtns = views.map(v => `
          <button type="button" data-action="switch-view" data-view="${v.id}"
            class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold cursor-pointer transition-all ${
              this.activeView === v.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }">${v.label}</button>
        `).join('');

        const assigneeBtns = [
          { id: 'all', label: 'הכל' },
          { id: 'ronen', label: '👨🏻‍💻 רונן' },
          { id: 'adi', label: '👩🏻 עדי' },
          { id: 'both_only', label: '💑 משותף בלבד' }
        ].map(a => `
          <button type="button" data-action="filter-assignee" data-assignee="${a.id}"
            class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${
              this.filters.assignee === a.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
            }">${a.label}</button>
        `).join('');

        const catBtns = [
          { id: 'all', label: 'כל הקטגוריות' },
          ...Object.values(CATEGORIES).map(c => ({ id: c.id, label: `${c.icon} ${c.label}` }))
        ].map(c => `
          <button type="button" data-action="filter-category" data-category="${c.id}"
            class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${
              this.filters.category === c.id ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'
            }">${c.label}</button>
        `).join('');

        document.getElementById('app-toolbar-slot').innerHTML = `
          <section class="bg-white rounded-2xl shadow-xs border border-slate-200 p-3.5 mb-5 space-y-2.5">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-2.5">
              <div class="flex flex-wrap gap-1.5">${viewBtns}</div>
              <div class="flex items-center gap-2">
                <input type="search" id="search-input" value="${escapeHtml(this.filters.searchQuery)}"
                  placeholder="חיפוש משימה או שלב..."
                  class="rounded-xl border border-slate-300 px-3 py-1.5 text-xs sm:text-sm outline-none focus:border-indigo-500" />
                <select id="status-filter-select" class="rounded-xl border border-slate-300 px-2.5 py-1.5 text-xs font-bold">
                  <option value="all" ${this.filters.status === 'all' ? 'selected' : ''}>כל הסטטוסים</option>
                  <option value="open" ${this.filters.status === 'open' ? 'selected' : ''}>⭕ פתוחות בלבד</option>
                  <option value="done" ${this.filters.status === 'done' ? 'selected' : ''}>✅ בוצעו בלבד</option>
                </select>
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
              <div class="flex flex-wrap items-center gap-1.5">${assigneeBtns}</div>
              <div class="flex flex-wrap items-center gap-1.5">${catBtns}</div>
            </div>
          </section>
        `;
      }

      renderMainView() {
        const slot = document.getElementById('app-mainview-slot');
        const tasks = this.getFilteredAndSortedTasks();

        if (this.activeView === 'cards') {
          if (!tasks.length) {
            slot.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center text-sm text-slate-500">אין משימות בתצוגה זו.</div>`;
            return;
          }
          slot.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${tasks.map(t => this.renderSingleCard(t)).join('')}</div>`;
        } else if (this.activeView === 'table') {
          slot.innerHTML = this.renderTableView(tasks);
        } else if (this.activeView === 'kanban') {
          slot.innerHTML = this.renderKanban(tasks);
        } else {
          slot.innerHTML = this.renderAudit();
        }
      }

      renderSingleCard(task) {
        const cat = CATEGORIES[task.category] || CATEGORIES.home;
        const owner = USERS[task.assignee] || USERS.both;
        const prio = PRIORITIES[task.priority] || PRIORITIES.medium;
        const subProg = calculateSubtaskProgress(task);

        const subtasksHtml = (task.subtasks || []).map(sub => `
          <li class="flex items-center justify-between gap-2 py-1 px-2 rounded-lg hover:bg-slate-100">
            <label class="flex items-center gap-2 cursor-pointer flex-1">
              <input type="checkbox" data-action="toggle-subtask" data-task-id="${task.id}" data-subtask-id="${sub.id}"
                ${sub.done ? 'checked' : ''} class="w-4 h-4 rounded text-indigo-600 cursor-pointer" />
              <span class="text-xs sm:text-sm ${sub.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'}">${escapeHtml(sub.title)}</span>
            </label>
            <button type="button" data-action="delete-subtask" data-task-id="${task.id}" data-subtask-id="${sub.id}"
              class="text-slate-300 hover:text-red-500 text-xs px-1 cursor-pointer">✕</button>
          </li>
        `).join('');

        return `
          <article class="bg-white rounded-2xl border ${
            task.done ? 'border-emerald-200 bg-emerald-50/20 opacity-85' : task.pinned ? 'border-indigo-400 shadow-md' : 'border-slate-200 shadow-xs'
          } p-4 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 flex-wrap mb-2.5">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="px-2 py-0.5 rounded-full text-xs font-semibold border ${cat.badge}">${cat.icon} ${cat.label}</span>
                  <span class="px-2 py-0.5 rounded-full text-xs font-semibold border ${owner.badgeClass}">${owner.avatar} ${owner.name}</span>
                  <span class="px-2 py-0.5 rounded-full text-xs border ${prio.badge}">${prio.icon} ${prio.label}</span>
                </div>
                <div class="flex items-center gap-1">
                  <button type="button" data-action="whatsapp-single" data-task-id="${task.id}" class="p-1 text-xs hover:bg-emerald-50 rounded cursor-pointer" title="שלח משימה זו לעדי בוואטסאפ">📲</button>
                  <button type="button" data-action="delete-task" data-task-id="${task.id}" class="p-1 text-xs text-slate-400 hover:text-red-600 cursor-pointer" title="מחק">🗑️</button>
                </div>
              </div>

              <div class="flex items-start gap-3 my-2">
                <button type="button" data-action="toggle-task-done" data-task-id="${task.id}"
                  class="mt-0.5 w-7 h-7 rounded-xl flex items-center justify-center border-2 cursor-pointer shrink-0 ${
                    task.done ? 'bg-emerald-500 border-emerald-500 text-white font-bold' : 'border-slate-300 bg-white text-transparent hover:border-indigo-500'
                  }">✓</button>
                <div class="flex-1">
                  <h3 class="text-base font-bold ${task.done ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHtml(task.title)}</h3>
                  ${task.notes ? `<p class="text-xs text-slate-600 mt-1 bg-slate-50 p-2 rounded-lg border border-slate-100">📝 ${escapeHtml(task.notes)}</p>` : ''}
                </div>
              </div>

              <div class="mt-3 pt-2.5 border-t border-slate-100">
                <div class="flex items-center justify-between text-xs text-slate-600 mb-1">
                  <span class="font-bold text-indigo-700">שלבים ותתי-משימות (${subProg.completed}/${subProg.total})</span>
                  <span class="font-mono font-bold">${subProg.percentage}%</span>
                </div>
                ${subProg.hasSubtasks ? `
                  <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-2">
                    <div class="h-full bg-indigo-600" style="width:${subProg.percentage}%"></div>
                  </div>
                  <ul class="divide-y divide-slate-100 bg-slate-50 rounded-xl p-1.5 border border-slate-200/60 mb-2">${subtasksHtml}</ul>
                ` : ''}
                <div class="flex items-center gap-1.5">
                  <input type="text" id="sub-input-${task.id}" placeholder="הוסף שלב ביצוע..." class="flex-1 rounded-lg border border-slate-300 px-2.5 py-1 text-xs outline-none" />
                  <button type="button" data-action="add-subtask" data-task-id="${task.id}" class="px-2.5 py-1 rounded-lg bg-slate-800 text-white text-xs font-bold cursor-pointer">+ שלב</button>
                </div>
              </div>
            </div>

            <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
              <span>📅 ${formatHebrewDateShort(task.dueDate)}</span>
              ${task.estimatedBudget > 0 ? `<span class="font-bold text-emerald-700">💰 ₪${Number(task.estimatedBudget).toLocaleString()}</span>` : ''}
              <span>${task.done ? `✅ סומן ע"י ${USERS[task.completedBy]?.name || 'משותף'}` : ''}</span>
            </div>
          </article>
        `;
      }

      renderTableView(tasks) {
        const metrics = calculateDashboardMetrics(tasks);
        const rows = tasks.map((t, i) => {
          const diff = (Number(t.estimatedBudget) || 0) - (Number(t.actualCost) || 0);
          return `
            <tr class="hover:bg-slate-50 ${t.done ? 'bg-emerald-50/30 text-slate-400' : ''}">
              <td class="px-3 py-2 text-center font-mono text-xs">${i + 1}</td>
              <td class="px-3 py-2 text-center">
                <input type="checkbox" data-action="toggle-task-done" data-task-id="${t.id}" ${t.done ? 'checked' : ''} class="w-4 h-4 rounded cursor-pointer" />
              </td>
              <td class="px-3 py-2 font-bold text-xs sm:text-sm ${t.done ? 'line-through' : ''}">${escapeHtml(t.title)}</td>
              <td class="px-2 py-2">
                <select data-action="inline-field" data-task-id="${t.id}" data-field="assignee" class="border rounded px-1.5 py-1 text-xs">
                  <option value="both" ${t.assignee === 'both' ? 'selected' : ''}>💑 משותף</option>
                  <option value="ronen" ${t.assignee === 'ronen' ? 'selected' : ''}>👨🏻‍💻 רונן</option>
                  <option value="adi" ${t.assignee === 'adi' ? 'selected' : ''}>👩🏻 עדי</option>
                </select>
              </td>
              <td class="px-2 py-2">
                <input type="number" value="${Number(t.estimatedBudget) || 0}" data-action="inline-field" data-task-id="${t.id}" data-field="estimatedBudget" class="w-20 border rounded px-1.5 py-1 text-xs font-mono" />
              </td>
              <td class="px-2 py-2">
                <input type="number" value="${Number(t.actualCost) || 0}" data-action="inline-field" data-task-id="${t.id}" data-field="actualCost" class="w-20 border rounded px-1.5 py-1 text-xs font-mono" />
              </td>
              <td class="px-3 py-2 font-mono text-xs font-bold ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}">₪${diff.toLocaleString()}</td>
            </tr>
          `;
        }).join('');

        return `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
            <table class="w-full text-right border-collapse">
              <thead>
                <tr class="bg-slate-100 text-slate-600 text-xs font-bold border-b">
                  <th class="px-3 py-2.5 text-center">#</th>
                  <th class="px-3 py-2.5 text-center">בוצע</th>
                  <th class="px-3 py-2.5">משימה</th>
                  <th class="px-2 py-2.5">אחראי</th>
                  <th class="px-2 py-2.5">תקציב מתוכנן (₪)</th>
                  <th class="px-2 py-2.5">עלות בפועל (₪)</th>
                  <th class="px-3 py-2.5">הפרש (₪)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">${rows}</tbody>
              <tfoot>
                <tr class="bg-slate-900 text-white font-bold text-xs">
                  <td colspan="4" class="px-3 py-2.5">סה"כ לתצוגה הנוכחית:</td>
                  <td class="px-2 py-2.5 font-mono">₪${metrics.budget.totalEstimated.toLocaleString()}</td>
                  <td class="px-2 py-2.5 font-mono">₪${metrics.budget.totalActual.toLocaleString()}</td>
                  <td class="px-3 py-2.5 font-mono">₪${metrics.budget.variance.toLocaleString()}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        `;
      }

      renderKanban(tasks) {
        const cols = [
          { id: 'todo', title: '⭕ לביצוע', list: tasks.filter(t => !t.done && t.status !== 'in_progress') },
          { id: 'in_progress', title: '⏳ בתהליך', list: tasks.filter(t => !t.done && t.status === 'in_progress') },
          { id: 'done', title: '✅ בוצע', list: tasks.filter(t => t.done) }
        ];
        return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cols.map(c => `
          <div class="bg-slate-100 rounded-2xl p-3 border border-slate-200">
            <div class="font-bold text-sm mb-2.5 flex justify-between"><span>${c.title}</span><span>${c.list.length}</span></div>
            <div class="space-y-2">${c.list.map(t => `
              <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-2xs space-y-2">
                <div class="text-xs font-bold text-slate-500">${USERS[t.assignee]?.avatar} ${USERS[t.assignee]?.name}</div>
                <div class="font-bold text-sm">${escapeHtml(t.title)}</div>
                <div class="flex gap-1 pt-1">
                  ${c.id !== 'todo' ? `<button type="button" data-action="set-status" data-task-id="${t.id}" data-status="todo" class="text-[11px] px-2 py-0.5 bg-slate-100 rounded cursor-pointer">לביצוע</button>` : ''}
                  ${c.id !== 'in_progress' ? `<button type="button" data-action="set-status" data-task-id="${t.id}" data-status="in_progress" class="text-[11px] px-2 py-0.5 bg-amber-100 rounded cursor-pointer">בתהליך</button>` : ''}
                  ${c.id !== 'done' ? `<button type="button" data-action="set-status" data-task-id="${t.id}" data-status="done" class="text-[11px] px-2 py-0.5 bg-emerald-600 text-white rounded cursor-pointer">בוצע ✓</button>` : ''}
                </div>
              </div>
            `).join('')}</div>
          </div>
        `).join('')}</div>`;
      }

      renderAudit() {
        if (!this.auditLogs.length) {
          return `<div class="bg-white rounded-2xl border p-6 text-center text-xs text-slate-500">טרם נרשמו פעולות ביומן.</div>`;
        }
        return `<div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">${this.auditLogs.map(l => `
          <div class="p-3 flex items-center justify-between text-xs sm:text-sm">
            <div><span>${l.actorAvatar}</span> <strong>${escapeHtml(l.actorName)}</strong> ${escapeHtml(l.action)} ${l.taskTitle ? `— <span class="text-indigo-700 font-semibold">"${escapeHtml(l.taskTitle)}"</span>` : ''}</div>
            <time class="text-xs font-mono text-slate-400">${formatHebrewDateTime(l.timestamp)}</time>
          </div>
        `).join('')}</div>`;
      }

      renderActiveModal() {
        const slot = document.getElementById('app-modal-slot');
        if (!this.activeModal) {
          slot.innerHTML = '';
          return;
        }

        if (this.activeModal === 'gemini-hub') {
          const exportText = GeminiProtocolBridge.exportStateForGeminiChat(this.tasks, this.activeUser, this.roomId);
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border overflow-hidden my-8">
                <div class="px-5 py-3.5 bg-indigo-600 text-white flex justify-between items-center">
                  <h2 class="font-extrabold text-base">✨ מרכז ה-AI וגשר הסנכרון הדו-כיווני ל-Gemini</h2>
                  <button type="button" data-action="close-modal" class="text-white font-bold text-lg cursor-pointer">✕</button>
                </div>
                <div class="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
                  <div class="bg-slate-50 p-3.5 rounded-xl border space-y-2">
                    <h3 class="text-xs sm:text-sm font-bold">1️⃣ פירוק טקסט חופשי בעברית למשימות (מזהה אוטומטית את רונן/עדי, קטגוריה ותקציב)</h3>
                    <textarea id="ai-free-text" rows="3" placeholder="לדוגמה:&#10;לעדי להזמין צלם לשקיעה תקציב 450 ש״ח דחוף&#10;לרונן לקנות לעל האש: אנטריקוט, פרגיות, חומוס, טחינה, כרוב לבן 400 ש״ח" class="w-full border rounded-xl p-2.5 text-xs"></textarea>
                    <button type="button" data-action="run-ai-breakdown" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold cursor-pointer">⚡ פרק והוסף ללוח</button>
                  </div>

                  <div class="bg-blue-50/50 p-3.5 rounded-xl border border-blue-200 space-y-2">
                    <div class="flex justify-between items-center">
                      <h3 class="text-xs sm:text-sm font-bold">2️⃣ העתקת דוח סנכרון להדבקה בצ'אט שלנו עם Gemini</h3>
                      <button type="button" data-action="copy-gemini-export" class="px-3 py-1 bg-blue-600 text-white rounded-lg text-xs font-bold cursor-pointer">📋 העתק דוח ל-Gemini</button>
                    </div>
                    <textarea id="gemini-export-box" readonly rows="4" class="w-full border rounded-xl p-2 text-xs font-mono bg-white">${escapeHtml(exportText)}</textarea>
                  </div>

                  <div class="bg-emerald-50/50 p-3.5 rounded-xl border border-emerald-200 space-y-2">
                    <h3 class="text-xs sm:text-sm font-bold">3️⃣ הזרקת משימות מ-Gemini ללוח (הדבק כאן JSON שקיבלת בצ'אט)</h3>
                    <textarea id="gemini-import-box" rows="3" placeholder="הדבק כאן את בלוק ה-JSON שקיבלת מ-Gemini בצ'אט..." class="w-full border rounded-xl p-2 text-xs font-mono bg-white"></textarea>
                    <button type="button" data-action="import-gemini-json" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold cursor-pointer">📥 מזג משימות ללוח</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else if (this.activeModal === 'whatsapp-share') {
          const waText = WhatsAppShareEngine.buildWhatsAppMessage(this.tasks, this.whatsappMode);
          slot.innerHTML = `
            <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl border overflow-hidden">
                <div class="px-5 py-3.5 bg-emerald-600 text-white flex justify-between items-center">
                  <h2 class="font-extrabold text-base">📲 שליחת עדכון וקישור סנכרון לעדי ב-WhatsApp</h2>
                  <button type="button" data-action="close-modal" class="text-white font-bold text-lg cursor-pointer">✕</button>
                </div>
                <div class="p-5 space-y-3.5">
                  <div class="flex flex-wrap gap-1.5">
                    <button type="button" data-action="wa-mode" data-mode="adi_focus" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.whatsappMode === 'adi_focus' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">👩🏻 משימות עדי + משותפות</button>
                    <button type="button" data-action="wa-mode" data-mode="full_status" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.whatsappMode === 'full_status' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">📊 דוח מלא</button>
                    <button type="button" data-action="wa-mode" data-mode="trip_checklist" class="px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer ${this.whatsappMode === 'trip_checklist' ? 'bg-emerald-600 text-white' : 'bg-slate-100'}">🏕️ צ'ק-ליסט צימר</button>
                  </div>
                  <textarea id="wa-preview-box" rows="8" class="w-full border rounded-xl p-3 text-xs sm:text-sm bg-slate-50">${escapeHtml(waText)}</textarea>
                  <div class="flex justify-end gap-2">
                    <button type="button" data-action="copy-wa-text" class="px-3.5 py-2 border rounded-xl text-xs font-bold cursor-pointer">📋 העתק הודעה</button>
                    <button type="button" data-action="send-wa-now" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold cursor-pointer">🚀 שלח ב-WhatsApp לעדי</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }

      // ----------------------------------------------------------------------
      // חיבור כל האירועים (Event Delegation)
      // ----------------------------------------------------------------------
      bindGlobalEvents() {
        document.addEventListener('submit', e => {
          if (e.target.id === 'quick-add-form') {
            e.preventDefault();
            const title = document.getElementById('new-task-title')?.value.trim();
            if (!title) return;
            const assignee = document.getElementById('new-task-assignee')?.value || 'both';
            const category = document.getElementById('new-task-category')?.value || 'home';
            const priority = document.getElementById('new-task-priority')?.value || 'medium';
            const dueDate = document.getElementById('new-task-duedate')?.value || '';
            const estimatedBudget = Number(document.getElementById('new-task-budget')?.value) || 0;
            const notes = document.getElementById('new-task-notes')?.value || '';
            const subtasksRaw = document.getElementById('new-task-subtasks')?.value || '';

            const subtasks = subtasksRaw.split(',').map(s => s.trim()).filter(Boolean).map(s => ({
              id: generateUniqueId('sub'), title: s, done: false
            }));

            const newTask = createNormalizedTask({
              title, assignee, category, priority, dueDate, estimatedBudget, notes, subtasks
            }, this.activeUser);

            this.tasks.unshift(newTask);
            this.saveData();
            this.logAudit('הוסיף/ה משימה חדשה', newTask.title);
            this.showToast(`המשימה "${newTask.title}" נוספה ללוח!`);
            this.renderAll();
          }
        });

        document.addEventListener('click', e => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.dataset.action;

          if (action === 'switch-user') {
            this.activeUser = btn.dataset.user;
            localStorage.setItem(APP_CONFIG.LOCAL_USER_KEY, this.activeUser);
            this.showToast(`משתמש פעיל כעת: ${USERS[this.activeUser].name} ${USERS[this.activeUser].avatar}`);
            this.renderAll();
          } else if (action === 'toggle-quickadd-expand') {
            this.isQuickAddExpanded = !this.isQuickAddExpanded;
            this.renderQuickAdd();
          } else if (action === 'load-template') {
            const tpl = PRESET_TEMPLATES[btn.dataset.template];
            if (tpl) {
              const created = tpl.tasks.map(t => createNormalizedTask(t, this.activeUser));
              this.tasks = [...created, ...this.tasks];
              this.saveData();
              this.logAudit(`טען/ה תבנית: ${tpl.title}`);
              this.showToast(`נטענו ${created.length} משימות מתוך "${tpl.title}"!`, 'emerald');
              this.renderAll();
            }
          } else if (action === 'switch-view') {
            this.activeView = btn.dataset.view;
            this.renderToolbar();
            this.renderMainView();
          } else if (action === 'filter-assignee') {
            this.filters.assignee = btn.dataset.assignee;
            this.renderToolbar();
            this.renderMainView();
          } else if (action === 'filter-category') {
            this.filters.category = btn.dataset.category;
            this.renderToolbar();
            this.renderMainView();
          } else if (action === 'toggle-task-done') {
            const taskId = btn.dataset.taskId;
            const now = new Date().toISOString();
            this.tasks = this.tasks.map(t => {
              if (t.id !== taskId) return t;
              const nextDone = !t.done;
              this.logAudit(nextDone ? 'סימן/ה כבוצע ✅' : 'החזיר/ה למצב פתוח', t.title);
              return {
                ...t,
                done: nextDone,
                status: nextDone ? 'done' : 'todo',
                completedBy: nextDone ? this.activeUser : null,
                completedAt: nextDone ? now : null
              };
            });
            this.saveData();
            this.renderHeader();
            this.renderMainView();
          } else if (action === 'add-subtask') {
            const taskId = btn.dataset.taskId;
            const input = document.getElementById(`sub-input-${taskId}`);
            const val = input?.value.trim();
            if (!val) return;
            this.tasks = this.tasks.map(t => {
              if (t.id !== taskId) return t;
              return {
                ...t,
                subtasks: [...(t.subtasks || []), { id: generateUniqueId('sub'), title: val, done: false }]
              };
            });
            this.saveData();
            this.renderMainView();
          } else if (action === 'toggle-subtask') {
            const { taskId, subtaskId } = btn.dataset;
            this.tasks = this.tasks.map(t => {
              if (t.id !== taskId) return t;
              return {
                ...t,
                subtasks: (t.subtasks || []).map(s => s.id === subtaskId ? { ...s, done: !s.done, completedBy: this.activeUser } : s)
              };
            });
            this.saveData();
            this.renderMainView();
          } else if (action === 'delete-subtask') {
            const { taskId, subtaskId } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === taskId ? { ...t, subtasks: (t.subtasks || []).filter(s => s.id !== subtaskId) } : t);
            this.saveData();
            this.renderMainView();
          } else if (action === 'delete-task') {
            const taskId = btn.dataset.taskId;
            this.tasks = this.tasks.filter(t => t.id !== taskId);
            this.saveData();
            this.renderAll();
          } else if (action === 'set-status') {
            const { taskId, status } = btn.dataset;
            this.tasks = this.tasks.map(t => t.id === taskId ? { ...t, status, done: status === 'done', completedBy: status === 'done' ? this.activeUser : null } : t);
            this.saveData();
            this.renderAll();
          } else if (action === 'open-modal') {
            this.activeModal = btn.dataset.modal;
            this.renderActiveModal();
          } else if (action === 'close-modal') {
            this.activeModal = null;
            this.renderActiveModal();
          } else if (action === 'run-ai-breakdown') {
            const raw = document.getElementById('ai-free-text')?.value || '';
            const created = SmartHebrewTaskParser.parseFreeTextLocally(raw);
            if (created.length) {
              this.tasks = [...created, ...this.tasks];
              this.saveData();
              this.activeModal = null;
              this.showToast(`פורקו ונוספו ${created.length} משימות חדשות! ⚡`, 'emerald');
              this.renderAll();
            }
          } else if (action === 'copy-gemini-export') {
            const txt = document.getElementById('gemini-export-box')?.value || '';
            navigator.clipboard.writeText(txt);
            this.showToast('דוח הסנכרון הועתק! הדבק אותו בצ׳אט עם Gemini 📋', 'emerald');
          } else if (action === 'import-gemini-json') {
            try {
              const raw = document.getElementById('gemini-import-box')?.value || '';
              const parsed = GeminiProtocolBridge.parseIncomingGeminiPayload(raw);
              const res = GeminiProtocolBridge.mergeTasksWithExisting(this.tasks, parsed.tasks, this.activeUser, parsed.mode);
              this.tasks = res.mergedTasks;
              this.saveData();
              this.activeModal = null;
              this.showToast(`מוזגו מ-Gemini בהצלחה: ${res.addedCount} חדשות, ${res.updatedCount} עודכנו!`, 'emerald');
              this.renderAll();
            } catch (err) {
              this.showToast(err.message, 'red');
            }
          } else if (action === 'wa-mode') {
            this.whatsappMode = btn.dataset.mode;
            this.renderActiveModal();
          } else if (action === 'copy-wa-text') {
            const txt = document.getElementById('wa-preview-box')?.value || '';
            navigator.clipboard.writeText(txt);
            this.showToast('ההודעה לעדי הועתקה ללוח! 📋', 'emerald');
          } else if (action === 'send-wa-now') {
            const txt = document.getElementById('wa-preview-box')?.value || '';
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
          } else if (action === 'whatsapp-single') {
            const task = this.tasks.find(t => t.id === btn.dataset.taskId);
            if (task) {
              const msg = WhatsAppShareEngine.buildSingleTaskWhatsAppMessage(task);
              window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
            }
          } else if (action === 'export-backup-file') {
            const blob = new Blob([JSON.stringify(this.tasks, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ronen-adi-tasks-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
          } else if (action === 'reset-demo-data') {
            this.tasks = this.getSeedTasks();
            this.saveData();
            this.renderAll();
            this.showToast('הנתונים אופסו לברירת המחדל.');
          }
        });

        document.addEventListener('input', e => {
          if (e.target.id === 'search-input') {
            this.filters.searchQuery = e.target.value;
            this.renderMainView();
          }
        });

        document.addEventListener('change', e => {
          if (e.target.id === 'status-filter-select') {
            this.filters.status = e.target.value;
            this.renderMainView();
          } else if (e.target.dataset.action === 'inline-field') {
            const { taskId, field } = e.target.dataset;
            const val = field === 'estimatedBudget' || field === 'actualCost' ? Number(e.target.value) || 0 : e.target.value;
            this.tasks = this.tasks.map(t => t.id === taskId ? { ...t, [field]: val } : t);
            this.saveData();
            this.renderHeader();
            this.renderMainView();
          }
        });
      }
    }

    // אתחול האפליקציה בטעינת הדף
    window.addEventListener('DOMContentLoaded', () => {
      window.ronenAdiApp = new MasterApplication();
    });
  </script>
</body>
